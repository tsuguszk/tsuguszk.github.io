/* レスポンシブデザイン(モバイル対応) */
@media screen and (max-width: 768px) {
    body {
        padding: 10px;
        line-height: 1.6;
    }

    table {
        width: 100% !important;
        display: block;
        overflow-x: auto;
        height: auto !important;
    }

    table tr {
        display: block;
        margin-bottom: 20px;
        height: auto !important;
    }

    table td {
        display: block;
        width: 100% !important;
        height: auto !important;
        padding: 12px 0 !important;
    }

    img {
        max-width: 100%;
        height: auto !important;
        width: auto !important;
        margin: 10px 0;
    }

    iframe {
        max-width: 100%;
        width: 100% !important;
        height: auto;
        min-height: 300px;
    }

    h2, h3, h4 {
        font-size: 1.1em;
        padding: 0 10px;
        line-height: 1.5;
    }

    center, CENTER {
        text-align: center;
        padding: 0 10px;
    }

    p {
        font-size: 14px;
        line-height: 1.6;
        margin: 8px 0;
    }

    form {
        margin: 10px 0;
    }

    input[type="text"], input[type="submit"] {
        font-size: 14px;
        max-width: 90%;
    }
}
</style>
