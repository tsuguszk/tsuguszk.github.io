<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QTc解析</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
            max-width: 95%;
            margin: 0 auto;
            padding: 20px;
            background: #0f1724;
            color: #e0e6ed;
            user-select: none;
            min-height: 100vh;
        }

        .container {
            background: #151f2e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border: 1px solid #2a3a4e;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #2196F3;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            color: #ffffff;
            font-size: 1.5em;
        }

        .btn-reset {
            background: #e74c3c;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-size: 0.9em;
            transition: background 0.2s;
        }

        .btn-reset:hover {
            background: #c0392b;
        }

        .input-wrapper {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .input-area {
            flex: 1;
            border: 3px dashed #3a4f6e;
            border-radius: 10px;
            padding: 6px 15px;
            text-align: center;
            background: #1a2738;
            transition: all 0.2s;
            cursor: pointer;
            position: relative;
        }

        .input-area:hover {
            background-color: #1f2e42;
        }

        .input-area.dragover {
            background-color: #1a3a3a;
            border-color: #38b2ac;
            transform: scale(1.01);
        }

        .input-area.active {
            border-color: #2196F3;
            background-color: #1a3555;
            box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.2);
        }

        .input-label {
            font-weight: bold;
            font-size: 0.95em;
            color: #8ab4f8;
            margin-bottom: 5px;
            display: block;
        }

        .input-sub {
            font-size: 0.8em;
            color: #a0aec0;
            margin-bottom: 8px;
        }

        .btn-select {
            background: #2196F3;
            color: white;
            padding: 8px 20px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-size: 0.9em;
            transition: background 0.2s;
        }

        .btn-select:hover {
            background: #1976D2;
        }

        input[type="file"] {
            display: none;
        }

        .result-container-wrapper {
            display: flex;
            flex-direction: row;
            gap: 20px;
            align-items: flex-start;
        }

        .result-card {
            flex: 1;
            min-width: 0;
            border: 1px solid #2a3a4e;
            border-radius: 8px;
            padding: 15px;
            background: #1a2738;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            display: none;
        }

        .result-card.visible {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-label {
            background: #2196F3;
            color: #fff;
            display: inline-block;
            padding: 4px 12px;
            font-size: 0.85em;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a3a4e;
            padding-bottom: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 5px;
        }

        .file-name {
            font-weight: bold;
            color: #8ab4f8;
            font-size: 0.9em;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 200px;
        }

        .instructions {
            font-size: 0.75em;
            color: #e0e6ed;
            background: #3a4f6e;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid #4a5f7e;
        }

        .calibration-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            padding: 8px 12px;
            background: #0d1724;
            border-radius: 6px;
            border: 1px solid #2a3a4e;
            flex-wrap: wrap;
        }

        .calibration-bar label {
            font-size: 0.85em;
            color: #8ab4f8;
            font-weight: bold;
        }

        .calibration-bar .cal-value {
            font-size: 0.85em;
            color: #e0e6ed;
            background: #1a2738;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid #3a4f6e;
        }

        .cal-method {
            font-size: 0.75em;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: bold;
        }

        .cal-method.auto-scale {
            background: #00897b;
            color: #fff;
        }

        .cal-method.grid-fallback {
            background: #ff8f00;
            color: #fff;
        }

        .cal-method.manual {
            background: #1565c0;
            color: #fff;
        }

        .cal-method.drag {
            background: #6a1b9a;
            color: #fff;
        }

        .calibration-bar input[type="number"] {
            width: 80px;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #3a4f6e;
            background: #1a2738;
            color: #e0e6ed;
            font-size: 0.85em;
            text-align: center;
        }

        .btn-reanalyze {
            background: #7c4dff;
            color: white;
            padding: 6px 16px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: bold;
            transition: background 0.2s;
            margin-left: 8px;
        }

        .btn-reanalyze:hover {
            background: #651fff;
        }

        .channel-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 10px;
            padding: 6px 12px;
            background: #0d1724;
            border-radius: 6px;
            border: 1px solid #2a3a4e;
        }

        .channel-bar.hidden {
            display: none;
        }

        .channel-bar .ch-label {
            font-size: 0.8em;
            color: #8ab4f8;
            font-weight: bold;
            margin-right: 4px;
        }

        .ch-btn {
            padding: 4px 14px;
            border-radius: 4px;
            border: 2px solid #3a4f6e;
            cursor: pointer;
            font-size: 0.8em;
            font-weight: bold;
            transition: all 0.15s;
            background: #1a2738;
            color: #e0e6ed;
        }

        .ch-btn:hover {
            border-color: #5a7f9e;
        }

        .ch-btn.ch-active {
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.2);
        }

        .ch-btn.ch-black {
            color: #aaa;
        }

        .ch-btn.ch-black.ch-active {
            border-color: #fff;
            background: #444;
            color: #fff;
        }

        .ch-btn.ch-green {
            color: #4caf50;
        }

        .ch-btn.ch-green.ch-active {
            border-color: #4caf50;
            background: #1b3a1b;
            color: #66ff66;
        }

        .ch-btn.ch-red {
            color: #e91e3a;
        }

        .ch-btn.ch-red.ch-active {
            border-color: #e91e3a;
            background: #3a1a1a;
            color: #ff6666;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }

        .metric-box {
            background: #0d1724;
            padding: 8px 4px;
            border-radius: 6px;
            text-align: center;
            border: 1px solid #2a3a4e;
        }

        .metric-box h3 {
            margin: 0 0 3px 0;
            font-size: 0.7em;
            color: #8ab4f8;
        }

        .metric-box p {
            margin: 0;
            font-size: 1.0em;
            font-weight: bold;
            color: #e0e6ed;
        }

        .canvas-wrapper {
            overflow: auto;
            border: 1px solid #2a3a4e;
            background: #fff;
            margin-bottom: 10px;
            position: relative;
            max-height: 600px;
        }

        canvas {
            display: block;
            cursor: crosshair;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 0.75em;
            padding: 8px;
            background: #0d1724;
            border-radius: 5px;
            margin-top: 5px;
            border: 1px solid #2a3a4e;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            opacity: 0.8;
        }

        .line-legend {
            font-weight: bold;
            opacity: 0.8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 0.8em;
        }

        th,
        td {
            border: 1px solid #2a3a4e;
            padding: 4px;
            text-align: center;
        }

        th {
            background-color: #2196F3;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #0d1724;
        }

        tr:nth-child(odd) {
            background-color: #1a2738;
        }

        .btn-copy {
            background: #27ae60;
            color: white;
            padding: 7px 18px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: bold;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-copy:hover {
            background: #219150;
        }

        .cal-preset-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .cal-preset-left {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: #0d1724;
            border-radius: 8px;
            border: 1px solid #2a3a4e;
            flex-wrap: wrap;
        }

        .cal-preset-right {
            display: flex;
            align-items: center;
            margin-left: auto;
        }

        .cal-preset-bar .preset-label {
            font-size: 0.85em;
            color: #8ab4f8;
            font-weight: bold;
            margin-right: 4px;
        }

        .cal-preset-btn {
            padding: 7px 18px;
            border-radius: 6px;
            border: 2px solid #3a4f6e;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: bold;
            transition: all 0.2s;
            background: #1a2738;
            color: #e0e6ed;
            min-width: 80px;
            text-align: center;
        }

        .cal-preset-btn:hover {
            border-color: #2196F3;
            background: #1a3555;
        }

        .cal-preset-btn.active {
            border-color: #2196F3;
            background: #1a3555;
            box-shadow: 0 0 0 2px rgba(33, 150, 243, 0.3);
            color: #fff;
        }

        .btn-cal-settings {
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #2a3a4e;
            cursor: pointer;
            font-size: 0.72em;
            background: #1e2d3d;
            color: #8899aa;
            transition: all 0.2s;
        }

        .btn-cal-settings:hover {
            background: #2a3f5a;
            color: #ccc;
        }

        /* History */
        .btn-history {
            background: #1a2738;
            color: #e0e6ed;
            padding: 8px 15px;
            border-radius: 5px;
            border: 1px solid #3a4f6e;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s;
        }

        .btn-history:hover {
            background: #2a3a4e;
            border-color: #2196F3;
        }

        .history-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: flex-start;
            padding-top: 5vh;
        }

        .history-modal-overlay.visible {
            display: flex;
        }

        .history-modal-content {
            background: #1a2738;
            border: 1px solid #2a3a4e;
            border-radius: 12px;
            padding: 24px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        }

        .history-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid #2a3a4e;
            flex-wrap: wrap;
            gap: 8px;
        }

        .history-modal-header h2 {
            color: #8ab4f8;
            font-size: 1.1em;
            margin: 0;
        }

        .history-header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-history-copy-all {
            background: #27ae60;
            color: white;
            padding: 6px 14px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-size: 0.8em;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-history-copy-all:hover {
            background: #219150;
        }

        .btn-history-close {
            color: #a0aec0;
            font-size: 1.5em;
            font-weight: bold;
            cursor: pointer;
            background: none;
            border: none;
            line-height: 1;
            transition: color 0.2s;
        }

        .btn-history-close:hover {
            color: #e74c3c;
        }

        .history-list {
            overflow-y: auto;
            flex: 1;
        }

        .history-item {
            background: #0d1724;
            border: 1px solid #2a3a4e;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
            transition: all 0.2s;
        }

        .history-item:hover {
            border-color: #2196F3;
            background: rgba(33, 150, 243, 0.05);
        }

        .history-item.pinned {
            border-left: 3px solid #ff9800;
            background: rgba(255, 152, 0, 0.08);
        }

        .history-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            gap: 8px;
        }

        .history-item-date {
            font-size: 0.85em;
            font-weight: 600;
            color: #8ab4f8;
        }

        .history-pin-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 2px 4px;
            font-size: 0.9em;
            opacity: 0.4;
            transition: all 0.2s;
            filter: grayscale(100%);
        }

        .history-pin-btn:hover {
            opacity: 0.7;
        }

        .history-pin-btn.active {
            opacity: 1;
            filter: grayscale(0%);
        }

        .history-item-delete {
            background: none;
            border: none;
            color: #e74c3c;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            transition: all 0.2s;
        }

        .history-item-delete:hover {
            background: rgba(231, 76, 60, 0.15);
        }

        .history-item-delete.disabled {
            color: #666;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .history-item-delete.disabled:hover {
            background: none;
        }

        .history-item-results {
            font-size: 0.8em;
            color: #e0e6ed;
            line-height: 1.6;
        }

        .history-item-results .lead-label {
            display: inline-block;
            background: #2196F3;
            color: #fff;
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 0.85em;
            font-weight: bold;
            margin-right: 6px;
        }

        .history-item-comment {
            margin-top: 6px;
        }

        .history-comment-input {
            width: 100%;
            padding: 4px 8px;
            font-size: 0.8em;
            color: #e0e6ed;
            background: #1a2738;
            border: 1px solid #2a3a4e;
            border-radius: 4px;
            outline: none;
            transition: border-color 0.2s;
        }

        .history-comment-input:focus {
            border-color: #2196F3;
        }

        .history-comment-input::placeholder {
            color: #666;
        }

        .history-item-copy {
            background: none;
            border: 1px solid #3a4f6e;
            color: #a0aec0;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75em;
            transition: all 0.2s;
        }

        .history-item-copy:hover {
            border-color: #27ae60;
            color: #27ae60;
        }

        .history-empty {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 0.9em;
        }
    </style>

<body>

    <div class="container">
        <div class="top-bar">
            <div style="display: flex; align-items: center; gap: 18px; flex-wrap: wrap;">
                <h1>📈 QTc解析 <span style="font-size: 0.5em; color: #888; font-weight: normal;">ver 1.7 : 2026/4/9
                        update</span></h1>
                <div
                    style="background: rgba(220, 53, 69, 0.12); border: 1.5px solid #dc3545; border-radius: 8px; padding: 6px 14px; color: #ff6b6b; font-size: 0.82em; line-height: 1.5; white-space: nowrap;">
                    ⚠ キャリブレーションが正確か、必ず確認して下さい<br>
                    　ずれている場合は手動で調整し、再設定を押して下さい
                </div>
            </div>
            <div style="display:flex; gap:8px; align-items:center;">
                <button class="btn-copy" onclick="copyResults()">📋 結果をコピー</button>
                <button class="btn-reset" onclick="resetApp()">↻ クリア</button>
                <button class="btn-history" onclick="openHistory()">📋 履歴</button>
            </div>
        </div>

        <!-- History Modal -->
        <div class="history-modal-overlay" id="historyModal">
            <div class="history-modal-content">
                <div class="history-modal-header">
                    <h2>📋 解析履歴 (過去20回分)</h2>
                    <div class="history-header-actions">
                        <button class="btn-history-copy-all" onclick="copyAllHistory()">📋 全履歴コピー</button>
                        <button class="btn-history-close" onclick="closeHistory()">&times;</button>
                    </div>
                </div>
                <div id="historyList" class="history-list"></div>
            </div>
        </div>

        <div class="cal-preset-bar" id="calPresetBar">
            <div class="cal-preset-left" style="align-items:center;">
                <span class="preset-label">📏 キャリブレーション:</span>

                <button class="cal-preset-btn" id="presetBtn100" onclick="selectPreset('100')">
                    <span class="preset-name">100% <span id="presetVal100"
                            style="font-size:0.8em;color:#8899aa;"></span></span>
                </button>
                <button class="btn-cal-settings" onclick="saveCurrentAsPreset('100')"
                    title="現在のpx値を100%に保存">再設定</button>

                <span style="display:inline-block;width:12px;"></span>

                <button class="cal-preset-btn" id="presetBtn200" onclick="selectPreset('200')">
                    <span class="preset-name">200% <span id="presetVal200"
                            style="font-size:0.8em;color:#8899aa;"></span></span>
                </button>
                <button class="btn-cal-settings" onclick="saveCurrentAsPreset('200')"
                    title="現在のpx値を200%に保存">再設定</button>

                <span style="display:inline-block;width:12px;"></span>

                <button class="cal-preset-btn" id="presetBtn_holter" onclick="selectPreset('holter')">
                    <span class="preset-name">ホルター <span id="presetValHolter"
                            style="font-size:0.8em;color:#8899aa;"></span></span>
                </button>
                <button class="btn-cal-settings" onclick="saveCurrentAsPreset('holter')"
                    title="現在のpx値をホルターに保存">再設定</button>

                <span id="detectedCalValue" style="margin-left:14px; color:#aaa; font-size:0.85em;"></span>
            </div>
        </div>

        <div class="input-wrapper">
            <div class="input-area" id="dropZone1" onclick="activateZone(1)">
                <span class="input-label">画像 1 (例: II誘導)</span>
                <p class="input-sub">ペースト / ドロップ</p>
                <button class="btn-select" onclick="document.getElementById('fileInput1').click()">ファイル選択</button>
                <input type="file" id="fileInput1" accept="image/*">
            </div>
            <div class="input-area" id="dropZone2" onclick="activateZone(2)">
                <span class="input-label">画像 2 (例: V5誘導)</span>
                <p class="input-sub">ペースト / ドロップ</p>
                <button class="btn-select" onclick="document.getElementById('fileInput2').click()">ファイル選択</button>
                <input type="file" id="fileInput2" accept="image/*">
            </div>
        </div>

        <div class="result-container-wrapper">
            <div id="resultCard1" class="result-card"></div>
            <div id="resultCard2" class="result-card"></div>
        </div>


    </div>

    <script>
        let activeZone = 1;
        const finalResults = { 1: null, 2: null };
        const canvasRegistry = { 1: null, 2: null };

        // 紙送り速度は25mm/sec固定
        const paperSpeed = 25;
        const MAX_PROCESS_WIDTH = 2000;

        // --- Calibration Preset System ---
        const STORAGE_KEY = 'qtc_cal_presets';
        const DEFAULT_PRESETS = { '100': 94, '200': 190, 'holter': 125 };
        let calPresets = { ...DEFAULT_PRESETS };

        function loadPresets() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    calPresets['100'] = parsed['100'] || DEFAULT_PRESETS['100'];
                    calPresets['200'] = parsed['200'] || DEFAULT_PRESETS['200'];
                    calPresets['holter'] = parsed['holter'] || DEFAULT_PRESETS['holter'];
                }
            } catch (e) { }
        }

        function savePresetsToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(calPresets));
            } catch (e) { }
        }

        function findClosestPreset(detectedPx) {
            let bestKey = null;
            let bestDiff = Infinity;
            for (let key of ['100', '200', 'holter']) {
                const diff = Math.abs(calPresets[key] - detectedPx);
                if (diff < bestDiff) {
                    bestDiff = diff;
                    bestKey = key;
                }
            }
            return bestKey;
        }

        function highlightPresetButton(presetKey) {
            document.querySelectorAll('.cal-preset-btn').forEach(b => b.classList.remove('active'));
            if (presetKey === '100') document.getElementById('presetBtn100').classList.add('active');
            else if (presetKey === '200') document.getElementById('presetBtn200').classList.add('active');
            else if (presetKey === 'holter') document.getElementById('presetBtn_holter').classList.add('active');
        }

        // プリセット選択時に、モード(standard vs holter)も切り替える
        function selectPreset(mode) {
            const pxPerSec = calPresets[mode];
            highlightPresetButton(mode);

            // モード決定: holterなら'holter' (qtc_10 algo), それ以外は 'standard' (qtc_9 algo)
            const extractionMode = (mode === 'holter') ? 'holter' : 'standard';

            for (let idx of [1, 2]) {
                const entry = canvasRegistry[idx];
                if (!entry) continue;
                const state = entry.canvas.appState;
                if (!state) continue;

                state.pxPerSec = pxPerSec;
                state.calMethod = 'preset-' + mode;
                state.extractionMode = extractionMode;

                updateCalDisplay(idx, pxPerSec, state.calMethod);

                // モードが変わったので波形抽出(Extraction)からやり直す
                performSignalExtraction(state);
            }
        }

        // プリセットボタンのラベルにpx値を表示
        function updatePresetLabels() {
            const el100 = document.getElementById('presetVal100');
            const el200 = document.getElementById('presetVal200');
            const elH = document.getElementById('presetValHolter');
            if (el100) el100.textContent = `(${calPresets['100']}px)`;
            if (el200) el200.textContent = `(${calPresets['200']}px)`;
            if (elH) elH.textContent = `(${calPresets['holter']}px)`;
        }

        // 現在のpx値をプリセットとして保存
        function saveCurrentAsPreset(mode) {
            // 現在表示されている画像のpxPerSecを取得
            let currentPx = 0;
            for (let idx of [1, 2]) {
                const entry = canvasRegistry[idx];
                if (entry && entry.canvas.appState) {
                    currentPx = entry.canvas.appState.pxPerSec;
                    break;
                }
            }
            if (currentPx <= 0) {
                alert('画像を読み込んでからプリセットを設定してください');
                return;
            }
            calPresets[mode] = currentPx;
            savePresetsToStorage();
            updatePresetLabels();
            const nameMap = { '100': '100%', '200': '200%', 'holter': 'ホルター' };
            const label = document.getElementById('detectedCalValue');
            if (label) label.textContent = `${nameMap[mode]}に ${currentPx} px/s を保存しました`;
            setTimeout(() => { if (label) label.textContent = ''; }, 3000);
        }
        loadPresets();
        updatePresetLabels();

        const mean = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0;
        const median = arr => {
            if (!arr.length) return 0;
            const sorted = [...arr].sort((a, b) => a - b);
            const mid = Math.floor(sorted.length / 2);
            return sorted.length % 2 !== 0 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
        };

        function initDropZone(id, index) {
            const zone = document.getElementById(id);
            const input = document.getElementById(`fileInput${index}`);
            zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('dragover'); });
            zone.addEventListener('dragleave', (e) => { e.preventDefault(); zone.classList.remove('dragover'); });
            zone.addEventListener('drop', (e) => {
                e.preventDefault(); zone.classList.remove('dragover');
                activateZone(index);
                if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0], index);
            });
            input.addEventListener('change', (e) => {
                if (e.target.files.length > 0) handleFile(e.target.files[0], index);
            });
        }
        initDropZone('dropZone1', 1);
        initDropZone('dropZone2', 2);

        function activateZone(index) {
            activeZone = index;
            document.querySelectorAll('.input-area').forEach(el => el.classList.remove('active'));
            document.getElementById(`dropZone${index}`).classList.add('active');
        }

        window.addEventListener('paste', (e) => {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            let file = null;
            for (let item of items) {
                if (item.kind === 'file' && item.type.startsWith('image/')) {
                    file = item.getAsFile();
                    break;
                }
            }
            if (file) handleFile(file, activeZone);
        });

        function handleFile(file, index) {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const tempImg = new Image();
                tempImg.onload = () => {
                    let w = tempImg.width;
                    let h = tempImg.height;
                    let needsResize = false;

                    if (w > MAX_PROCESS_WIDTH) {
                        const scale = MAX_PROCESS_WIDTH / w;
                        w = MAX_PROCESS_WIDTH;
                        h = h * scale;
                        needsResize = true;
                    }

                    if (needsResize) {
                        const cvs = document.createElement('canvas');
                        cvs.width = w;
                        cvs.height = h;
                        const cx = cvs.getContext('2d');
                        cx.drawImage(tempImg, 0, 0, w, h);
                        const resizedImg = new Image();
                        resizedImg.onload = () => runAnalysis(resizedImg, file.name, index);
                        resizedImg.src = cvs.toDataURL('image/jpeg', 0.85);
                    } else {
                        runAnalysis(tempImg, file.name, index);
                    }
                };
                tempImg.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        }

        function resetApp() {
            // クリア前に結果があれば履歴に保存
            if (finalResults[1] || finalResults[2]) {
                saveToHistory();
            }

            document.getElementById('fileInput1').value = '';
            document.getElementById('fileInput2').value = '';
            document.getElementById('resultCard1').innerHTML = '';
            document.getElementById('resultCard1').classList.remove('visible');
            document.getElementById('resultCard2').innerHTML = '';
            document.getElementById('resultCard2').classList.remove('visible');
            finalResults[1] = null;
            finalResults[2] = null;
            canvasRegistry[1] = null;
            canvasRegistry[2] = null;
            activateZone(1);
            document.querySelectorAll('.cal-preset-btn').forEach(b => b.classList.remove('active'));
        }

        function copyResults() {
            let text;
            if (finalResults[1] && finalResults[2]) {
                // 画像が2つある場合: 両方の誘導を表示
                const r1 = finalResults[1];
                const r2 = finalResults[2];
                text = `2誘導 : HR ${r1.hr}, QT ${r1.qt}, QTcB ${r1.qtcb}, QTcF ${r1.qtcf} (${r1.nBeats}beats)\nV5誘導 : HR ${r2.hr}, QT ${r2.qt}, QTcB ${r2.qtcb}, QTcF ${r2.qtcf} (${r2.nBeats}beats)`;
            } else if (finalResults[1]) {
                // 画像が1つだけの場合: 2誘導のデータのみ
                const r1 = finalResults[1];
                text = `2誘導 : HR ${r1.hr}, QT ${r1.qt}, QTcB ${r1.qtcb}, QTcF ${r1.qtcf} (${r1.nBeats}beats)`;
            } else if (finalResults[2]) {
                // 画像2のみの場合: V5誘導のデータのみ
                const r2 = finalResults[2];
                text = `V5誘導 : HR ${r2.hr}, QT ${r2.qt}, QTcB ${r2.qtcb}, QTcF ${r2.qtcf} (${r2.nBeats}beats)`;
            } else {
                alert('解析結果がありません');
                return;
            }
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector('.btn-copy');
                const originalText = btn.innerText;
                btn.innerText = "✅ コピーしました!";
                setTimeout(() => { btn.innerText = originalText; }, 2000);
            }).catch(err => alert("コピー失敗: " + err));

            // 履歴に自動保存
            saveToHistory();
        }

        // ========== 履歴管理 ==========
        const HISTORY_STORAGE_KEY = 'qtc_analysis_history';
        const HISTORY_MAX = 20;

        function saveToHistory() {
            try {
                const history = getQtcHistory();
                const r1 = finalResults[1];
                const r2 = finalResults[2];
                const item = {
                    id: Date.now(),
                    date: new Date().toISOString(),
                    result1: r1 ? { hr: r1.hr, qt: r1.qt, qtcb: r1.qtcb, qtcf: r1.qtcf, nBeats: r1.nBeats } : null,
                    result2: r2 ? { hr: r2.hr, qt: r2.qt, qtcb: r2.qtcb, qtcf: r2.qtcf, nBeats: r2.nBeats } : null
                };
                history.unshift(item);

                // ピン留め以外を20件に制限
                const pinned = history.filter(h => h.pinned);
                const unpinned = history.filter(h => !h.pinned);
                while (unpinned.length > HISTORY_MAX - pinned.length && unpinned.length > 0) {
                    unpinned.pop();
                }
                const merged = [...pinned, ...unpinned].sort((a, b) => b.id - a.id);
                localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(merged));
            } catch (e) {
                console.error('Failed to save history:', e);
            }
        }

        function getQtcHistory() {
            try {
                const data = localStorage.getItem(HISTORY_STORAGE_KEY);
                return data ? JSON.parse(data) : [];
            } catch (e) {
                return [];
            }
        }

        function openHistory() {
            displayHistory();
            document.getElementById('historyModal').classList.add('visible');
        }

        function closeHistory() {
            document.getElementById('historyModal').classList.remove('visible');
        }

        function formatHistoryItemText(item) {
            const r1 = item.result1;
            const r2 = item.result2;
            const beatsStr = (r) => r.nBeats != null ? ` (${r.nBeats}beats)` : '';
            let text = '';
            if (r1 && r2) {
                text = `2誘導 : HR ${r1.hr}, QT ${r1.qt}, QTcB ${r1.qtcb}, QTcF ${r1.qtcf}${beatsStr(r1)}\nV5誘導 : HR ${r2.hr}, QT ${r2.qt}, QTcB ${r2.qtcb}, QTcF ${r2.qtcf}${beatsStr(r2)}`;
            } else if (r1) {
                text = `2誘導 : HR ${r1.hr}, QT ${r1.qt}, QTcB ${r1.qtcb}, QTcF ${r1.qtcf}${beatsStr(r1)}`;
            } else if (r2) {
                text = `V5誘導 : HR ${r2.hr}, QT ${r2.qt}, QTcB ${r2.qtcb}, QTcF ${r2.qtcf}${beatsStr(r2)}`;
            }
            return text;
        }

        function displayHistory() {
            const history = getQtcHistory();
            const historyList = document.getElementById('historyList');

            if (history.length === 0) {
                historyList.innerHTML = '<div class="history-empty">解析履歴がありません</div>';
                return;
            }

            // 時系列順（新しい順）でソート、ピン留めも時系列位置のまま
            const sorted = [...history].sort((a, b) => b.id - a.id);

            historyList.innerHTML = sorted.map(item => {
                const date = new Date(item.date);
                const dateStr = date.toLocaleString('ja-JP', {
                    year: 'numeric', month: '2-digit', day: '2-digit',
                    hour: '2-digit', minute: '2-digit'
                });
                const isPinned = item.pinned || false;
                const comment = item.comment || '';
                const r1 = item.result1;
                const r2 = item.result2;

                let resultsHtml = '';
                if (r1) resultsHtml += `<div><span class="lead-label">II</span>HR ${r1.hr} | QT ${r1.qt} | QTcB ${r1.qtcb} | QTcF ${r1.qtcf}</div>`;
                if (r2) resultsHtml += `<div><span class="lead-label">V5</span>HR ${r2.hr} | QT ${r2.qt} | QTcB ${r2.qtcb} | QTcF ${r2.qtcf}</div>`;

                return `
            <div class="history-item ${isPinned ? 'pinned' : ''}">
                <div class="history-item-header">
                    <button class="history-pin-btn ${isPinned ? 'active' : ''}" onclick="toggleHistoryPin(${item.id})" title="${isPinned ? 'ピン留め解除' : 'ピン留め'}">📌</button>
                    <span class="history-item-date">${dateStr}</span>
                    <button class="history-item-copy" onclick="copyHistoryItem(${item.id})">📋 コピー</button>
                    <button class="history-item-delete ${isPinned ? 'disabled' : ''}" onclick="deleteHistoryItem(${item.id})" ${isPinned ? 'disabled' : ''}>削除</button>
                </div>
                <div class="history-item-results">${resultsHtml}</div>
                <div class="history-item-comment">
                    <input type="text" class="history-comment-input" placeholder="コメントを入力..."
                        maxlength="30" value="${comment.replace(/"/g, '&quot;')}"
                        onclick="event.stopPropagation();"
                        onchange="updateHistoryComment(${item.id}, this.value)"
                        onkeydown="if(event.key==='Enter') this.blur();">
                </div>
            </div>
        `;
            }).join('');
        }

        function toggleHistoryPin(id) {
            let history = getQtcHistory();
            const item = history.find(h => h.id === id);
            if (item) {
                item.pinned = !item.pinned;
                localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(history));
                displayHistory();
            }
        }

        function deleteHistoryItem(id) {
            let history = getQtcHistory();
            const item = history.find(h => h.id === id);
            if (item && item.pinned) {
                alert('ピン留めされた履歴は削除できません。\n先にピン留めを解除してください。');
                return;
            }
            if (!confirm('この履歴を削除してもよろしいですか？')) return;
            history = history.filter(h => h.id !== id);
            localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(history));
            displayHistory();
        }

        function updateHistoryComment(id, comment) {
            let history = getQtcHistory();
            const item = history.find(h => h.id === id);
            if (item) {
                item.comment = comment.substring(0, 30);
                localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(history));
            }
        }

        function copyHistoryItem(id) {
            const history = getQtcHistory();
            const item = history.find(h => h.id === id);
            if (!item) return;
            const text = formatHistoryItemText(item);
            navigator.clipboard.writeText(text).then(() => {
                const btns = document.querySelectorAll('.history-item-copy');
                btns.forEach(b => { if (b.textContent.includes('コピー')) return; });
            });
        }

        function copyAllHistory() {
            const history = getQtcHistory();
            if (history.length === 0) { alert('履歴がありません'); return; }
            const sorted = [...history].sort((a, b) => b.id - a.id);
            const lines = sorted.map(item => {
                const date = new Date(item.date);
                const dateStr = date.toLocaleString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
                const pin = item.pinned ? '📌 ' : '';
                const commentPart = item.comment ? ` (${item.comment})` : '';
                return `${pin}[${dateStr}]${commentPart} ${formatHistoryItemText(item)}`;
            });
            navigator.clipboard.writeText(lines.join('\n')).then(() => {
                const btn = document.querySelector('.btn-history-copy-all');
                const orig = btn.innerText;
                btn.innerText = '✅ コピー完了';
                setTimeout(() => { btn.innerText = orig; }, 2000);
            }).catch(err => alert('コピー失敗: ' + err));
        }

        // 履歴モーダルのオーバーレイクリックで閉じる
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('historyModal').addEventListener('click', function (e) {
                if (e.target === this) closeHistory();
            });
        });

        function runAnalysis(img, filename, index) {
            const container = document.getElementById(`resultCard${index}`);
            container.innerHTML = '';
            container.classList.add('visible');

            const label = `Result ${index} : ${index === 1 ? 'II誘導' : 'V5誘導'}`;
            const html = `
        <div class="card-label">${label}</div>
        <div class="result-header">
            <span class="file-name" title="${filename}">📄 ${filename}</span>
            <span class="instructions">マーカー: ドラッグ修正 / クリック削除 | Shift+クリック: R追加 | H型バー: キャリブレーション修正</span>
        </div>
        <div class="calibration-bar" id="calBar${index}">
            <label>📏 キャリブレーション:</label>
            <span class="cal-value" id="calDisplay${index}">計算中...</span>
            <span class="cal-method" id="calMethod${index}"></span>
            <input type="hidden" id="calInput${index}">
            <button class="btn-reanalyze" onclick="reanalyzeQT(${index})">🔄 QT再解析</button>
            <button class="btn-reanalyze" style="background:#b8860b" onclick="toggleSignalOverlay(${index})" id="btnOverlay${index}">📈 信号表示</button>
        </div>
        <div class="channel-bar" id="chBar${index}">
            <span class="ch-label">🎨 波形チャンネル:</span>
            <button class="ch-btn ch-black" id="chBlack${index}" onclick="switchChannel(${index},'black')">⬛ 黒</button>
            <button class="ch-btn ch-green" id="chGreen${index}" onclick="switchChannel(${index},'green')">🟩 緑</button>
            <button class="ch-btn ch-red" id="chRed${index}" onclick="switchChannel(${index},'red')">🟥 赤</button>
        </div>
        <div class="summary-grid">
            <div class="metric-box"><h3>HR</h3><p class="val-hr">-</p></div>
            <div class="metric-box"><h3>QT</h3><p class="val-qt">-</p></div>
            <div class="metric-box"><h3>QTcB</h3><p class="val-qtcb">-</p></div>
            <div class="metric-box"><h3>QTcF</h3><p class="val-qtcf">-</p></div>
        </div>
        <div class="canvas-wrapper"></div>
        <div class="legend">
            <div class="legend-item"><span class="dot" style="background:blue;"></span> R-peak</div>
            <div class="legend-item"><span class="dot" style="background:green;"></span> Q-onset</div>
            <div class="legend-item"><span class="dot" style="background:gold; border:1px solid #333;"></span> T-peak</div>
            <div class="legend-item"><span class="line-legend" style="color:red;">―</span> Tangent</div>
            <div class="legend-item"><span class="dot" style="background:red;"></span> T-end</div>
            <div class="legend-item"><span class="line-legend" style="color:blue;">―</span> Baseline (上下ドラッグ修正)</div>
            <div class="legend-item"><span class="line-legend" style="color:#ff6600;">H</span> キャリブレーション</div>
        </div>
        <table>
            <thead><tr><th>Beat</th><th>RR(pre)</th><th>HR</th><th>QT</th><th>QTcB</th><th>QTcF</th></tr></thead>
            <tbody></tbody>
        </table>
    `;
            container.innerHTML = html;

            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            canvas.style.width = img.width + "px";
            canvas.style.height = img.height + "px";
            container.querySelector('.canvas-wrapper').appendChild(canvas);

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);

            const width = img.width, height = img.height;
            const imgDataObj = ctx.getImageData(0, 0, width, height);
            const imgData = imgDataObj.data;

            // 1. Calibration
            let pxPerSec, calMethod, extractionMode;

            // 2枚目の画像は1枚目と同じキャリブレーションを使用
            if (index === 2 && canvasRegistry[1] && canvasRegistry[1].canvas.appState) {
                const state1 = canvasRegistry[1].canvas.appState;
                pxPerSec = state1.pxPerSec;
                calMethod = state1.calMethod;
                extractionMode = state1.extractionMode;
            } else {
                const calResult = detectCalibration(imgData, width, height);
                pxPerSec = calResult.pxPerSec;
                calMethod = calResult.method;

                const detectedLabel = document.getElementById('detectedCalValue');

                if (pxPerSec === 0) {
                    calMethod = 'grid-fallback';
                    // フォールバック: 最も近いプリセットを使用
                    const matchedPreset = findClosestPreset(94); // デフォルト100%
                    pxPerSec = calPresets[matchedPreset];
                    highlightPresetButton(matchedPreset);
                    extractionMode = (matchedPreset === 'holter') ? 'holter' : 'standard';
                    if (detectedLabel) detectedLabel.textContent = `検出失敗 → ${matchedPreset === 'holter' ? 'ホルター' : matchedPreset + '%'}を適用`;
                } else {
                    // 自動検出値と各プリセットの差分を計算し、最も近いプリセット値にスナップ
                    const detectedPx = pxPerSec;
                    const matchedPreset = findClosestPreset(detectedPx);
                    const diff = Math.abs(calPresets[matchedPreset] - detectedPx);
                    pxPerSec = calPresets[matchedPreset];
                    calMethod = 'preset-' + matchedPreset;
                    highlightPresetButton(matchedPreset);
                    extractionMode = (matchedPreset === 'holter') ? 'holter' : 'standard';

                    const nameMap = { '100': '100%', '200': '200%', 'holter': 'ホルター' };
                    if (detectedLabel) {
                        detectedLabel.textContent = `自動検出: ${detectedPx}px/s → ${nameMap[matchedPreset]}(${calPresets[matchedPreset]}px/s)を適用 (差分: ${diff}px)`;
                    }
                }
            }

            updateCalDisplay(index, pxPerSec, calMethod);

            const appState = {
                img, imgData, width, height, pxPerSec,
                calMethod,
                extractionMode, // 'standard' or 'holter'
                rPeaks: [], manualTEnds: {}, manualQOnsets: {}, manualTPeaks: {}, manualBaselines: {}, beats: [],
                index, channel: 'black', // only used in holter mode
                calX: 20, calY: 20, calH: 16
            };

            canvas.appState = appState;
            canvas.resultCard = container;
            canvasRegistry[index] = { canvas, container };

            // Initial Processing
            performSignalExtraction(appState);

            // --- Interaction Setup (same as before) ---
            setupInteraction(canvas, container, index);
        }

        // 新規: 波形抽出〜ピーク検出までを一括で行う関数
        function performSignalExtraction(state) {
            const { imgData, width, height, extractionMode } = state;
            const card = canvasRegistry[state.index].container;
            const chBar = card.querySelector(`#chBar${state.index}`);

            let signal;

            if (extractionMode === 'holter') {
                // --- Holter Logic (from qtc_10) ---
                if (chBar) chBar.classList.remove('hidden'); // Show channel bar

                // Auto-detect best channel if not manually set or fresh run
                if (!state.manualChannelSelected) {
                    state.channel = detectBestChannel(imgData, width, height);
                }

                // UI update for active channel
                ['black', 'green', 'red'].forEach(c => {
                    const btn = document.getElementById(`ch${c.charAt(0).toUpperCase() + c.slice(1)}${state.index}`);
                    if (btn) {
                        if (c === state.channel) btn.classList.add('ch-active');
                        else btn.classList.remove('ch-active');
                    }
                });

                signal = extractSignalHolter(imgData, width, height, state.channel);

            } else {
                // --- Standard Logic (from qtc_9) ---
                // 赤方眼紙上の黒波形を検出するロジック
                if (chBar) chBar.classList.add('hidden'); // Hide channel bar

                signal = extractSignalStandard(imgData, width, height);
            }

            // Common Processing (Smoothing -> Peak) — 3点平滑化でR波の振幅を保持
            const smooth = new Float32Array(width);
            smooth[0] = signal[0]; smooth[width - 1] = signal[width - 1];
            for (let i = 1; i < width - 1; i++) smooth[i] = (signal[i - 1] + signal[i] + signal[i + 1]) / 3;
            state.smooth = smooth;

            detectRPeaks(state); // Update rPeaks in state

            // Reset manuals if algorithm changed significantly?
            // User might want to keep markers if just tweaking cal, but here we change the waveform itself.
            // Ideally keep markers but snap them to new waveform if possible. 
            // For safety/simplicity in this hybrid, we keep markers but they might drift vertically.

            analyzeBeats(state);
            renderCanvas(canvasRegistry[state.index].canvas, state);
            updateTable(card, state, state.index);
        }

        // シンプルな波形抽出: 最暗ピクセル追跡方式
        function extractSignalStandard(imgData, width, height) {
            const signal = new Float32Array(width).fill(NaN);
            const yStart = 1;
            const yEnd = height - 1;

            for (let x = 0; x < width; x++) {
                // Pass 1: 列内の最小輝度を求める
                let darkestLum = 255;
                for (let y = yStart; y < yEnd; y++) {
                    const i = (y * width + x) * 4;
                    const r = imgData[i], g = imgData[i + 1], b = imgData[i + 2];
                    if (r > 100 && r > g + 30 && r > b + 30) continue;
                    const lum = 0.299 * r + 0.587 * g + 0.114 * b;
                    if (lum < darkestLum) darkestLum = lum;
                }

                // Pass 2: darkestLum + 30 以内の暗ピクセルの中で、
                // 最も極端なy位置（画像中央から最も遠い）を選択
                // → にじんだR-peakでも上端に近いピクセルが選ばれる
                if (darkestLum < 250) {
                    const lumThresh = darkestLum + 30;
                    const centerY = height / 2;
                    let bestY = -1, bestDist = -1;
                    for (let y = yStart; y < yEnd; y++) {
                        const i = (y * width + x) * 4;
                        const r = imgData[i], g = imgData[i + 1], b = imgData[i + 2];
                        if (r > 100 && r > g + 30 && r > b + 30) continue;
                        const lum = 0.299 * r + 0.587 * g + 0.114 * b;
                        if (lum <= lumThresh) {
                            const dist = Math.abs(y - centerY);
                            if (dist > bestDist) {
                                bestDist = dist;
                                bestY = y;
                            }
                        }
                    }
                    if (bestY >= 0) {
                        signal[x] = height - bestY;
                    }
                }
            }

            // Interpolation
            for (let i = 0; i < width; i++) { if (isNaN(signal[i])) { let l = i - 1, r = i + 1; while (l >= 0 && isNaN(signal[l])) l--; while (r < width && isNaN(signal[r])) r++; if (l >= 0 && r < width) signal[i] = signal[l] + (signal[r] - signal[l]) * (i - l) / (r - l); else if (l >= 0) signal[i] = signal[l]; else if (r < width) signal[i] = signal[r]; else signal[i] = height / 2; } }

            return signal;
        }

        // qtc_10 Logic: カラーチャンネル優先抽出
        function extractSignalHolter(imgData, width, height, channel) {
            const signal = new Float32Array(width).fill(NaN);
            // 画像端のアーティファクト除外
            const yMargin = Math.max(2, Math.floor(height * 0.02));
            const yStart = yMargin;
            const yEnd = height - yMargin;

            for (let x = 0; x < width; x++) {
                let sumY = 0, count = 0;

                if (channel === 'black') {
                    let minLum = 255;
                    for (let y = yStart; y < yEnd; y++) {
                        const i = (y * width + x) * 4;
                        const lum = 0.299 * imgData[i] + 0.587 * imgData[i + 1] + 0.114 * imgData[i + 2];
                        if (lum < minLum) minLum = lum;
                    }
                    const threshold = Math.min(minLum + 50, 200);
                    for (let y = yStart; y < yEnd; y++) {
                        const i = (y * width + x) * 4;
                        const r = imgData[i], g = imgData[i + 1], b = imgData[i + 2];
                        const lum = 0.299 * r + 0.587 * g + 0.114 * b;
                        const sat = Math.max(r, g, b) - Math.min(r, g, b);
                        if (lum <= threshold && sat < 40) {
                            const w = (threshold - lum + 1);
                            sumY += y * w; count += w;
                        }
                    }
                } else if (channel === 'green') {
                    for (let y = yStart; y < yEnd; y++) {
                        const i = (y * width + x) * 4;
                        const r = imgData[i], g = imgData[i + 1], b = imgData[i + 2];
                        if (g > 40 && g > r + 15 && g > b + 15) {
                            const greenness = g - Math.max(r, b);
                            const w = Math.max(1, greenness);
                            sumY += y * w; count += w;
                        }
                    }
                } else if (channel === 'red') {
                    for (let y = yStart; y < yEnd; y++) {
                        const i = (y * width + x) * 4;
                        const r = imgData[i], g = imgData[i + 1], b = imgData[i + 2];
                        if (r > 40 && r > g + 15) {
                            const redness = r - g;
                            const w = Math.max(1, redness);
                            sumY += y * w; count += w;
                        }
                    }
                }

                if (count > 0) signal[x] = height - (sumY / count);
            }

            // Interpolation
            for (let i = 0; i < width; i++) {
                if (isNaN(signal[i])) {
                    let l = i - 1, r = i + 1;
                    while (l >= 0 && isNaN(signal[l])) l--;
                    while (r < width && isNaN(signal[r])) r++;
                    if (l >= 0 && r < width) signal[i] = signal[l] + (signal[r] - signal[l]) * (i - l) / (r - l);
                    else if (l >= 0) signal[i] = signal[l];
                    else if (r < width) signal[i] = signal[r];
                    else signal[i] = height / 2;
                }
            }
            return signal;
        }

        function detectRPeaks(state) {
            const { smooth, pxPerSec, width } = state;
            const edgeMargin = 15;
            const slope = new Float32Array(width).fill(0);
            for (let i = 2; i < width - 2; i++) { slope[i] = Math.abs(smooth[i + 1] - smooth[i - 1]); }

            // 信号の中央値を算出（エッジ除外、上向き・下向き両方のQRSに対応）
            const interiorSmooth = [];
            for (let i = edgeMargin; i < width - edgeMargin; i++) interiorSmooth.push(smooth[i]);
            interiorSmooth.sort((a, b) => a - b);
            const signalMedian = interiorSmooth[Math.floor(interiorSmooth.length / 2)];

            // 振幅スコア: 中央値からの絶対偏差（エッジ除外で最大偏差を算出）
            const scoreSignal = new Float32Array(width);
            let maxAbsDev = 0;
            for (let i = edgeMargin; i < width - edgeMargin; i++) {
                const dev = Math.abs(smooth[i] - signalMedian);
                if (dev > maxAbsDev) maxAbsDev = dev;
            }
            let slopeMax = 0;
            for (let i = edgeMargin; i < width - edgeMargin; i++) {
                if (slope[i] > slopeMax) slopeMax = slope[i];
            }

            for (let i = 0; i < width; i++) {
                const normDev = maxAbsDev > 0 ? Math.abs(smooth[i] - signalMedian) / maxAbsDev : 0;
                const normSlope = slope[i] / (slopeMax || 1);
                scoreSignal[i] = normDev + (normSlope * 3.0);
            }

            // 閾値はエッジ除外した内部領域のスコアのみで算出
            let interiorMaxScore = 0;
            for (let i = edgeMargin; i < width - edgeMargin; i++) {
                if (scoreSignal[i] > interiorMaxScore) interiorMaxScore = scoreSignal[i];
            }
            // === 閾値設定 ===
            const globalThreshold = interiorMaxScore * 0.40;
            const minRDist = pxPerSec * 0.45;

            let rPeaks = [];

            // Pass 1: グローバル閾値でR波候補を検出
            for (let i = edgeMargin; i < width - edgeMargin; i++) {
                if (scoreSignal[i] > scoreSignal[i - 1] && scoreSignal[i] > scoreSignal[i + 1] && scoreSignal[i] > globalThreshold) {
                    if (rPeaks.length === 0 || i - rPeaks[rPeaks.length - 1] > minRDist) {
                        rPeaks.push(i);
                    } else {
                        const lastIdx = rPeaks.length - 1;
                        if (scoreSignal[i] > scoreSignal[rPeaks[lastIdx]]) {
                            rPeaks[lastIdx] = i;
                        }
                    }
                }
            }

            // Pass 2: テンプレートマッチングによるギャップ補填
            // 検出済みR-peakからQRS波形テンプレートを生成し、正規化相互相関（NCC）で未検出ビートを探索
            if (rPeaks.length >= 2) {
                const rrIntervals = [];
                for (let i = 1; i < rPeaks.length; i++) rrIntervals.push(rPeaks[i] - rPeaks[i - 1]);
                rrIntervals.sort((a, b) => a - b);
                const medianRR = rrIntervals[Math.floor(rrIntervals.length / 2)];
                const gapThresholdRR = medianRR * 1.5;

                // テンプレート生成: 検出済みR-peak周辺 ±halfW の平均波形
                const halfW = Math.max(5, Math.floor(pxPerSec * 0.04)); // ±40ms
                const templateLen = halfW * 2 + 1;
                const template = new Float32Array(templateLen).fill(0);
                let validCount = 0;
                for (const rp of rPeaks) {
                    if (rp - halfW >= 0 && rp + halfW < width) {
                        for (let j = 0; j < templateLen; j++) {
                            template[j] += smooth[rp - halfW + j];
                        }
                        validCount++;
                    }
                }
                if (validCount > 0) {
                    for (let j = 0; j < templateLen; j++) template[j] /= validCount;
                }

                // テンプレートの平均・分散を事前算出
                let tMean = 0;
                for (let j = 0; j < templateLen; j++) tMean += template[j];
                tMean /= templateLen;
                let tVar = 0;
                for (let j = 0; j < templateLen; j++) tVar += (template[j] - tMean) * (template[j] - tMean);
                const tStd = Math.sqrt(tVar);

                if (validCount > 0 && tStd > 0.01) {
                    let insertions = [];
                    for (let i = 1; i < rPeaks.length; i++) {
                        const gap = rPeaks[i] - rPeaks[i - 1];
                        if (gap > gapThresholdRR) {
                            // ギャップ内でNCCを算出し、最高相関のピークをR候補とする
                            const gapStart = rPeaks[i - 1] + Math.floor(minRDist);
                            const gapEnd = rPeaks[i] - Math.floor(minRDist);
                            let bestNCC = 0.4; // 相関閾値 0.4
                            let bestPos = -1;

                            for (let pos = Math.max(halfW, gapStart); pos < Math.min(width - halfW, gapEnd); pos++) {
                                // 局所区間の平均・分散
                                let sMean = 0;
                                for (let j = 0; j < templateLen; j++) sMean += smooth[pos - halfW + j];
                                sMean /= templateLen;
                                let sVar = 0, crossCorr = 0;
                                for (let j = 0; j < templateLen; j++) {
                                    const sd = smooth[pos - halfW + j] - sMean;
                                    const td = template[j] - tMean;
                                    sVar += sd * sd;
                                    crossCorr += sd * td;
                                }
                                const sStd = Math.sqrt(sVar);
                                if (sStd > 0.01) {
                                    const ncc = crossCorr / (sStd * tStd);
                                    if (ncc > bestNCC) {
                                        bestNCC = ncc;
                                        bestPos = pos;
                                    }
                                }
                            }
                            if (bestPos > 0) {
                                insertions.push(bestPos);
                            }
                        }
                    }
                    // 挿入してソート
                    if (insertions.length > 0) {
                        rPeaks = rPeaks.concat(insertions);
                        rPeaks.sort((a, b) => a - b);
                    }
                }
            }

            // QRS極性の判定: 検出されたピーク位置での信号が中央値より上か下かで判定
            let aboveCount = 0, belowCount = 0;
            rPeaks.forEach(r => {
                if (smooth[r] >= signalMedian) aboveCount++;
                else belowCount++;
            });
            const isInvertedQRS = belowCount > aboveCount;
            state.isInvertedQRS = isInvertedQRS;

            // Snap to local extremum (陽性QRS: 最大値, 陰性QRS: 最小値)
            rPeaks = rPeaks.map(r => {
                let localBest = r;
                const range = isInvertedQRS ? 20 : 10;
                for (let k = r - range; k <= r + range; k++) {
                    if (k >= 0 && k < width) {
                        if (isInvertedQRS) {
                            if (smooth[k] < smooth[localBest]) localBest = k;
                        } else {
                            if (smooth[k] > smooth[localBest]) localBest = k;
                        }
                    }
                }
                return localBest;
            });

            // RR間隔整合性フィルタ: メディアンRRの50%未満の間隔を作るピークを除去
            if (rPeaks.length >= 3) {
                let filtered = true;
                while (filtered) {
                    filtered = false;
                    if (rPeaks.length < 3) break;
                    const intervals = [];
                    for (let i = 1; i < rPeaks.length; i++) intervals.push(rPeaks[i] - rPeaks[i - 1]);
                    const sortedInt = [...intervals].sort((a, b) => a - b);
                    const medRR = sortedInt[Math.floor(sortedInt.length / 2)];
                    const minRR = medRR * 0.65;
                    for (let i = 0; i < intervals.length; i++) {
                        if (intervals[i] < minRR) {
                            // 短すぎる間隔: スコアが低い方のピークを除去
                            const idx1 = i, idx2 = i + 1;
                            if (scoreSignal[rPeaks[idx1]] <= scoreSignal[rPeaks[idx2]]) {
                                rPeaks.splice(idx1, 1);
                            } else {
                                rPeaks.splice(idx2, 1);
                            }
                            filtered = true;
                            break;
                        }
                    }
                }
            }

            state.rPeaks = rPeaks;
        }

        // Manually switching channel (only in Holter mode)
        function switchChannel(index, channel) {
            const entry = canvasRegistry[index];
            if (!entry) return;
            const state = entry.canvas.appState;
            if (!state) return;

            // Manual switch implies user wants this channel
            state.manualChannelSelected = true;
            state.channel = channel;
            performSignalExtraction(state);
        }

        function detectBestChannel(imgData, width, height) {
            let blackScore = 0, greenScore = 0, redScore = 0;
            const step = Math.max(1, Math.floor(width / 200));

            for (let x = 0; x < width; x += step) {
                for (let y = 0; y < height; y++) {
                    const i = (y * width + x) * 4;
                    const r = imgData[i], g = imgData[i + 1], b = imgData[i + 2];
                    const lum = 0.299 * r + 0.587 * g + 0.114 * b;
                    const sat = Math.max(r, g, b) - Math.min(r, g, b);

                    if (lum < 80 && sat < 40) blackScore++;
                    if (g > 40 && g > r + 15 && g > b + 15) greenScore++;
                    if (r > 40 && r > g + 15) redScore++;
                }
            }

            const colorThreshold = blackScore * 0.3;
            if (greenScore > redScore && greenScore > colorThreshold) {
                if (greenScore > blackScore * 0.5) return 'green';
            }
            if (redScore > greenScore && redScore > colorThreshold) {
                if (redScore > blackScore * 0.5) return 'red';
            }
            return 'black';
        }

        // ---------------------------------------------------------
        // Existing Visualization & Math Functions (Merged & Cleaned)
        // ---------------------------------------------------------

        function detectCalibration(imgData, width, height) {
            const colProfile = new Float32Array(width).fill(0);
            const startY = Math.floor(height * 0.3);
            const endY = Math.floor(height * 0.7);

            for (let x = 0; x < width; x++) {
                let redScore = 0;
                for (let y = startY; y < endY; y += 2) {
                    const i = (y * width + x) * 4;
                    const r = imgData[i], g = imgData[i + 1], b = imgData[i + 2];
                    if (r > 130 && g < 200 && b < 200 && r > g + 10) {
                        redScore++;
                    }
                }
                colProfile[x] = redScore;
            }

            const maxRedScore = Math.max(...colProfile);
            const threshold = maxRedScore * 0.3;
            if (maxRedScore < 3) return { pxPerSec: 0, method: 'none', debug: `maxRed=${maxRedScore} → 赤グリッド不足` };

            const peaks = [];
            for (let x = 2; x < width - 2; x++) {
                if (colProfile[x] > threshold && colProfile[x] > colProfile[x - 1] && colProfile[x] > colProfile[x + 1]) {
                    if (peaks.length === 0 || x - peaks[peaks.length - 1] > 3) peaks.push(x);
                }
            }

            if (peaks.length < 2) return { pxPerSec: 0, method: 'none', debug: `maxRed=${maxRedScore} peaks=${peaks.length} → ピーク不足` };

            const diffs = {};
            for (let i = 1; i < peaks.length; i++) {
                const d = peaks[i] - peaks[i - 1];
                const rounded = Math.round(d / 2) * 2;
                if (rounded > 2) diffs[rounded] = (diffs[rounded] || 0) + 1;
            }

            let modeDist = 0;
            let maxCount = 0;
            for (let d in diffs) {
                if (diffs[d] > maxCount) { maxCount = diffs[d]; modeDist = parseInt(d); }
            }

            if (modeDist === 0) return { pxPerSec: 0, method: 'none', debug: 'modeDist=0' };

            // modeDist が 1mm 間隔なら ×5 して 5mm に変換
            // 1mm: 3-15px → ×5 で 5mm
            // 5mm: 16-50px → そのまま
            // 25mm(1秒): >50px → ÷5 で 5mm
            let pxPer5mm = modeDist;
            if (modeDist < 16) pxPer5mm = modeDist * 5;
            else if (modeDist > 50) pxPer5mm = modeDist / 5;
            const pxPerSec = Math.round(pxPer5mm * 5);

            return { pxPerSec, method: 'auto-scale', debug: `検出値: ${pxPerSec} px/s (mode=${modeDist})` };
        }

        function updateCalDisplay(index, pxPerSec, method) {
            const calDisplay = document.getElementById(`calDisplay${index}`);
            const calMethodEl = document.getElementById(`calMethod${index}`);
            if (!calDisplay || !calMethodEl) return;

            calDisplay.textContent = `${pxPerSec} px/sec (25mm=1s)`;
            const calInput = document.getElementById(`calInput${index}`);
            if (calInput) calInput.value = pxPerSec;

            calMethodEl.className = 'cal-method';
            if (method === 'auto-scale' || method === 'auto-detected') {
                calMethodEl.textContent = '自動検出';
                calMethodEl.classList.add('auto-scale');
            } else if (method === 'grid-fallback') {
                calMethodEl.textContent = '簡易検出';
                calMethodEl.classList.add('grid-fallback');
            } else if (method === 'drag') {
                calMethodEl.textContent = 'ドラッグ補正';
                calMethodEl.classList.add('drag');
            } else if (method && method.startsWith('preset-')) {
                const presetName = method.replace('preset-', '');
                const nameMap = { '100': '100%', '200': '200%', 'holter': 'ホルター' };
                calMethodEl.textContent = 'プリセット: ' + (nameMap[presetName] || presetName);
                calMethodEl.classList.add('manual');
            }
        }

        function syncCalibrationToOther(sourceIndex, newPxPerSec, method) {
            const otherIndex = sourceIndex === 1 ? 2 : 1;
            const otherEntry = canvasRegistry[otherIndex];
            if (!otherEntry) return;

            const otherCanvas = otherEntry.canvas;
            const otherState = otherCanvas.appState;
            if (!otherState) return;

            otherState.pxPerSec = newPxPerSec;
            otherState.calMethod = method;

            // Note: If sync implies mode sync, we should also sync extractionMode, but standard/holter might differ per image?
            // For now, assuming calibration pixel density is consistent, but mode depends on user setting (selectPreset applies to all).
            // If user dragged calibration, we assume mode stays same.

            updateCalDisplay(otherIndex, newPxPerSec, method);

            otherState.manualTEnds = {};
            otherState.manualQOnsets = {};

            // Re-detect R-peaks if scale changed drastically? 
            // Usually R-detection is robust to scale, but Qt calc depends on it.
            // For drag-cal, we re-analyze beats, but not re-extract signal usually.
            analyzeBeats(otherState);
            renderCanvas(otherCanvas, otherState);
            updateTable(otherEntry.container, otherState, otherIndex);
        }

        function analyzeBeats(state) {
            const { smooth, rPeaks, pxPerSec, width, manualTEnds, manualQOnsets } = state;
            if (!state.manualTPeaks) state.manualTPeaks = {};
            if (!state.manualBaselines) state.manualBaselines = {};
            const manualTPeaks = state.manualTPeaks;
            const manualBaselines = state.manualBaselines;
            const beats = [];
            for (let i = 1; i < rPeaks.length; i++) {
                const rLoc = rPeaks[i], prevR = rPeaks[i - 1];
                const rrSec = (rLoc - prevR) / pxPerSec;
                const hr = 60 / rrSec;

                const beatId = i;

                // === Phase 1: 粗Q-onset推定（基線なしで実施） ===
                let roughQ = rLoc;
                if (!(manualQOnsets && manualQOnsets[beatId] !== undefined)) {
                    const qLimit = Math.max(prevR + 10, Math.floor(rLoc - 0.08 * pxPerSec));
                    if (state.isInvertedQRS) {
                        // 陰性QRS: R-peak(nadir)から後方へ辿り、スロープが緩やかになる点を検出
                        let maxVal = smooth[rLoc];
                        for (let k = rLoc - 1; k >= qLimit; k--) {
                            if (smooth[k] >= maxVal) {
                                maxVal = smooth[k];
                                roughQ = k;
                            } else if (smooth[k] < maxVal - 3) {
                                break;
                            }
                        }
                    } else {
                        // 通常QRS: 従来どおり
                        roughQ = rLoc;
                        for (let k = rLoc - 1; k >= qLimit; k--) {
                            if (smooth[k] <= smooth[roughQ]) roughQ = k;
                            else if (smooth[k] > smooth[roughQ] + 3) break;
                        }
                    }
                }

                // === Phase 2: Baseline算出（粗Q-onset直前の等電位区間） ===
                let baseline;
                if (manualBaselines[beatId] !== undefined) {
                    baseline = manualBaselines[beatId];
                } else if (state.isInvertedQRS) {
                    // 粗Q-onset直前の30px区間（PR segment）から基線を推定
                    const preQLen = 30;
                    const preQStart = Math.max(prevR + 10, roughQ - preQLen);
                    const preQEnd = roughQ;
                    if (preQEnd > preQStart) {
                        const preQVals = [];
                        for (let k = preQStart; k < preQEnd; k++) preQVals.push(smooth[k]);
                        preQVals.sort((a, b) => a - b);
                        // 中央値を使用（等電位区間はフラットなので中央値が適切）
                        baseline = preQVals[Math.floor(preQVals.length * 0.5)];
                    } else {
                        baseline = smooth[roughQ];
                    }
                } else {
                    // 陽性QRS: roughQ直前のPR segment区間から基線を推定（ハイブリッド方式）
                    const preQLen = 30;
                    const preQStart = Math.max(prevR + 10, roughQ - preQLen);
                    const preQEnd = roughQ;
                    let prMedian = smooth[roughQ]; // フォールバック
                    if (preQEnd > preQStart) {
                        const preQVals = [];
                        for (let k = preQStart; k < preQEnd; k++) preQVals.push(smooth[k]);
                        preQVals.sort((a, b) => a - b);
                        prMedian = preQVals[Math.floor(preQVals.length * 0.5)];
                    }
                    // roughQ値とPR medianの近い方を採用（基線が上に乖離しすぎない）
                    baseline = Math.min(prMedian, smooth[roughQ] + 3);
                }

                // === Phase 3: 精密Q-onset検出（基線を使用） ===
                let qTrough;
                if (manualQOnsets && manualQOnsets[beatId] !== undefined) {
                    qTrough = manualQOnsets[beatId];
                } else {
                    qTrough = rLoc;
                    if (state.isInvertedQRS) {
                        // 基線の95%閾値で正確なQ-onsetを検出
                        const qLimit = Math.max(prevR + 10, Math.floor(rLoc - 0.08 * pxPerSec));
                        const baseThreshold = baseline * 0.95;
                        for (let k = rLoc - 1; k >= qLimit; k--) {
                            if (smooth[k] >= baseThreshold) {
                                qTrough = k;
                                break;
                            }
                        }
                        // 基線未到達の場合: 粗推定を使用
                        if (qTrough === rLoc) {
                            let maxRise = smooth[rLoc];
                            for (let k = rLoc - 1; k >= qLimit; k--) {
                                if (smooth[k] >= maxRise) {
                                    maxRise = smooth[k];
                                    qTrough = k;
                                } else if (smooth[k] < maxRise - 3) {
                                    break;
                                }
                            }
                        }
                    } else {
                        // 陽性QRS: R-peakから後方へ辿り、Q波の谷を探す（40ms以内）
                        const qLimit = Math.max(prevR + 10, Math.floor(rLoc - 0.04 * pxPerSec));
                        let qMinVal = smooth[rLoc];
                        for (let k = rLoc - 1; k >= qLimit; k--) {
                            if (smooth[k] <= qMinVal) {
                                qMinVal = smooth[k];
                                qTrough = k;
                            } else if (smooth[k] > qMinVal + 3) {
                                break;
                            }
                        }
                    }
                }

                // Manual tangent contact point override (manualTEndsは接触点のx座標を保存)
                if (manualTEnds[beatId] !== undefined) {
                    const contactX = Math.floor(manualTEnds[beatId]);
                    const tStartM = Math.floor(rLoc + Math.max(0.12 * pxPerSec, 20));
                    const nextRM = (i < rPeaks.length - 1) ? rPeaks[i + 1] : width;
                    const tLimitM = Math.min(nextRM - Math.max(0.15 * pxPerSec, 20), rLoc + Math.max(0.8 * pxPerSec, (nextRM - rLoc) * 0.75));
                    let isNegativeT = false;
                    if (tLimitM > tStartM) {
                        let tMaxM = -Infinity, tMinM = Infinity;
                        for (let k = tStartM; k < tLimitM; k++) {
                            if (smooth[k] > tMaxM) tMaxM = smooth[k];
                            if (smooth[k] < tMinM) tMinM = smooth[k];
                        }
                        isNegativeT = Math.abs(tMinM - baseline) > Math.abs(tMaxM - baseline);
                    }
                    // 接触点での勾配を算出
                    const cx = Math.max(1, Math.min(width - 2, contactX));
                    const cSlope = (smooth[cx + 1] - smooth[cx - 1]) / 2;
                    const cy = smooth[cx];
                    const tEnd = (cSlope !== 0) ? (baseline - cy) / cSlope + cx : cx + 20;
                    const tPeak = manualTPeaks[beatId] || cx - 10;
                    const qtMs = (tEnd - qTrough) / pxPerSec * 1000;
                    beats.push({
                        id: beatId, rr: rrSec * 1000, hr, qt: qtMs,
                        qtcB: qtMs / Math.sqrt(rrSec), qtcF: qtMs / Math.cbrt(rrSec),
                        qOnset: qTrough, tPeak, tEnd, x1: cx, minSlope: cSlope, y1: cy, baseline, rLoc, prevR, isManual: true,
                        isNegativeT
                    });
                    continue;
