    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
            max-width: 95%;
            margin: 0 auto;
            padding: 20px;
            background: #0f1724;
            color: #e0e6ed;
            user-select: none;
            min-height: 100vh;
        }

        .container {
            background: #151f2e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border: 1px solid #2a3a4e;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #2196F3;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            color: #ffffff;
            font-size: 1.5em;
        }

        .btn-reset {
            background: #e74c3c;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-size: 0.9em;
            transition: background 0.2s;
        }

        .btn-reset:hover {
            background: #c0392b;
        }

        .input-wrapper {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .input-area {
            flex: 1;
            border: 3px dashed #3a4f6e;
            border-radius: 10px;
            padding: 6px 15px;
            text-align: center;
            background: #1a2738;
            transition: all 0.2s;
            cursor: pointer;
            position: relative;
        }

        .input-area:hover {
            background-color: #1f2e42;
        }

        .input-area.dragover {
            background-color: #1a3a3a;
            border-color: #38b2ac;
            transform: scale(1.01);
        }

        .input-area.active {
            border-color: #2196F3;
            background-color: #1a3555;
            box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.2);
        }

        .input-label {
            font-weight: bold;
            font-size: 0.95em;
            color: #8ab4f8;
            margin-bottom: 5px;
            display: block;
        }

        .input-sub {
            font-size: 0.8em;
            color: #a0aec0;
            margin-bottom: 8px;
        }

        .btn-select {
            background: #2196F3;
            color: white;
            padding: 8px 20px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-size: 0.9em;
            transition: background 0.2s;
        }

        .btn-select:hover {
            background: #1976D2;
        }

        input[type="file"] {
            display: none;
        }

        .result-container-wrapper {
            display: flex;
            flex-direction: row;
            gap: 20px;
            align-items: flex-start;
        }

        .result-card {
            flex: 1;
            min-width: 0;
            border: 1px solid #2a3a4e;
            border-radius: 8px;
            padding: 15px;
            background: #1a2738;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            display: none;
        }

        .result-card.visible {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-label {
            background: #2196F3;
            color: #fff;
            display: inline-block;
            padding: 4px 12px;
            font-size: 0.85em;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a3a4e;
            padding-bottom: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 5px;
        }

        .file-name {
            font-weight: bold;
            color: #8ab4f8;
            font-size: 0.9em;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 200px;
        }

        .instructions {
            font-size: 0.75em;
            color: #e0e6ed;
            background: #3a4f6e;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid #4a5f7e;
        }

        .calibration-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            padding: 8px 12px;
            background: #0d1724;
            border-radius: 6px;
            border: 1px solid #2a3a4e;
            flex-wrap: wrap;
        }

        .calibration-bar label {
            font-size: 0.85em;
            color: #8ab4f8;
            font-weight: bold;
        }

        .calibration-bar .cal-value {
            font-size: 0.85em;
            color: #e0e6ed;
            background: #1a2738;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid #3a4f6e;
        }

        .cal-method {
            font-size: 0.75em;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: bold;
        }

        .cal-method.auto-scale {
            background: #00897b;
            color: #fff;
        }

        .cal-method.grid-fallback {
            background: #ff8f00;
            color: #fff;
        }

        .cal-method.manual {
            background: #1565c0;
            color: #fff;
        }

        .cal-method.drag {
            background: #6a1b9a;
            color: #fff;
        }

        .calibration-bar input[type="number"] {
            width: 80px;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #3a4f6e;
            background: #1a2738;
            color: #e0e6ed;
            font-size: 0.85em;
            text-align: center;
        }

        .btn-reanalyze {
            background: #7c4dff;
            color: white;
            padding: 6px 16px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: bold;
            transition: background 0.2s;
            margin-left: 8px;
        }

        .btn-reanalyze:hover {
            background: #651fff;
        }

        .channel-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 10px;
            padding: 6px 12px;
            background: #0d1724;
            border-radius: 6px;
            border: 1px solid #2a3a4e;
        }

        .channel-bar.hidden {
            display: none;
        }

        .channel-bar .ch-label {
            font-size: 0.8em;
            color: #8ab4f8;
            font-weight: bold;
            margin-right: 4px;
        }

        .ch-btn {
            padding: 4px 14px;
            border-radius: 4px;
            border: 2px solid #3a4f6e;
            cursor: pointer;
            font-size: 0.8em;
            font-weight: bold;
            transition: all 0.15s;
            background: #1a2738;
            color: #e0e6ed;
        }

        .ch-btn:hover {
            border-color: #5a7f9e;
        }

        .ch-btn.ch-active {
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.2);
        }

        .ch-btn.ch-black {
            color: #aaa;
        }

        .ch-btn.ch-black.ch-active {
            border-color: #fff;
            background: #444;
            color: #fff;
        }

        .ch-btn.ch-green {
            color: #4caf50;
        }

        .ch-btn.ch-green.ch-active {
            border-color: #4caf50;
            background: #1b3a1b;
            color: #66ff66;
        }

        .ch-btn.ch-red {
            color: #e91e3a;
        }

        .ch-btn.ch-red.ch-active {
            border-color: #e91e3a;
            background: #3a1a1a;
            color: #ff6666;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }

        .metric-box {
            background: #0d1724;
            padding: 8px 4px;
            border-radius: 6px;
            text-align: center;
            border: 1px solid #2a3a4e;
        }

        .metric-box h3 {
            margin: 0 0 3px 0;
            font-size: 0.7em;
            color: #8ab4f8;
        }

        .metric-box p {
            margin: 0;
            font-size: 1.0em;
            font-weight: bold;
            color: #e0e6ed;
        }

        .canvas-wrapper {
            overflow: auto;
            border: 1px solid #2a3a4e;
            background: #fff;
            margin-bottom: 10px;
            position: relative;
            max-height: 600px;
        }

        canvas {
            display: block;
            cursor: crosshair;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 0.75em;
            padding: 8px;
            background: #0d1724;
            border-radius: 5px;
            margin-top: 5px;
            border: 1px solid #2a3a4e;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            opacity: 0.8;
        }

        .line-legend {
            font-weight: bold;
            opacity: 0.8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 0.8em;
        }

        th,
        td {
            border: 1px solid #2a3a4e;
            padding: 4px;
            text-align: center;
        }

        th {
            background-color: #2196F3;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #0d1724;
        }

        tr:nth-child(odd) {
            background-color: #1a2738;
        }

        .btn-copy {
            background: #27ae60;
            color: white;
            padding: 7px 18px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: bold;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-copy:hover {
            background: #219150;
        }

        .cal-preset-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .cal-preset-left {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: #0d1724;
            border-radius: 8px;
            border: 1px solid #2a3a4e;
            flex-wrap: wrap;
        }

        .cal-preset-right {
            display: flex;
            align-items: center;
            margin-left: auto;
        }

        .cal-preset-bar .preset-label {
            font-size: 0.85em;
            color: #8ab4f8;
            font-weight: bold;
            margin-right: 4px;
        }

        .cal-preset-btn {
            padding: 7px 18px;
            border-radius: 6px;
            border: 2px solid #3a4f6e;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: bold;
            transition: all 0.2s;
            background: #1a2738;
            color: #e0e6ed;
            min-width: 80px;
            text-align: center;
        }

        .cal-preset-btn:hover {
            border-color: #2196F3;
            background: #1a3555;
        }

        .cal-preset-btn.active {
            border-color: #2196F3;
            background: #1a3555;
            box-shadow: 0 0 0 2px rgba(33, 150, 243, 0.3);
            color: #fff;
        }

        .btn-cal-settings {
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #2a3a4e;
            cursor: pointer;

<body>

    <div class="container">

                    style="background: rgba(220, 53, 69, 0.12); border: 1.5px solid #dc3545; border-radius: 8px; padding: 6px 14px; color: #ff6b6b; font-size: 0.82em; line-height: 1.5; white-space: nowrap;">

                            style="font-size:0.8em;color:#8899aa;"></span></span>

                    title="現在のpx値をホルターに保存">再設定</button>

                <input type="file" id="fileInput1" accept="image/*">

                <span class="input-label">画像 2 (例: V5誘導)</span>

    <script>
        let activeZone = 1;
        const finalResults = { 1: null, 2: null };
        const canvasRegistry = { 1: null, 2: null };

        // 紙送り速度は25mm/sec固定
        const paperSpeed = 25;
        const MAX_PROCESS_WIDTH = 2000;

        // --- Calibration Preset System ---
        const STORAGE_KEY = 'qtc_cal_presets';
        const DEFAULT_PRESETS = { '100': 94, '200': 190, 'holter': 125 };
        let calPresets = { ...DEFAULT_PRESETS };

        function loadPresets() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    calPresets['100'] = parsed['100'] || DEFAULT_PRESETS['100'];
                    calPresets['200'] = parsed['200'] || DEFAULT_PRESETS['200'];
                    calPresets['holter'] = parsed['holter'] || DEFAULT_PRESETS['holter'];
                }
            } catch (e) { }
        }

        function savePresetsToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(calPresets));
            } catch (e) { }
        }

        function findClosestPreset(detectedPx) {
            let bestKey = null;
            let bestDiff = Infinity;
            for (let key of ['100', '200', 'holter']) {
                const diff = Math.abs(calPresets[key] - detectedPx);
                if (diff < bestDiff) {
                    bestDiff = diff;
                    bestKey = key;
                }
            }
            return bestKey;
        }

        function highlightPresetButton(presetKey) {
            document.querySelectorAll('.cal-preset-btn').forEach(b => b.classList.remove('active'));
            if (presetKey === '100') document.getElementById('presetBtn100').classList.add('active');
            else if (presetKey === '200') document.getElementById('presetBtn200').classList.add('active');
            else if (presetKey === 'holter') document.getElementById('presetBtn_holter').classList.add('active');
        }

        // プリセット選択時に、モード(standard vs holter)も切り替える
        function selectPreset(mode) {
            const pxPerSec = calPresets[mode];
            highlightPresetButton(mode);

            // モード決定: holterなら'holter' (qtc_10 algo), それ以外は 'standard' (qtc_9 algo)
            const extractionMode = (mode === 'holter') ? 'holter' : 'standard';

            for (let idx of [1, 2]) {
                const entry = canvasRegistry[idx];
                if (!entry) continue;
                const state = entry.canvas.appState;
                if (!state) continue;

                state.pxPerSec = pxPerSec;
                state.calMethod = 'preset-' + mode;
                state.extractionMode = extractionMode;

                updateCalDisplay(idx, pxPerSec, state.calMethod);

                // モードが変わったので波形抽出(Extraction)からやり直す
                performSignalExtraction(state);
            }
        }

        // プリセットボタンのラベルにpx値を表示
        function updatePresetLabels() {
            const el100 = document.getElementById('presetVal100');
            const el200 = document.getElementById('presetVal200');
            const elH = document.getElementById('presetValHolter');
            if (el100) el100.textContent = `(${calPresets['100']}px)`;
            if (el200) el200.textContent = `(${calPresets['200']}px)`;
            if (elH) elH.textContent = `(${calPresets['holter']}px)`;
        }

        // 現在のpx値をプリセットとして保存
        function saveCurrentAsPreset(mode) {
            // 現在表示されている画像のpxPerSecを取得
            let currentPx = 0;
            for (let idx of [1, 2]) {
                const entry = canvasRegistry[idx];
                if (entry && entry.canvas.appState) {
                    currentPx = entry.canvas.appState.pxPerSec;
                    break;
                }
            }
            if (currentPx <= 0) {
                alert('画像を読み込んでからプリセットを設定してください');
                return;
            }
            calPresets[mode] = currentPx;
            savePresetsToStorage();
            updatePresetLabels();
            const nameMap = { '100': '100%', '200': '200%', 'holter': 'ホルター' };
            const label = document.getElementById('detectedCalValue');
            if (label) label.textContent = `${nameMap[mode]}に ${currentPx} px/s を保存しました`;
            setTimeout(() => { if (label) label.textContent = ''; }, 3000);
        }
        loadPresets();
        updatePresetLabels();

        const mean = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0;
        const median = arr => {
            if (!arr.length) return 0;
            const sorted = [...arr].sort((a, b) => a - b);
            const mid = Math.floor(sorted.length / 2);
            return sorted.length % 2 !== 0 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
        };

        function initDropZone(id, index) {
            const zone = document.getElementById(id);
            const input = document.getElementById(`fileInput${index}`);
            zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('dragover'); });
            zone.addEventListener('dragleave', (e) => { e.preventDefault(); zone.classList.remove('dragover'); });
            zone.addEventListener('drop', (e) => {
                e.preventDefault(); zone.classList.remove('dragover');
                activateZone(index);
                if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0], index);
            });
            input.addEventListener('change', (e) => {
                if (e.target.files.length > 0) handleFile(e.target.files[0], index);
            });
        }
        initDropZone('dropZone1', 1);
        initDropZone('dropZone2', 2);

        function activateZone(index) {
            activeZone = index;
            document.querySelectorAll('.input-area').forEach(el => el.classList.remove('active'));
            document.getElementById(`dropZone${index}`).classList.add('active');
        }

        window.addEventListener('paste', (e) => {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            let file = null;
            for (let item of items) {
                if (item.kind === 'file' && item.type.startsWith('image/')) {
                    file = item.getAsFile();
                    break;
                }
            }
            if (file) handleFile(file, activeZone);
        });

        function handleFile(file, index) {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const tempImg = new Image();
                tempImg.onload = () => {
                    let w = tempImg.width;
                    let h = tempImg.height;
                    let needsResize = false;

                    if (w > MAX_PROCESS_WIDTH) {
                        const scale = MAX_PROCESS_WIDTH / w;
                        w = MAX_PROCESS_WIDTH;
                        h = h * scale;
                        needsResize = true;
                    }

                    if (needsResize) {
                        const cvs = document.createElement('canvas');
                        cvs.width = w;
                        cvs.height = h;
                        const cx = cvs.getContext('2d');
                        cx.drawImage(tempImg, 0, 0, w, h);
                        const resizedImg = new Image();
                        resizedImg.onload = () => runAnalysis(resizedImg, file.name, index);
                        // JPEG再圧縮は細い格子線（1〜2px）を壊し自動計測を失敗させるため PNG を使う
                        resizedImg.src = cvs.toDataURL('image/png');
                    } else {
                        runAnalysis(tempImg, file.name, index);
                    }
                };
                tempImg.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        }

        function resetApp() {
            // クリア前に結果があれば履歴に保存
            if (finalResults[1] || finalResults[2]) {
                saveToHistory();
            }

            document.getElementById('fileInput1').value = '';
            document.getElementById('fileInput2').value = '';
            document.getElementById('resultCard1').innerHTML = '';
            document.getElementById('resultCard1').classList.remove('visible');
            document.getElementById('resultCard2').innerHTML = '';
            document.getElementById('resultCard2').classList.remove('visible');
            finalResults[1] = null;
            finalResults[2] = null;
            canvasRegistry[1] = null;
            canvasRegistry[2] = null;
            activateZone(1);
            document.querySelectorAll('.cal-preset-btn').forEach(b => b.classList.remove('active'));
        }

        function copyResults() {
            let text;
            if (finalResults[1] && finalResults[2]) {
                // 画像が2つある場合: 両方の誘導を表示
                const r1 = finalResults[1];
                const r2 = finalResults[2];
                text = `2誘導 : HR ${r1.hr}, QT ${r1.qt}, QTcB ${r1.qtcb}, QTcF ${r1.qtcf} (${r1.nBeats}beats)\nV5誘導 : HR ${r2.hr}, QT ${r2.qt}, QTcB ${r2.qtcb}, QTcF ${r2.qtcf} (${r2.nBeats}beats)`;
            } else if (finalResults[1]) {
                // 画像が1つだけの場合: 2誘導のデータのみ
                const r1 = finalResults[1];
                text = `2誘導 : HR ${r1.hr}, QT ${r1.qt}, QTcB ${r1.qtcb}, QTcF ${r1.qtcf} (${r1.nBeats}beats)`;
            } else if (finalResults[2]) {
                // 画像2のみの場合: V5誘導のデータのみ
                const r2 = finalResults[2];
                text = `V5誘導 : HR ${r2.hr}, QT ${r2.qt}, QTcB ${r2.qtcb}, QTcF ${r2.qtcf} (${r2.nBeats}beats)`;
            } else {
                alert('解析結果がありません');
                return;
            }
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector('.btn-copy');
                const originalText = btn.innerText;
                btn.innerText = "✅ コピーしました!";
                setTimeout(() => { btn.innerText = originalText; }, 2000);
            }).catch(err => alert("コピー失敗: " + err));

            // 履歴に自動保存
            saveToHistory();
        }

        // ========== 履歴管理 ==========
        const HISTORY_STORAGE_KEY = 'qtc_analysis_history';
        const HISTORY_MAX = 20;

        function saveToHistory() {
            try {
                const history = getQtcHistory();
                const r1 = finalResults[1];
                const r2 = finalResults[2];
                const item = {
                    id: Date.now(),
                    date: new Date().toISOString(),
                    result1: r1 ? { hr: r1.hr, qt: r1.qt, qtcb: r1.qtcb, qtcf: r1.qtcf, nBeats: r1.nBeats } : null,
                    result2: r2 ? { hr: r2.hr, qt: r2.qt, qtcb: r2.qtcb, qtcf: r2.qtcf, nBeats: r2.nBeats } : null
                };
                history.unshift(item);

                // ピン留め以外を20件に制限
                const pinned = history.filter(h => h.pinned);
                const unpinned = history.filter(h => !h.pinned);
                while (unpinned.length > HISTORY_MAX - pinned.length && unpinned.length > 0) {
                    unpinned.pop();
                }
                const merged = [...pinned, ...unpinned].sort((a, b) => b.id - a.id);
                localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(merged));
            } catch (e) {
                console.error('Failed to save history:', e);
            }
        }

        function getQtcHistory() {
            try {
                const data = localStorage.getItem(HISTORY_STORAGE_KEY);
                return data ? JSON.parse(data) : [];
            } catch (e) {
                return [];
            }
        }

        function openHistory() {
            displayHistory();
            document.getElementById('historyModal').classList.add('visible');
        }

        function closeHistory() {
            document.getElementById('historyModal').classList.remove('visible');
        }

        function formatHistoryItemText(item) {
            const r1 = item.result1;
            const r2 = item.result2;
            const beatsStr = (r) => r.nBeats != null ? ` (${r.nBeats}beats)` : '';
            let text = '';
            if (r1 && r2) {
                text = `2誘導 : HR ${r1.hr}, QT ${r1.qt}, QTcB ${r1.qtcb}, QTcF ${r1.qtcf}${beatsStr(r1)}\nV5誘導 : HR ${r2.hr}, QT ${r2.qt}, QTcB ${r2.qtcb}, QTcF ${r2.qtcf}${beatsStr(r2)}`;
            } else if (r1) {
                text = `2誘導 : HR ${r1.hr}, QT ${r1.qt}, QTcB ${r1.qtcb}, QTcF ${r1.qtcf}${beatsStr(r1)}`;
            } else if (r2) {
                text = `V5誘導 : HR ${r2.hr}, QT ${r2.qt}, QTcB ${r2.qtcb}, QTcF ${r2.qtcf}${beatsStr(r2)}`;
            }
            return text;
        }

        function displayHistory() {
            const history = getQtcHistory();
            const historyList = document.getElementById('historyList');

            if (history.length === 0) {
                historyList.innerHTML = '<div class="history-empty">解析履歴がありません</div>';
                return;
            }

            // 時系列順（新しい順）でソート、ピン留めも時系列位置のまま
            const sorted = [...history].sort((a, b) => b.id - a.id);

            historyList.innerHTML = sorted.map(item => {
                const date = new Date(item.date);

                if (r1) resultsHtml += `<div><span class="lead-label">II</span>HR ${r1.hr} | QT ${r1.qt} | QTcB ${r1.qtcb} | QTcF ${r1.qtcf}</div>`;
                if (r2) resultsHtml += `<div><span class="lead-label">V5</span>HR ${r2.hr} | QT ${r2.qt} | QTcB ${r2.qtcb} | QTcF ${r2.qtcf}</div>`;

                return `
            <div class="history-item ${isPinned ? 'pinned' : ''}">
                <div class="history-item-header">
                    <button class="history-pin-btn ${isPinned ? 'active' : ''}" onclick="toggleHistoryPin(${item.id})" title="${isPinned ? 'ピン留め解除' : 'ピン留め'}">📌</button>
                    <span class="history-item-date">${dateStr}</span>
                    <button class="history-item-copy" onclick="copyHistoryItem(${item.id})">📋 コピー</button>
                    <button class="history-item-delete ${isPinned ? 'disabled' : ''}" onclick="deleteHistoryItem(${item.id})" ${isPinned ? 'disabled' : ''}>削除</button>
                </div>
                <div class="history-item-results">${resultsHtml}</div>
                <div class="history-item-comment">
                    <input type="text" class="history-comment-input" placeholder="コメントを入力..."
                        maxlength="30" value="${comment.replace(/"/g, '&quot;')}"
                        onclick="event.stopPropagation();"
                        onchange="updateHistoryComment(${item.id}, this.value)"
                        onkeydown="if(event.key==='Enter') this.blur();">
                </div>
            </div>
        `;
            }).join('');
        }

        function toggleHistoryPin(id) {
            let history = getQtcHistory();
            const item = history.find(h => h.id === id);
            if (item) {
                item.pinned = !item.pinned;
                localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(history));
                displayHistory();
            }
        }

        function deleteHistoryItem(id) {
            let history = getQtcHistory();
            const item = history.find(h => h.id === id);
            if (item && item.pinned) {
                alert('ピン留めされた履歴は削除できません。\n先にピン留めを解除してください。');
                return;
            }
            if (!confirm('この履歴を削除してもよろしいですか？')) return;

            localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(history));
            displayHistory();

        function updateHistoryComment(id, comment) {
            let history = getQtcHistory();

                const pin = item.pinned ? '📌 ' : '';
                const commentPart = item.comment ? ` (${item.comment})` : '';

        // 履歴モーダルのオーバーレイクリックで閉じる
        document.addEventListener('DOMContentLoaded', () => {

        function runAnalysis(img, filename, index) {

            container.innerHTML = '';
            container.classList.add('visible');

            <div class="legend-item"><span class="line-legend" style="color:red;">―</span> Tangent</div>
            <div class="legend-item"><span class="dot" style="background:red;"></span> 接線接点（ドラッグで調整）</div>
            <div class="legend-item"><span class="line-legend" style="color:blue;">―</span> Baseline (上下ドラッグ修正)</div>
            <div class="legend-item"><span class="line-legend" style="color:#ff6600;">H</span> キャリブレーション</div>
        </div>
        <table>
            <thead><tr><th>Beat</th><th>RR(pre)</th><th>HR</th><th>QT</th><th>QTcB</th><th>QTcF</th></tr></thead>

    `;
            container.innerHTML = html;

            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            canvas.style.width = img.width + "px";
            canvas.style.height = img.height + "px";
            container.querySelector('.canvas-wrapper').appendChild(canvas);

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);

            const width = img.width, height = img.height;
            const imgDataObj = ctx.getImageData(0, 0, width, height);
            const imgData = imgDataObj.data;

            // 1. Calibration
            let pxPerSec, calMethod, extractionMode;

            // 2枚目の画像は1枚目と同じキャリブレーションを使用
            if (index === 2 && canvasRegistry[1] && canvasRegistry[1].canvas.appState) {
                const state1 = canvasRegistry[1].canvas.appState;
                pxPerSec = state1.pxPerSec;
                calMethod = state1.calMethod;
                extractionMode = state1.extractionMode;
            } else {
                const calResult = detectCalibration(imgData, width, height);
                const detectedLabel = document.getElementById('detectedCalValue');

                if (calResult.confident && calResult.pxPerSec > 0) {
                    // グリッドから実測した px 値をそのまま採用（プリセットへ丸めない）
                    pxPerSec = calResult.pxPerSec;
                    calMethod = 'auto-grid';
                    // 抽出モードは px/sec ではなく波形の色種別で決める（ver 2.3）
                    extractionMode = (detectTraceKind(imgData, width, height) === 'black') ? 'standard' : 'holter';
                    document.querySelectorAll('.cal-preset-btn').forEach(b => b.classList.remove('active'));
                    if (detectedLabel) detectedLabel.textContent = `自動計測: 25mm(1s) = ${pxPerSec}px（グリッド実測）`;
                } else {
                    // 検出に失敗したときのみ、最も近いプリセットへフォールバック
                    calMethod = 'grid-fallback';
                    const matchedPreset = findClosestPreset(94); // デフォルト100%
                    pxPerSec = calPresets[matchedPreset];
                    highlightPresetButton(matchedPreset);
                    extractionMode = (detectTraceKind(imgData, width, height) === 'black') ? 'standard' : 'holter';
                    if (detectedLabel) detectedLabel.textContent = `検出失敗 → ${matchedPreset === 'holter' ? 'ホルター' : matchedPreset + '%'}を適用（手動で調整して下さい）`;
                }
            }

            updateCalDisplay(index, pxPerSec, calMethod);

            const appState = {
                img, imgData, width, height, pxPerSec,
                calMethod,
                extractionMode, // 'standard' or 'holter'
                rPeaks: [], manualTEnds: {}, manualQOnsets: {}, manualTPeaks: {}, manualBaselines: {}, beats: [],
                index, channel: 'black', // only used in holter mode
                calX: 20, calY: 20, calH: 16
            };

            canvas.appState = appState;
            canvas.resultCard = container;
            canvasRegistry[index] = { canvas, container };

            // Initial Processing
            performSignalExtraction(appState);

            // --- Interaction Setup (same as before) ---
            setupInteraction(canvas, container, index);
        }

        // 新規: 波形抽出〜ピーク検出までを一括で行う関数
        function performSignalExtraction(state) {
            const { imgData, width, height, extractionMode } = state;
            const card = canvasRegistry[state.index].container;
            const chBar = card.querySelector(`#chBar${state.index}`);

            let signal;

            if (extractionMode === 'holter') {
                // --- Holter Logic (from qtc_10) ---
                if (chBar) chBar.classList.remove('hidden'); // Show channel bar

                // Auto-detect best channel if not manually set or fresh run
                if (!state.manualChannelSelected) {
                    state.channel = detectBestChannel(imgData, width, height);
                }

                // UI update for active channel
                ['black', 'green', 'red'].forEach(c => {
                    const btn = document.getElementById(`ch${c.charAt(0).toUpperCase() + c.slice(1)}${state.index}`);
                    if (btn) {
                        if (c === state.channel) btn.classList.add('ch-active');
                        else btn.classList.remove('ch-active');
                    }
                });

                signal = extractSignalHolter(imgData, width, height, state.channel);

            } else {
                // --- Standard Logic (from qtc_9) ---
                // 赤方眼紙上の黒波形を検出するロジック
                if (chBar) chBar.classList.add('hidden'); // Hide channel bar

                signal = extractSignalStandard(imgData, width, height);
            }

            // Common Processing (Smoothing -> Peak) — 3点平滑化でR波の振幅を保持
            const smooth = new Float32Array(width);
            smooth[0] = signal[0]; smooth[width - 1] = signal[width - 1];
            for (let i = 1; i < width - 1; i++) smooth[i] = (signal[i - 1] + signal[i] + signal[i + 1]) / 3;
            state.smooth = smooth;

            detectRPeaks(state); // Update rPeaks in state

            // Reset manuals if algorithm changed significantly?
            // User might want to keep markers if just tweaking cal, but here we change the waveform itself.
            // Ideally keep markers but snap them to new waveform if possible.
            // For safety/simplicity in this hybrid, we keep markers but they might drift vertically.

            analyzeBeats(state);
            renderCanvas(canvasRegistry[state.index].canvas, state);
            updateTable(card, state, state.index);
        }

        // シンプルな波形抽出: 最暗ピクセル追跡方式
        function extractSignalStandard(imgData, width, height) {
            const signal = new Float32Array(width).fill(NaN);
            const yStart = 1;
            const yEnd = height - 1;

            for (let x = 0; x < width; x++) {
                // Pass 1: 列内の最小輝度を求める
                let darkestLum = 255;
                for (let y = yStart; y < yEnd; y++) {
                    const i = (y * width + x) * 4;
                    const r = imgData[i], g = imgData[i + 1], b = imgData[i + 2];
                    if (r > 100 && r > g + 30 && r > b + 30) continue;
                    const lum = 0.299 * r + 0.587 * g + 0.114 * b;
                    if (lum < darkestLum) darkestLum = lum;
                }

                // Pass 2: darkestLum + 30 以内の暗ピクセルの中で、
                // 最も極端なy位置（画像中央から最も遠い）を選択
                // → にじんだR-peakでも上端に近いピクセルが選ばれる
                if (darkestLum < 250) {
                    const lumThresh = darkestLum + 30;
                    const centerY = height / 2;
                    let bestY = -1, bestDist = -1;
                    for (let y = yStart; y < yEnd; y++) {
                        const i = (y * width + x) * 4;
                        const r = imgData[i], g = imgData[i + 1], b = imgData[i + 2];
                        if (r > 100 && r > g + 30 && r > b + 30) continue;
                        const lum = 0.299 * r + 0.587 * g + 0.114 * b;
                        if (lum <= lumThresh) {
                            const dist = Math.abs(y - centerY);
                            if (dist > bestDist) {
                                bestDist = dist;
                                bestY = y;
                            }
                        }
                    }
                    if (bestY >= 0) {
                        signal[x] = height - bestY;
                    }
                }
            }

            // Interpolation
            for (let i = 0; i < width; i++) { if (isNaN(signal[i])) { let l = i - 1, r = i + 1; while (l >= 0 && isNaN(signal[l])) l--; while (r < width && isNaN(signal[r])) r++; if (l >= 0 && r < width) signal[i] = signal[l] + (signal[r] - signal[l]) * (i - l) / (r - l); else if (l >= 0) signal[i] = signal[l]; else if (r < width) signal[i] = signal[r]; else signal[i] = height / 2; } }

            return signal;
        }

        // qtc_10 Logic: カラーチャンネル優先抽出
        function extractSignalHolter(imgData, width, height, channel) {
            const signal = new Float32Array(width).fill(NaN);
            // 画像端のアーティファクト除外
            const yMargin = Math.max(2, Math.floor(height * 0.02));
            const yStart = yMargin;
            const yEnd = height - yMargin;

            for (let x = 0; x < width; x++) {
                let sumY = 0, count = 0;

                if (channel === 'black') {
                    let minLum = 255;
                    for (let y = yStart; y < yEnd; y++) {
                        const i = (y * width + x) * 4;
                        const lum = 0.299 * imgData[i] + 0.587 * imgData[i + 1] + 0.114 * imgData[i + 2];
                        if (lum < minLum) minLum = lum;
                    }
                    const threshold = Math.min(minLum + 50, 200);
                    for (let y = yStart; y < yEnd; y++) {
                        const i = (y * width + x) * 4;
                        const r = imgData[i], g = imgData[i + 1], b = imgData[i + 2];
                        const lum = 0.299 * r + 0.587 * g + 0.114 * b;
                        const sat = Math.max(r, g, b) - Math.min(r, g, b);
                        if (lum <= threshold && sat < 40) {
                            const w = (threshold - lum + 1);
                            sumY += y * w; count += w;
                        }
                    }
                } else if (channel === 'green') {
                    for (let y = yStart; y < yEnd; y++) {
                        const i = (y * width + x) * 4;
                        const r = imgData[i], g = imgData[i + 1], b = imgData[i + 2];
                        if (g > 40 && g > r + 15 && g > b + 15) {
                            const greenness = g - Math.max(r, b);
                            const w = Math.max(1, greenness);
                            sumY += y * w; count += w;
                        }
                    }
                } else if (channel === 'red') {
                    for (let y = yStart; y < yEnd; y++) {
                        const i = (y * width + x) * 4;
                        const r = imgData[i], g = imgData[i + 1], b = imgData[i + 2];
                        if (r > 40 && r > g + 15) {
                            const redness = r - g;
                            const w = Math.max(1, redness);
                            sumY += y * w; count += w;
                        }
                    }
                }

                if (count > 0) signal[x] = height - (sumY / count);
            }

            // Interpolation
            for (let i = 0; i < width; i++) {
                if (isNaN(signal[i])) {
                    let l = i - 1, r = i + 1;
                    while (l >= 0 && isNaN(signal[l])) l--;
                    while (r < width && isNaN(signal[r])) r++;
                    if (l >= 0 && r < width) signal[i] = signal[l] + (signal[r] - signal[l]) * (i - l) / (r - l);
                    else if (l >= 0) signal[i] = signal[l];
                    else if (r < width) signal[i] = signal[r];
                    else signal[i] = height / 2;
                }
            }
            return signal;
        }

        function detectRPeaks(state) {
            const { smooth, pxPerSec, width } = state;
            const edgeMargin = 15;
            const slope = new Float32Array(width).fill(0);
            for (let i = 2; i < width - 2; i++) { slope[i] = Math.abs(smooth[i + 1] - smooth[i - 1]); }

            // 信号の中央値を算出（エッジ除外、上向き・下向き両方のQRSに対応）
            const interiorSmooth = [];
            for (let i = edgeMargin; i < width - edgeMargin; i++) interiorSmooth.push(smooth[i]);
            interiorSmooth.sort((a, b) => a - b);
            const signalMedian = interiorSmooth[Math.floor(interiorSmooth.length / 2)];

            // 振幅スコア: 中央値からの絶対偏差（エッジ除外で最大偏差を算出）
            const scoreSignal = new Float32Array(width);
            let maxAbsDev = 0;
            for (let i = edgeMargin; i < width - edgeMargin; i++) {
                const dev = Math.abs(smooth[i] - signalMedian);
                if (dev > maxAbsDev) maxAbsDev = dev;
            }
            let slopeMax = 0;
            for (let i = edgeMargin; i < width - edgeMargin; i++) {
                if (slope[i] > slopeMax) slopeMax = slope[i];
            }

            for (let i = 0; i < width; i++) {
                const normDev = maxAbsDev > 0 ? Math.abs(smooth[i] - signalMedian) / maxAbsDev : 0;
                const normSlope = slope[i] / (slopeMax || 1);
                scoreSignal[i] = normDev + (normSlope * 3.0);
            }

            // 閾値はエッジ除外した内部領域のスコアのみで算出
            let interiorMaxScore = 0;
            for (let i = edgeMargin; i < width - edgeMargin; i++) {
                if (scoreSignal[i] > interiorMaxScore) interiorMaxScore = scoreSignal[i];
            }
            // === 閾値設定 ===
            const globalThreshold = interiorMaxScore * 0.40;
            const minRDist = pxPerSec * 0.45;

            let rPeaks = [];

            // Pass 1: グローバル閾値でR波候補を検出
            for (let i = edgeMargin; i < width - edgeMargin; i++) {
                if (scoreSignal[i] > scoreSignal[i - 1] && scoreSignal[i] > scoreSignal[i + 1] && scoreSignal[i] > globalThreshold) {
                    if (rPeaks.length === 0 || i - rPeaks[rPeaks.length - 1] > minRDist) {
                        rPeaks.push(i);
                    } else {
                        const lastIdx = rPeaks.length - 1;
                        if (scoreSignal[i] > scoreSignal[rPeaks[lastIdx]]) {
                            rPeaks[lastIdx] = i;
                        }
                    }
                }
            }

            // Pass 2: テンプレートマッチングによるギャップ補填
            // 検出済みR-peakからQRS波形テンプレートを生成し、正規化相互相関（NCC）で未検出ビートを探索
            if (rPeaks.length >= 2) {
                const rrIntervals = [];
                for (let i = 1; i < rPeaks.length; i++) rrIntervals.push(rPeaks[i] - rPeaks[i - 1]);
                rrIntervals.sort((a, b) => a - b);
                const medianRR = rrIntervals[Math.floor(rrIntervals.length / 2)];
                const gapThresholdRR = medianRR * 1.5;

                // テンプレート生成: 検出済みR-peak周辺 ±halfW の平均波形
                const halfW = Math.max(5, Math.floor(pxPerSec * 0.04)); // ±40ms
                const templateLen = halfW * 2 + 1;
                const template = new Float32Array(templateLen).fill(0);
                let validCount = 0;
                for (const rp of rPeaks) {
                    if (rp - halfW >= 0 && rp + halfW < width) {
                        for (let j = 0; j < templateLen; j++) {
                            template[j] += smooth[rp - halfW + j];
                        }
                        validCount++;
                    }
                }
                if (validCount > 0) {
                    for (let j = 0; j < templateLen; j++) template[j] /= validCount;
                }

                // テンプレートの平均・分散を事前算出
                let tMean = 0;
                for (let j = 0; j < templateLen; j++) tMean += template[j];
                tMean /= templateLen;
                let tVar = 0;
                for (let j = 0; j < templateLen; j++) tVar += (template[j] - tMean) * (template[j] - tMean);
                const tStd = Math.sqrt(tVar);

                if (validCount > 0 && tStd > 0.01) {
                    let insertions = [];
                    for (let i = 1; i < rPeaks.length; i++) {
                        const gap = rPeaks[i] - rPeaks[i - 1];
                        if (gap > gapThresholdRR) {
                            // ギャップ内でNCCを算出し、最高相関のピークをR候補とする
                            const gapStart = rPeaks[i - 1] + Math.floor(minRDist);
                            const gapEnd = rPeaks[i] - Math.floor(minRDist);
                            let bestNCC = 0.4; // 相関閾値 0.4
                            let bestPos = -1;

                            for (let pos = Math.max(halfW, gapStart); pos < Math.min(width - halfW, gapEnd); pos++) {
                                // 局所区間の平均・分散
                                let sMean = 0;
                                for (let j = 0; j < templateLen; j++) sMean += smooth[pos - halfW + j];
                                sMean /= templateLen;
                                let sVar = 0, crossCorr = 0;
                                for (let j = 0; j < templateLen; j++) {
                                    const sd = smooth[pos - halfW + j] - sMean;
                                    const td = template[j] - tMean;
                                    sVar += sd * sd;
                                    crossCorr += sd * td;
                                }
                                const sStd = Math.sqrt(sVar);
                                if (sStd > 0.01) {
                                    const ncc = crossCorr / (sStd * tStd);
                                    if (ncc > bestNCC) {
                                        bestNCC = ncc;
                                        bestPos = pos;
                                    }
                                }
                            }
                            if (bestPos > 0) {
                                insertions.push(bestPos);
                            }
                        }
                    }
                    // 挿入してソート
                    if (insertions.length > 0) {
                        rPeaks = rPeaks.concat(insertions);
                        rPeaks.sort((a, b) => a - b);
                    }
                }
            }

            // QRS極性の判定: 検出されたピーク位置での信号が中央値より上か下かで判定
            let aboveCount = 0, belowCount = 0;
            rPeaks.forEach(r => {
                if (smooth[r] >= signalMedian) aboveCount++;
                else belowCount++;
            });
            const isInvertedQRS = belowCount > aboveCount;
            state.isInvertedQRS = isInvertedQRS;

            // Snap to local extremum (陽性QRS: 最大値, 陰性QRS: 最小値)
            rPeaks = rPeaks.map(r => {
                let localBest = r;
                const range = isInvertedQRS ? 20 : 10;
                for (let k = r - range; k <= r + range; k++) {
                    if (k >= 0 && k < width) {
                        if (isInvertedQRS) {
                            if (smooth[k] < smooth[localBest]) localBest = k;
                        } else {
                            if (smooth[k] > smooth[localBest]) localBest = k;
                        }
                    }
                }
                return localBest;
            });

            // RR間隔整合性フィルタ: メディアンRRの50%未満の間隔を作るピークを除去
            if (rPeaks.length >= 3) {
                let filtered = true;
                while (filtered) {
                    filtered = false;
                    if (rPeaks.length < 3) break;
                    const intervals = [];
                    for (let i = 1; i < rPeaks.length; i++) intervals.push(rPeaks[i] - rPeaks[i - 1]);
                    const sortedInt = [...intervals].sort((a, b) => a - b);
                    const medRR = sortedInt[Math.floor(sortedInt.length / 2)];
                    const minRR = medRR * 0.65;
                    for (let i = 0; i < intervals.length; i++) {
                        if (intervals[i] < minRR) {
                            // 短すぎる間隔: スコアが低い方のピークを除去
                            const idx1 = i, idx2 = i + 1;
                            if (scoreSignal[rPeaks[idx1]] <= scoreSignal[rPeaks[idx2]]) {
                                rPeaks.splice(idx1, 1);
                            } else {
                                rPeaks.splice(idx2, 1);
                            }
                            filtered = true;
                            break;
                        }
                    }
                }
            }

            state.rPeaks = rPeaks;
        }

        // Manually switching channel (only in Holter mode)
        function switchChannel(index, channel) {
            const entry = canvasRegistry[index];
            if (!entry) return;
            const state = entry.canvas.appState;
            if (!state) return;

            // Manual switch implies user wants this channel
            state.manualChannelSelected = true;
            state.channel = channel;
            performSignalExtraction(state);
        }

        function detectBestChannel(imgData, width, height) {
            let blackScore = 0, greenScore = 0, redScore = 0;
            const step = Math.max(1, Math.floor(width / 200));

            for (let x = 0; x < width; x += step) {
                for (let y = 0; y < height; y++) {
                    const i = (y * width + x) * 4;
                    const r = imgData[i], g = imgData[i + 1], b = imgData[i + 2];
                    const lum = 0.299 * r + 0.587 * g + 0.114 * b;
                    const sat = Math.max(r, g, b) - Math.min(r, g, b);

                    if (lum < 80 && sat < 40) blackScore++;
                    if (g > 40 && g > r + 15 && g > b + 15) greenScore++;
                    if (r > 40 && r > g + 15) redScore++;
                }
            }

            const colorThreshold = blackScore * 0.3;
            if (greenScore > redScore && greenScore > colorThreshold) {
                if (greenScore > blackScore * 0.5) return 'green';
            }
            if (redScore > greenScore && redScore > colorThreshold) {
                if (redScore > blackScore * 0.5) return 'red';
            }
            return 'black';
        }

        // ---------------------------------------------------------
        // Existing Visualization & Math Functions (Merged & Cleaned)
        // ---------------------------------------------------------

        // ---------------------------------------------------------
        // 波形の色種別判定（standard / holter の切り替え用）  ver 2.3
        // ---------------------------------------------------------
        // 従来は「pxPerSec に最も近いプリセットが holter か」で抽出モードを決めていた。
        // しかし紙送り換算値(px/sec)と「ホルター記録かどうか」は本来無関係である。
        // 実際、赤方眼紙の標準心電図でも 1mm≒5.7px（=143px/sec）で取り込むと
        // ホルタープリセット(125px/sec)が最近傍になり holter 抽出へ誤って切り替わる。
        // holter 抽出は赤方眼を除外しないため方眼を波形として拾い、R波検出が破綻して
        // QT が1拍も算出されなくなっていた。
        //
        // ここでは「暗いピクセル＝波形本体」だけを見て無彩色か有彩色かを判定する。
        // 薄い赤方眼は輝度が高いので lum 閾値で自然に除外され、
        // detectBestChannel のように方眼へ引きずられない。
        function detectTraceKind(imgData, width, height) {
            const step = Math.max(1, Math.floor(width / 300)); // 約300列をサンプリング
            let dark = 0, green = 0, red = 0;
            for (let x = 0; x < width; x += step) {
                for (let y = 0; y < height; y++) {
                    const i = (y * width + x) * 4;
                    const r = imgData[i], g = imgData[i + 1], b = imgData[i + 2];
                    const lum = 0.299 * r + 0.587 * g + 0.114 * b;
                    if (lum >= 120) continue;                  // 薄い方眼・背景を除外
                    dark++;
                    const sat = Math.max(r, g, b) - Math.min(r, g, b);
                    if (sat < 40) continue;                    // 無彩色（黒波形）
                    if (g > r + 15 && g > b + 15) green++;
                    else if (r > g + 15 && r > b + 15) red++;
                }
            }
            if (dark < 50) return 'black';                     // 判定材料不足は安全側
            if (green / dark > 0.25) return 'green';
            if (red / dark > 0.25) return 'red';
            return 'black';
        }

        // ============================================================
        // キャリブレーション自動計測（ver 2.3 全面改訂）
        //   格子線の位置をサブピクセルで求め、x_k = x0 + k·p の最小二乗フィットで
        //   1mm 間隔 p を推定する。
        //
        // 旧実装（自己相関コム法）の問題:
        //   ・自己相関のピーク位置が整数ラグなので、1mm<4px の画像では周期を
        //     分解できない。「隣接ピーク間隔の中央値」が整数に張り付き、
        //     真値 3.2px を 3.0px と誤って −6% の誤差が出た（しかも信頼と表示）。
        //   ・5mm主線の周りに現れる副ピークが間隔統計を汚染する。
        //   ・信頼判定 ac[peaks[0]]>0.15 は「最初に見つかったピーク」という
        //     恣意的な量で、正しい推定値を誤って棄却していた。
        //   ・赤格子が無いホルター印刷では、色付き波形そのものを格子と誤認し、
        //     RR間隔由来の無意味な値を「信頼」として返していた。
        //   ・JPEG圧縮された画像では赤格子マスクが崩れて全く検出できなかった。
        // ============================================================

        // 格子画素の列プロファイルを作る。kind: 'red'(赤方眼紙) / 'gray'(ホルター印刷)
        function gridColumnProfile(imgData, width, height, kind) {
            const col = new Float32Array(width);
            const yStep = Math.max(1, Math.floor(height / 500));
            const rows = Math.ceil(height / yStep);
            let hit = 0;
            for (let x = 0; x < width; x++) {
                let c = 0;
                for (let y = 0; y < height; y += yStep) {
                    const i = (y * width + x) * 4;
                    const r = imgData[i], g = imgData[i + 1], b = imgData[i + 2];
                    let ok;
                    if (kind === 'red') {
                        // 赤/オレンジ/ピンク格子（黒トレース・白背景を除外）
                        ok = (r - b) > 25 && (r - g) > 18 && r > 140;
                    } else {
                        // 灰色の格子（黒トレースは lum<120、白背景は lum>235 で除外）
                        const lum = 0.299 * r + 0.587 * g + 0.114 * b;
                        const sat = Math.max(r, g, b) - Math.min(r, g, b);
                        ok = sat < 25 && lum > 120 && lum < 235;
                    }
                    if (ok) c++;
                }
                col[x] = c; hit += c;
            }
            return { col, frac: hit / (width * rows) };
        }

        // 列プロファイルの局所ピーク＝格子線。放物線内挿でサブピクセル位置を得る。
        function gridLinePeaks(col, thr) {
            const pos = [], amp = [];
            for (let x = 1; x < col.length - 1; x++) {
                if (col[x] >= col[x - 1] && col[x] > col[x + 1] && col[x] >= thr) {
                    const y0 = col[x - 1], y1 = col[x], y2 = col[x + 1];
                    const den = y0 - 2 * y1 + y2;
                    let dx = Math.abs(den) > 1e-9 ? 0.5 * (y0 - y2) / den : 0;
                    if (!(Math.abs(dx) <= 1)) dx = 0;
                    pos.push(x + dx); amp.push(y1);
                }
            }
            return { pos, amp };
        }

        // 周期 p を仮定して各線に格子番号 k を割り当て、最小二乗で p を精緻化する
        function fitGridPeriod(pos, p) {
            const n = pos.length;
            const ks = new Float64Array(n);
            const seen = new Set();
            for (let i = 0; i < n; i++) { ks[i] = Math.round((pos[i] - pos[0]) / p); seen.add(ks[i]); }
            if (seen.size < n * 0.9) return null;          // 同一番号への重複が多い＝周期が短すぎる
            let sk = 0, sx = 0, skk = 0, skx = 0;
            for (let i = 0; i < n; i++) { sk += ks[i]; sx += pos[i]; skk += ks[i] * ks[i]; skx += ks[i] * pos[i]; }
            const den = n * skk - sk * sk;
            if (Math.abs(den) < 1e-9) return null;
            const slope = (n * skx - sk * sx) / den;
            const inter = (sx - slope * sk) / n;
            let ss = 0;
            for (let i = 0; i < n; i++) { const e = pos[i] - (inter + slope * ks[i]); ss += e * e; }
            return { p: slope, resid: Math.sqrt(ss / n) };
        }

        // 周期候補を細かく走査し、割り当て残差が最小の解を選ぶ（エイリアシング回避）
        function searchGridPeriod(pos) {
            const d = [];
            for (let i = 1; i < pos.length; i++) { const v = pos[i] - pos[i - 1]; if (v > 0.8) d.push(v); }
            if (d.length < 5) return null;
            d.sort((a, b) => a - b);
            const p0 = d[Math.floor(d.length / 2)];
            let best = null;
            for (let p = p0 * 0.7; p <= p0 * 1.45; p += 0.002) {
                const f = fitGridPeriod(pos, p);
                if (!f) continue;
                if (Math.abs(f.p - p) > 0.15 * p) continue;   // 自己無撞着な解のみ採用
                if (!best || f.resid < best.resid) best = f;
            }
            return best;
        }

        // 検出した格子間隔 p が 1mm か 5mm かを解釈する。
        //   赤方眼紙は 1mm 格子が必ず印刷される。
        //   ホルター印刷の灰色格子は 5mm ボックス（25mmごとに強線）で描かれるのが通例。
        //   「5本に1本が強い」パターンは 1mm/5mm でも 5mm/25mm でも現れるため
        //   判別には使えず、格子色と絶対スケールで判断する。
        function resolveGridMm(p, kind) {
            const inRange = v => v >= 2.2 && v <= 30;        // 1mm=2.2〜30px（55〜750 px/sec）
            if (kind === 'gray') {
                if (p >= 10 && inRange(p / 5)) return p / 5;
                return inRange(p) ? p : null;
            }
            if (inRange(p)) return p;
            if (inRange(p / 5)) return p / 5;                // 1mm線が薄く5mm線だけ拾えた場合
            return null;
        }

        function detectCalibration(imgData, width, height) {
            for (const kind of ['red', 'gray']) {
                const { col, frac } = gridColumnProfile(imgData, width, height, kind);
                if (frac < 0.003) continue;
                let mx = 0;
                for (let x = 0; x < width; x++) if (col[x] > mx) mx = col[x];
                if (mx <= 0) continue;
                let pk = null;
                for (const t of [0.25, 0.15, 0.10]) {
                    const c = gridLinePeaks(col, mx * t);
                    if (c.pos.length >= 10) { pk = c; break; }
                }
                if (!pk) continue;
                const fit = searchGridPeriod(pk.pos);
                if (!fit) continue;
                const mm = resolveGridMm(fit.p, kind);
                if (mm === null) continue;
                const pxPerSec = Math.round(mm * 25);
                const rr = fit.resid / fit.p;                // 格子の当てはまり具合
                if (pxPerSec < 55 || pxPerSec > 750 || pk.pos.length < 10 || rr >= 0.12) continue;
                return {
                    pxPerSec, method: 'auto-grid', confident: true,
                    debug: `${kind === 'red' ? '赤方眼' : '灰格子'} 間隔${fit.p.toFixed(2)}px(=${Math.round(fit.p / mm)}mm) 線${pk.pos.length}本 ` +
                        `残差${(rr * 100).toFixed(1)}% → 1mm=${mm.toFixed(3)}px → 25mm(1s)=${pxPerSec}px`
                };
            }
            return { pxPerSec: 0, method: 'none', confident: false, debug: '格子を検出できませんでした' };
        }

        function updateCalDisplay(index, pxPerSec, method) {
            const calDisplay = document.getElementById(`calDisplay${index}`);
            const calMethodEl = document.getElementById(`calMethod${index}`);
            if (!calDisplay || !calMethodEl) return;

            calDisplay.textContent = `${pxPerSec} px/sec (25mm=1s)`;
            const calInput = document.getElementById(`calInput${index}`);
            if (calInput) calInput.value = pxPerSec;

            calMethodEl.className = 'cal-method';
            if (method === 'auto-grid') {
                calMethodEl.textContent = 'グリッド実測';
                calMethodEl.classList.add('auto-scale');
            } else if (method === 'auto-scale' || method === 'auto-detected') {
                calMethodEl.textContent = '自動検出';
                calMethodEl.classList.add('auto-scale');
            } else if (method === 'grid-fallback') {
                calMethodEl.textContent = '簡易検出';
                calMethodEl.classList.add('grid-fallback');
            } else if (method === 'drag') {
                calMethodEl.textContent = 'ドラッグ補正';
                calMethodEl.classList.add('drag');
            } else if (method && method.startsWith('preset-')) {
                const presetName = method.replace('preset-', '');
                const nameMap = { '100': '100%', '200': '200%', 'holter': 'ホルター' };
                calMethodEl.textContent = 'プリセット: ' + (nameMap[presetName] || presetName);
                calMethodEl.classList.add('manual');
            }
        }

        function syncCalibrationToOther(sourceIndex, newPxPerSec, method) {
            const otherIndex = sourceIndex === 1 ? 2 : 1;
            const otherEntry = canvasRegistry[otherIndex];
            if (!otherEntry) return;

            const otherCanvas = otherEntry.canvas;
            const otherState = otherCanvas.appState;
            if (!otherState) return;

            otherState.pxPerSec = newPxPerSec;
            otherState.calMethod = method;

            // Note: If sync implies mode sync, we should also sync extractionMode, but standard/holter might differ per image?
            // For now, assuming calibration pixel density is consistent, but mode depends on user setting (selectPreset applies to all).
            // If user dragged calibration, we assume mode stays same.

            updateCalDisplay(otherIndex, newPxPerSec, method);

            otherState.manualTEnds = {};
            otherState.manualQOnsets = {};

            // Re-detect R-peaks if scale changed drastically?
            // Usually R-detection is robust to scale, but Qt calc depends on it.
            // For drag-cal, we re-analyze beats, but not re-extract signal usually.
            analyzeBeats(otherState);
            renderCanvas(otherCanvas, otherState);
            updateTable(otherEntry.container, otherState, otherIndex);
        }

        // ---------------------------------------------------------
        // 基線検出ヘルパー (等電位レベル = TP/PRセグメント)
        // ---------------------------------------------------------
        // ヒストグラム最頻値方式:
        //   前R波後〜Q直前の拡張拡張区間では、等電位部（TP/PRセグメント）が
        //   最も長く一定レベルに留まるため、輝度(y)ヒストグラムの最頻ビンが等電位に一致する。
        //   T波（上下に掃引）やST偏位に頑健で、旧「最小分散窓」が平坦なT波頂点/P波を
        //   誤検出する問題を解消する。
        function estimateIsoelectric(smooth, prevR, roughQ, pxPerSec) {
            // 探索区間: 前R+100ms（前QRSを除外）〜 roughQ-3px（現QRS開始直前）
            const start = Math.max(prevR + Math.floor(0.10 * pxPerSec), prevR + 6);
            const end = Math.max(roughQ - 3, start + 1);
            if (end - start < 4) {
                // 区間が短すぎる場合: Q直前15pxの中央値
                const s2 = Math.max(prevR + 3, roughQ - 15), e2 = roughQ;
                if (e2 > s2) {
                    const a = [];
                    for (let k = s2; k < e2; k++) a.push(smooth[k]);
                    a.sort((x, y) => x - y);
                    return a[Math.floor(a.length / 2)];
                }
                return smooth[roughQ];
            }
            let lo = Infinity, hi = -Infinity;
            for (let k = start; k < end; k++) { const v = smooth[k]; if (v < lo) lo = v; if (v > hi) hi = v; }
            const bin = 2; // 2pxビン
            const nb = Math.max(1, Math.floor((hi - lo) / bin) + 1);
            const hist = new Int32Array(nb);
            for (let k = start; k < end; k++) {
                let b = Math.floor((smooth[k] - lo) / bin);
                if (b < 0) b = 0; if (b >= nb) b = nb - 1;
                hist[b]++;
            }
            let bestBin = 0, bestCnt = -1;
            for (let b = 0; b < nb; b++) { if (hist[b] > bestCnt) { bestCnt = hist[b]; bestBin = b; } }
            // 最頻ビン±1bin内のサンプル中央値を等電位レベルとする
            const centerLo = lo + (bestBin - 0.5) * bin, centerHi = lo + (bestBin + 1.5) * bin;
            const vals = [];
            for (let k = start; k < end; k++) { const v = smooth[k]; if (v >= centerLo && v <= centerHi) vals.push(v); }
            if (!vals.length) return lo + (bestBin + 0.5) * bin;
            vals.sort((a, b) => a - b);
            return vals[Math.floor(vals.length / 2)];
        }

        // beat間一貫性制約用: target近傍で最も平坦な等電位窓を再探索
        function estimateIsoelectricNear(smooth, prevR, roughQ, pxPerSec, target, tol) {
            const start = Math.max(prevR + Math.floor(0.10 * pxPerSec), prevR + 6);
            const end = Math.max(roughQ - 3, start + 1);
            const winLen = Math.max(8, Math.min(30, Math.floor(0.06 * pxPerSec)));
            if (end - start < winLen) return null;
            let best = null, bestVar = Infinity;
            for (let s = start; s + winLen <= end; s += 2) {
                let sum = 0, sum2 = 0;
                for (let k = s; k < s + winLen; k++) { const v = smooth[k]; sum += v; sum2 += v * v; }
                const mean = sum / winLen;
                const variance = sum2 / winLen - mean * mean;
                const a = [];
                for (let k = s; k < s + winLen; k++) a.push(smooth[k]);
                a.sort((x, y) => x - y);
                const med = a[Math.floor(winLen / 2)];
                if (Math.abs(med - target) <= tol && variance < bestVar) { bestVar = variance; best = med; }
            }
            return best;
        }

        // 平滑中央差分（±2px）: 単一ピクセルノイズに頑健な勾配
        function smoothedSlope(sm, k, width) {
            const a = sm[Math.max(0, k - 2)], b = sm[Math.min(width - 1, k + 2)];
            return (b - a) / 4;
        }

        // =========================================================
        // Q-onset 検出 (ver2.1)
        // =========================================================
        // Part 1: 基線離脱点検出
        //   「R極値から後方へ遡り、最初に『基線上かつ平坦』がN px連続する区間を見つけ、
        //     その区間のR側の端を onset とする」で以下3形態を1本のロジックで扱う。
        //     (1) Q波あり → 基線からQ波へ移行する点
        //     (2) Q波なし → 基線からR波へ移行する点
        //     (3) QS pattern → 基線から下向きに下がり始める点
        //   |smooth - baseline| で判定するため陽性/陰性QRSの分岐が不要。
        //   連続N条件が要点: Q波の谷底も「基線近傍かつ勾配≈0」を満たしうるが谷では
        //   数pxしか続かないので run が成立せず、走査は谷とr波を通過して真のPR部に到達する。
        //
        // Part 2: 中心線による精密化（extractCenterline / refineQOnset）
        //   extractSignalStandard は「画像中心から最も遠い画素」を採るため、基線より
        //   画像中心側へ向かう偏位（Q波・QS初期下行）がトレース太さ分だけ潰れる。
        //   Q-onset窓に限りトレース重心（中心線）で再抽出して離脱点を確定する。
        // ---------------------------------------------------------

        const CL_LUM_THRESHOLD = 160; // 中心線抽出の暗画素判定輝度

        // 指定区間のトレース中心線を前列追従で抽出（imgDataのy座標系で返す）
        function extractCenterline(imgData, width, height, x0, x1, anchorY) {
            const n = x1 - x0 + 1;
            const out = new Float32Array(n);
            let prev = anchorY;
            for (let x = x0; x <= x1; x++) {
                let bestC = null, bestD = Infinity;
                let runTop = -1, wsum = 0, ysum = 0;
                for (let y = 1; y < height - 1; y++) {
                    const i = (y * width + x) * 4;
                    const r = imgData[i], g = imgData[i + 1], b = imgData[i + 2];
                    const isGrid = (r > 100 && r > g + 30 && r > b + 30); // 赤方眼紙を除外
                    const lum = 0.299 * r + 0.587 * g + 0.114 * b;
                    if (!isGrid && lum < CL_LUM_THRESHOLD) {
                        const wt = CL_LUM_THRESHOLD - lum;
                        if (runTop < 0) { runTop = y; wsum = wt; ysum = y * wt; }
                        else { wsum += wt; ysum += y * wt; }
                    } else if (runTop >= 0) {
                        const c = ysum / wsum;
                        const d = Math.min(Math.abs(c - prev), Math.abs(runTop - prev), Math.abs(y - 1 - prev));
                        if (d < bestD) { bestD = d; bestC = c; }
                        runTop = -1;
                    }
                }
                if (runTop >= 0) {
                    const c = ysum / wsum;
                    const d = Math.min(Math.abs(c - prev), Math.abs(runTop - prev), Math.abs(height - 2 - prev));
                    if (d < bestD) { bestD = d; bestC = c; }
                }
                if (bestC !== null) prev = bestC;   // 暗画素が無い列は前列値を維持
                out[x - x0] = prev;
            }
            return out;
        }

        // Part 1: 基線離脱点の粗検出。戻り: 位置(px)
        function coarseQOnset(smooth, width, rLoc, prevR, baseline, pxPerSec) {
            const pxPerMm = pxPerSec / 25;
            const qLimit = Math.max(prevR + 10, Math.floor(rLoc - 0.12 * pxPerSec)); // 120ms窓
            if (qLimit >= rLoc - 2) return rLoc;

            const A = Math.abs(smooth[rLoc] - baseline);                       // QRS振幅
            // 「0.5mm相当、ただし4px未満にはしない」。1mm<8px の画像では PR部の
            // 緩い下降（基線推定はTP部に引かれるため数px低く出る）が0.5mmを超え、
            // runが途切れて停止位置がbeat毎に数pxずれるため絶対下限を設ける。
            const ampTol = Math.max(4, Math.min(0.50 * pxPerMm, Math.max(0.15 * pxPerMm, 0.06 * A)));
            let maxSlope = 0;
            for (let k = qLimit; k <= rLoc; k++) {
                const s = Math.abs(smoothedSlope(smooth, k, width));
                if (s > maxSlope) maxSlope = s;
            }
            const slopeTol = Math.max(0.02 * pxPerMm, 0.10 * maxSlope);
            const N = Math.max(3, Math.round(0.010 * pxPerSec));               // 持続10ms

            // ver 2.3: 振幅条件の基準はQRS直前の等電位レベル（PR部）をローカル推定して使う。
            //   引数 baseline は estimateIsoelectric（TP部・ST部を含むヒストグラム最頻値）
            //   なので、ST部が持ち上がった波形では PR部より 0.5〜1.0mm 高く出ることがある。
            //   その場合 PR部が振幅条件から外れて run が成立せず、走査が PR部を通り越して
            //   P波の下行脚で停止し、Q-onset が 70〜100ms も手前へ飛ぶ事故が起きていた。
            //   rLoc直前200msのうち「平坦なサンプル」の中央値を基準にすればPR部に一致する。
            let localRef = baseline;
            {
                const refStart = Math.max(prevR + 5, Math.floor(rLoc - 0.20 * pxPerSec));
                const flatVals = [];
                for (let k = refStart; k < rLoc; k++) {
                    if (Math.abs(smoothedSlope(smooth, k, width)) <= slopeTol) flatVals.push(smooth[k]);
                }
                if (flatVals.length >= 5) {
                    flatVals.sort((a, b) => a - b);
                    const med = flatVals[Math.floor(flatVals.length / 2)];
                    // 基線から大きく離れる推定は誤りとみなし採用しない
                    if (Math.abs(med - baseline) <= 1.5 * pxPerMm) localRef = med;
                }
            }

            let run = 0, coarse = -1;
            for (let k = rLoc - 1; k >= qLimit; k--) {
                if (Math.abs(smooth[k] - localRef) <= ampTol && Math.abs(smoothedSlope(smooth, k, width)) <= slopeTol) {
                    run++;
                    if (run >= N) { coarse = k + run - 1; break; }
                } else {
                    run = 0;
                }
            }
            // フォールバック1: 平坦条件のみ（基線推定のずれ・PQ低下・P波融合時）
            if (coarse < 0) {
                for (let k = rLoc - 1; k >= qLimit; k--) {
                    if (Math.abs(smoothedSlope(smooth, k, width)) <= 0.20 * maxSlope) { coarse = k; break; }
                }
            }
            // フォールバック2: 窓の下限
            if (coarse < 0) coarse = qLimit;
            // サニティガード: R頂点近傍は不正
            const guard = Math.max(3, Math.floor(0.01 * pxPerSec));
            if (coarse > rLoc - guard) coarse = rLoc - guard;
            return coarse;
        }

        // Part 2: 中心線で離脱点を精密化
        //   戻り: { onset, gateOK }  gateOK=false は解像度/基線ノイズ不足でPart2を適用できない
        function refineQOnset(state, prevR, baseline, coarse) {
            const { imgData, width, height, pxPerSec } = state;
            const pxPerMm = pxPerSec / 25;
            const N = Math.max(3, Math.round(0.010 * pxPerSec));
            const back = Math.max(N, Math.round(0.020 * pxPerSec));   // 精密化区間 20ms
            const fwd = Math.max(1, Math.round(0.004 * pxPerSec));
            const noiseLen = Math.max(10, Math.floor(0.040 * pxPerSec)); // 基線ノイズ計測窓 40ms
            const bandStart = coarse - back;
            const nStart = Math.max(prevR + 5, bandStart - noiseLen);
            if (bandStart - nStart < 6) return { onset: coarse, gateOK: false };
            const xEnd = Math.min(width - 2, coarse + fwd);
            if (xEnd <= bandStart) return { onset: coarse, gateOK: false };

            const cl = extractCenterline(imgData, width, height, nStart, xEnd, height - baseline);
            const at = (x) => cl[x - nStart];

            // 基線窓の中央値と最大偏位
            const nv = [];
            for (let x = nStart; x <= bandStart; x++) nv.push(at(x));
            nv.sort((a, b) => a - b);
            const mu = nv[Math.floor(nv.length / 2)];
            let maxDev = 0;
            for (let x = nStart; x <= bandStart; x++) {
                const d = Math.abs(at(x) - mu);
                if (d > maxDev) maxDev = d;
            }
            // τは「基線窓の最大偏位」から決める（MAD等のロバスト推定では
            // 基線ゆらぎを外れ値として捨ててしまい、誤発火して早い側に外れる）
            const ceiling = 0.40 * pxPerMm;   // 生理的離脱幅の上限 ≒0.4mm(0.04mV)
            const tauRaw = 1.2 * maxDev;
            if (tauRaw > ceiling) return { onset: coarse, gateOK: false }; // 基線ノイズ過大
            const tau = Math.max(tauRaw, 0.10 * pxPerMm);

            // bandを前方走査し、τを超える離脱がM px持続する最初の点
            //  （後方走査ではq→rの基線交差点で誤停止し、極値基準ではr波に極値を取られる）
            const M = Math.max(2, Math.round(0.004 * pxPerSec));
            for (let x = bandStart; x <= xEnd; x++) {
                if (Math.abs(at(x) - mu) <= tau) continue;
                let ok = true;
                for (let j = x; j < Math.min(x + M, xEnd + 1); j++) {
                    if (Math.abs(at(j) - mu) <= tau) { ok = false; break; }
                }
                if (ok) return { onset: x, gateOK: true };
            }
            return { onset: coarse, gateOK: true }; // 離脱点を見つけられず
        }

        function analyzeBeats(state) {
            const { smooth, rPeaks, pxPerSec, width, manualTEnds, manualQOnsets } = state;
            if (!state.manualTPeaks) state.manualTPeaks = {};
            if (!state.manualBaselines) state.manualBaselines = {};
            const manualTPeaks = state.manualTPeaks;
            const manualBaselines = state.manualBaselines;

            // ============================================================
            // Pass 1: 各beatの粗Q-onstと基線候補を算出
            // ============================================================
            const meta = [];
            for (let i = 1; i < rPeaks.length; i++) {
                const rLoc = rPeaks[i], prevR = rPeaks[i - 1];
                const rrSec = (rLoc - prevR) / pxPerSec;
                const hr = 60 / rrSec;
                const beatId = i;

                // 粗Q-onset推定（基線なし）。基線推定窓の端を決めるためだけに使う。
                // 窓は精密検出と同じ120msに揃える。
                let roughQ = rLoc;
                const qLimit = Math.max(prevR + 10, Math.floor(rLoc - 0.12 * pxPerSec));
                if (state.isInvertedQRS) {
                    let maxVal = smooth[rLoc];
                    for (let k = rLoc - 1; k >= qLimit; k--) {
                        if (smooth[k] >= maxVal) { maxVal = smooth[k]; roughQ = k; }
                        else if (smooth[k] < maxVal - 3) break;
                    }
                } else {
                    roughQ = rLoc;
                    for (let k = rLoc - 1; k >= qLimit; k--) {
                        if (smooth[k] <= smooth[roughQ]) roughQ = k;
                        else if (smooth[k] > smooth[roughQ] + 3) break;
                    }
                }
                // サニティガード: R頂点に張り付いた場合は窓中央へ退避
                const roughGuard = Math.max(3, Math.floor(0.01 * pxPerSec));
                if (roughQ > rLoc - roughGuard) roughQ = Math.max(qLimit, rLoc - roughGuard);

                const baseCand = estimateIsoelectric(smooth, prevR, roughQ, pxPerSec);
                meta.push({ i, beatId, rLoc, prevR, rrSec, hr, roughQ, baseCand });
            }

            // ============================================================
            // 基線のbeat間一貫性制約（ドリフト抑制）
            //   全beatの等電位候補の中央値を基準(globalBase)とし、
            //   許容偏差tol（MADベース）を超える外れ値のみ基準近傍へ引き戻す。
            //   → 真の緩やかな基線変動は許容しつつ、誤検出による上下ブレを除去。
            // ============================================================
            const cands = meta.map(m => m.baseCand).filter(v => v != null && isFinite(v));
            let globalBase = null, tol = 6;
            if (cands.length) {
                const sc = [...cands].sort((a, b) => a - b);
                globalBase = sc[Math.floor(sc.length / 2)];
                const devs = cands.map(v => Math.abs(v - globalBase)).sort((a, b) => a - b);
                const mad = devs[Math.floor(devs.length / 2)];
                tol = Math.max(6, 3 * mad);
            }

            // ============================================================
            // Pass 2a: 基線確定（手動 > 一貫性制約 > 候補）
            // ============================================================
            for (const m of meta) {
                const { beatId, rLoc, prevR, roughQ } = m;
                let baseline;
                if (manualBaselines[beatId] !== undefined) {
                    baseline = manualBaselines[beatId];
                } else {
                    baseline = m.baseCand;
                    if (baseline == null || !isFinite(baseline)) {
                        baseline = (globalBase != null) ? globalBase : smooth[roughQ];
                    } else if (globalBase != null && Math.abs(baseline - globalBase) > tol) {
                        // 外れ値: globalBase近傍で平坦窓を再探索、無ければクランプ
                        const refined = estimateIsoelectricNear(smooth, prevR, roughQ, pxPerSec, globalBase, tol);
                        baseline = (refined != null) ? refined : globalBase;
                    }
                }
                m.baseline = baseline;
            }

            // ============================================================
            // Pass 2b: Q-onset検出（Part1 基線離脱点 → Part2 中心線精密化）
            //   Part2の採否はbeat毎ではなく画像単位（多数決）で決める。
            //   beat毎に切り替えると同一画像内で方式が混在し、beat間で系統的に
            //   1〜2pxずれてQTのばらつきが増えるため。
            // ============================================================
            for (const m of meta) {
                m.coarseQ = coarseQOnset(smooth, width, m.rLoc, m.prevR, m.baseline, pxPerSec);
            }
            let gateOKCount = 0;
            for (const m of meta) {
                const res = refineQOnset(state, m.prevR, m.baseline, m.coarseQ);
                m.refinedQ = res.onset;
                m.refineGateOK = res.gateOK;
                if (res.gateOK) gateOKCount++;
            }
            const useRefine = meta.length > 0 && gateOKCount * 2 > meta.length;
            state.qOnsetMode = useRefine ? 'centerline' : 'coarse';
            for (const m of meta) {
