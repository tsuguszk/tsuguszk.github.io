                }

                const tStart = Math.floor(rLoc + Math.max(0.12 * pxPerSec, 20));
                const nextR = (i < rPeaks.length - 1) ? rPeaks[i + 1] : width;
                const rrLen = nextR - rLoc;
                // T波検索範囲: RR×0.75 or R+800msの小さい方。nextRからmax(150ms,20px)のマージンでP波除外
                const tLimit = Math.min(nextR - Math.max(0.15 * pxPerSec, 20), rLoc + Math.max(0.8 * pxPerSec, rrLen * 0.75));
                if (tLimit <= tStart) continue;

                // --- T波極性の自動判定 ---
                let tMaxVal = -Infinity, tMinVal = Infinity;
                for (let k = tStart; k < tLimit; k++) {
                    if (smooth[k] > tMaxVal) tMaxVal = smooth[k];
                    if (smooth[k] < tMinVal) tMinVal = smooth[k];
                }
                const isNegativeT = Math.abs(tMinVal - baseline) > Math.abs(tMaxVal - baseline);

                // T-peak (陽性: 最大値, 陰性: 最小値=谷)
                let tPeak;
                if (manualTPeaks[beatId] !== undefined) {
                    tPeak = manualTPeaks[beatId];
                } else {
                    if (isNegativeT) {
                        let tMin = Infinity; tPeak = -1;
                        for (let k = tStart; k < tLimit; k++) { if (smooth[k] < tMin) { tMin = smooth[k]; tPeak = k; } }
                    } else {
                        let tMax = -Infinity; tPeak = -1;
                        for (let k = tStart; k < tLimit; k++) { if (smooth[k] > tMax) { tMax = smooth[k]; tPeak = k; } }
                    }
                    if (tPeak === -1) continue;

                    // T-peak振幅フィルタ: 基線からの偏差が小さすぎる場合はノイズと判定
                    const tAmp = Math.abs(smooth[tPeak] - baseline);
                    if (tAmp < 3) continue;
                }

                // 勾配探索 (陽性: 最急下り勾配, 陰性: 最急上り勾配)
                // tLimitまで探索（200ms制限を撤廃）
                const slopeEnd = Math.min(tLimit, width - 1);
                let bestSlope = 0, slopeIdx = -1;
                if (isNegativeT) {
                    for (let k = tPeak; k < slopeEnd - 1; k++) {
                        const s = smooth[k + 1] - smooth[k];
                        if (s > bestSlope) { bestSlope = s; slopeIdx = k; }
                    }
                } else {
                    for (let k = tPeak; k < slopeEnd - 1; k++) {
                        const s = smooth[k + 1] - smooth[k];
                        if (s < bestSlope) { bestSlope = s; slopeIdx = k; }
                    }
                }

                // 勾配が見つからない場合のフォールバック: T-peak後に基線に戻る点をT-endとする
                const slopeValid = isNegativeT ? (slopeIdx >= 0 && bestSlope > 0) : (slopeIdx >= 0 && bestSlope < 0);
                let tEnd;
                if (slopeValid) {
                    tEnd = (baseline - smooth[slopeIdx]) / bestSlope + slopeIdx;
                } else {
                    // フォールバック: T-peak後に信号が基線の±2px以内に戻る点
                    tEnd = -1;
                    for (let k = tPeak + 2; k < slopeEnd; k++) {
                        if (Math.abs(smooth[k] - baseline) < 2) { tEnd = k; break; }
                    }
                    if (tEnd < 0) {
                        // それでも見つからない場合: T-peakから基線方向に最も近づく点
                        let minDist = Infinity;
                        for (let k = tPeak + 2; k < slopeEnd; k++) {
                            const d = Math.abs(smooth[k] - baseline);
                            if (d < minDist) { minDist = d; tEnd = k; }
                        }
                    }
                    if (tEnd < 0) continue;
                    slopeIdx = Math.max(tPeak, tEnd - 5);
                    bestSlope = (smooth[Math.min(slopeIdx + 1, width - 1)] - smooth[slopeIdx]) || -0.1;
                }

                const qtMs = (tEnd - qTrough) / pxPerSec * 1000;

                // QT生理学的範囲チェック (200-700ms)
                if (qtMs < 200 || qtMs > 700) continue;

                beats.push({
                    id: beatId, rr: rrSec * 1000, hr, qt: qtMs,
                    qtcB: qtMs / Math.sqrt(rrSec), qtcF: qtMs / Math.cbrt(rrSec),
                    qOnset: qTrough, tPeak, tEnd, x1: slopeIdx, minSlope: bestSlope, y1: smooth[slopeIdx], baseline, rLoc, prevR,
                    isManual: !!(manualTPeaks[beatId] !== undefined),
                    isNegativeT
                });
            }
            state.beats = beats;
        }

        function recalcSingleQT(state, beatIndex) {
            const b = state.beats[beatIndex];
            if (!b) return;
            const qtMs = (b.tEnd - b.qOnset) / state.pxPerSec * 1000;
            const rrSec = b.rr / 1000;
            b.qt = qtMs;
            b.qtcB = qtMs / Math.sqrt(rrSec);
            b.qtcF = qtMs / Math.cbrt(rrSec);
            b.isManual = true;
        }

        function renderCanvas(canvas, state) {
            const ctx = canvas.getContext('2d');
            const { img, width, height, smooth, beats, pxPerSec, rPeaks, calX, calY, calH } = state;

            ctx.clearRect(0, 0, width, height);
            ctx.drawImage(img, 0, 0, width, height);

            // デバッグ: smooth信号をオーバーレイ表示（黄色線）+ TP segment表示
            if (state.showSignalOverlay) {
                ctx.save();
                // QT間隔をハイライト（緑の半透明帯）= Q-onset〜T-end
                if (beats.length > 0) {
                    ctx.globalAlpha = 0.15;
                    ctx.fillStyle = "#00ff00";
                    for (const b of beats) {
                        const qStart = Math.floor(b.qOnset);
                        const tEndX = Math.floor(b.tEnd);
                        if (tEndX > qStart) {
                            ctx.fillRect(qStart, 0, tEndX - qStart, height);
                        }
                    }
                }
                // smooth信号（赤線）
                ctx.globalAlpha = 0.85;
                ctx.strokeStyle = "#cc0000";
                ctx.lineWidth = 2;
                ctx.beginPath();
                let started = false;
                for (let x = 0; x < width; x++) {
                    const y = height - smooth[x];
                    if (!started) { ctx.moveTo(x, y); started = true; }
                    else { ctx.lineTo(x, y); }
                }
                ctx.stroke();
                ctx.restore();
            }

            ctx.globalAlpha = 0.6;
            beats.forEach(b => {
                ctx.strokeStyle = "blue"; ctx.lineWidth = 2; ctx.beginPath();
                const baseS = Math.max(0, Math.floor(b.rLoc - 0.2 * pxPerSec));
                ctx.moveTo(baseS, height - b.baseline); ctx.lineTo(b.tEnd + 20, height - b.baseline); ctx.stroke();

                ctx.fillStyle = "green"; ctx.beginPath();
                ctx.arc(b.qOnset, height - smooth[Math.floor(b.qOnset)], 4, 0, Math.PI * 2); ctx.fill();

                if (!b.isManual) {
                    ctx.fillStyle = b.isNegativeT ? "cyan" : "gold"; ctx.strokeStyle = "black"; ctx.lineWidth = 1; ctx.beginPath();
                    ctx.arc(b.tPeak, height - smooth[b.tPeak], 4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                }

                // 接線を常に描画
                if (b.minSlope !== 0) {
                    ctx.strokeStyle = "red"; ctx.lineWidth = 2; ctx.beginPath();
                    const tx1 = b.x1 - 15, tx2 = b.tEnd + 15;
                    const ty1 = b.minSlope * (tx1 - b.x1) + b.y1, ty2 = b.minSlope * (tx2 - b.x1) + b.y1;
                    ctx.moveTo(tx1, height - ty1); ctx.lineTo(tx2, height - ty2); ctx.stroke();
                }

                // 赤マーカー: 接線とECGの接触点 (x1, y1)
                ctx.fillStyle = "red"; ctx.beginPath();
                ctx.arc(b.x1, height - b.y1, 5, 0, Math.PI * 2); ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            const calRightX = calX + pxPerSec;

            ctx.strokeStyle = "#ff6600"; ctx.lineWidth = 2.5; ctx.beginPath();
            ctx.moveTo(calX + 0.5, calY - calH / 2); ctx.lineTo(calX + 0.5, calY + calH / 2);
            ctx.moveTo(calX, calY + 0.5); ctx.lineTo(calRightX, calY + 0.5);
            ctx.moveTo(calRightX + 0.5, calY - calH / 2); ctx.lineTo(calRightX + 0.5, calY + calH / 2);
            ctx.stroke();

            ctx.fillStyle = "#ff6600"; ctx.beginPath();
            ctx.arc(calX, calY, 5, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; ctx.beginPath();
            ctx.arc(calX, calY, 5, 0, Math.PI * 2); ctx.stroke();

            ctx.fillStyle = "#ff6600"; ctx.beginPath();
            ctx.arc(calRightX, calY, 5, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; ctx.beginPath();
            ctx.arc(calRightX, calY, 5, 0, Math.PI * 2); ctx.stroke();

            ctx.fillStyle = "#ff6600"; ctx.font = "bold 11px Arial"; ctx.textAlign = "left";
            ctx.fillText(`25mm (1s) = ${pxPerSec}px`, calX, calY + calH / 2 + 14);

            ctx.strokeStyle = "rgba(255,102,0,0.3)"; ctx.lineWidth = 1;
            const mmPx = pxPerSec / 5;
            for (let m = 1; m < 5; m++) {
                const mx = calX + mmPx * m;
                ctx.beginPath();
                ctx.moveTo(mx, calY - calH / 2 + 2);
                ctx.lineTo(mx, calY + calH / 2 - 2);
                ctx.stroke();
            }

            ctx.textAlign = "center";
            ctx.font = "bold 14px Arial";
            const bottomY = height - 5;

            rPeaks.forEach(r => {
                ctx.fillStyle = "blue"; ctx.beginPath(); ctx.arc(r, height - smooth[r], 6, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = "white"; ctx.font = "10px Arial"; ctx.fillText("×", r, height - smooth[r] + 3);
            });

            beats.forEach(b => {
                ctx.font = "bold 14px Arial";
                ctx.fillStyle = "blue"; ctx.fillText(b.rr.toFixed(0), (b.prevR + b.rLoc) / 2, bottomY);
                ctx.fillStyle = "red"; ctx.fillText(b.qt.toFixed(0), (b.qOnset + b.tEnd) / 2, bottomY);
            });
        }

        function updateTable(card, state, index) {
            const { beats } = state;
            const tbody = card.querySelector('tbody');
            tbody.innerHTML = '';

            if (beats.length > 0) {
                const hr = mean(beats.map(b => b.hr)).toFixed(0);
                const qt = mean(beats.map(b => b.qt)).toFixed(0);
                const qtcb = mean(beats.map(b => b.qtcB)).toFixed(0);
                const qtcf = mean(beats.map(b => b.qtcF)).toFixed(0);

                card.querySelector('.val-hr').innerText = hr + " bpm";
                card.querySelector('.val-qt').innerText = qt + " ms";
                card.querySelector('.val-qtcb').innerText = qtcb + " ms";
                card.querySelector('.val-qtcf').innerText = qtcf + " ms";

                finalResults[index] = { hr, qt, qtcb, qtcf, nBeats: beats.length };

                beats.forEach(b => {
                    const tr = document.createElement('tr');
                    const tLabel = b.isNegativeT ? '(-)' : '';
                    const qrsLabel = state.isInvertedQRS ? ' QS' : '';
                    tr.innerHTML = `<td>${b.id}${tLabel}${qrsLabel}</td><td>${b.rr.toFixed(0)}</td><td>${b.hr.toFixed(0)}</td><td>${b.qt.toFixed(0)}</td><td>${b.qtcB.toFixed(0)}</td><td>${b.qtcF.toFixed(0)}</td>`;
                    tbody.appendChild(tr);
                });
            } else {
                card.querySelector('.val-hr').innerText = "-";
                finalResults[index] = null;
            }
        }

        function toggleSignalOverlay(index) {
            const entry = canvasRegistry[index];
            if (!entry) return;
            const appState = entry.canvas.appState;
            if (!appState) return;
            appState.showSignalOverlay = !appState.showSignalOverlay;
            const btn = document.getElementById('btnOverlay' + index);
            if (btn) btn.style.background = appState.showSignalOverlay ? '#228B22' : '#b8860b';
            renderCanvas(entry.canvas, appState);
        }

        function reanalyzeQT(index) {
            const entry = canvasRegistry[index];
            if (!entry) return;
            const appState = entry.canvas.appState;
            if (!appState) return;

            // 手動修正をクリアして全体を再解析
            appState.manualTEnds = {};
            appState.manualQOnsets = {};
            appState.manualBaselines = {};
            if (appState.manualTPeaks) appState.manualTPeaks = {};
            performSignalExtraction(appState);
        }

        // Interaction Event Listeners
        function setupInteraction(canvas, container, index) {
            let dragTarget = null; let isDragging = false; let mouseDownPos = { x: 0, y: 0 };

            // Shift+クリック: R-peak手動追加
            canvas.addEventListener('click', e => {
                if (e.shiftKey) {
                    const appState = canvas.appState;
                    const rect = canvas.getBoundingClientRect();
                    const mx = Math.round(e.clientX - rect.left);
                    // Shift+Click: R-peak追加
                    appState.rPeaks.push(mx);
                    appState.rPeaks.sort((a, b) => a - b);
                    appState.manualTEnds = {};
                    appState.manualQOnsets = {};
                    analyzeBeats(appState);
                    renderCanvas(canvas, appState);
                    updateTable(container, appState, index);
                }
            });

            canvas.addEventListener('mousedown', e => {
                if (e.shiftKey) return; // Shift+クリックはR追加用
                const appState = canvas.appState;
                const rect = canvas.getBoundingClientRect();
                const mx = e.clientX - rect.left;
                const my = e.clientY - rect.top;
                mouseDownPos = { x: mx, y: my }; isDragging = false;
                let found = null;

                const height = appState.height;

                // Calibration Handles
                const calRightX = appState.calX + appState.pxPerSec;
                const calCenterY = appState.calY;
                if (Math.abs(mx - calRightX) < 12 && Math.abs(my - calCenterY) < appState.calH + 5) {
                    found = { type: 'CAL_RIGHT' };
                } else if (Math.abs(mx - appState.calX) < 12 && Math.abs(my - calCenterY) < appState.calH + 5) {
                    found = { type: 'CAL_LEFT' };
                }

                // T-end
                if (!found) {
                    appState.beats.forEach((b, idx) => {
                        if (Math.abs(mx - b.x1) < 12 && Math.abs(my - (height - b.y1)) < 15) found = { type: 'T_END', index: idx };
                    });
                }
                // T-peak
                if (!found) {
                    appState.beats.forEach((b, idx) => {
                        if (b.tPeak >= 0 && Math.abs(mx - b.tPeak) < 12 && Math.abs(my - (height - appState.smooth[Math.floor(b.tPeak)])) < 15) found = { type: 'T_PEAK', index: idx };
                    });
                }
                // R-peaks (青マーカー: 最優先)
                if (!found) {
                    appState.rPeaks.forEach((r, idx) => {
                        const dx = Math.abs(mx - r);
                        const dy = Math.abs(my - (height - appState.smooth[r]));
                        if (dx < 15 && dy < 50) found = { type: 'R', index: idx };
                    });
                }
                // Q-onset (緑マーカー)
                if (!found) {
                    appState.beats.forEach((b, idx) => {
                        if (Math.abs(mx - b.qOnset) < 12 && Math.abs(my - (height - appState.smooth[Math.floor(b.qOnset)])) < 15) found = { type: 'Q', index: idx };
                    });
                }
                // Baseline (青い水平線)
                if (!found) {
                    appState.beats.forEach((b, idx) => {
                        const baseS = Math.max(0, Math.floor(b.rLoc - 0.2 * appState.pxPerSec));
                        const baseE = b.tEnd + 20;
                        const baseY = height - b.baseline;
                        if (mx >= baseS - 5 && mx <= baseE + 5 && Math.abs(my - baseY) < 10) {
                            found = { type: 'BASELINE', index: idx };
                        }
                    });
                }
                if (found) { dragTarget = found; isDragging = true; }
            });

            canvas.addEventListener('mousemove', e => {
                const appState = canvas.appState;
                const rect = canvas.getBoundingClientRect();
                const mx = Math.max(0, Math.min(appState.width - 1, e.clientX - rect.left));
                const my = e.clientY - rect.top;

                if (!isDragging) {
                    const calRightX = appState.calX + appState.pxPerSec;
                    const calCenterY = appState.calY;
                    if ((Math.abs(mx - calRightX) < 12 || Math.abs(mx - appState.calX) < 12) && Math.abs(my - calCenterY) < appState.calH + 5) {
                        canvas.style.cursor = 'ew-resize';
                    } else {
                        // 基線近傍でns-resizeカーソル
                        let onBaseline = false;
                        for (const b of appState.beats) {
                            const baseS = Math.max(0, Math.floor(b.rLoc - 0.2 * appState.pxPerSec));
                            const baseE = b.tEnd + 20;
                            const baseY = appState.height - b.baseline;
                            if (mx >= baseS - 5 && mx <= baseE + 5 && Math.abs(my - baseY) < 10) {
                                onBaseline = true; break;
                            }
                        }
                        canvas.style.cursor = onBaseline ? 'ns-resize' : 'crosshair';
                    }
                }

                if (!isDragging || !dragTarget) return;

                if (dragTarget.type === 'CAL_RIGHT') {
                    const newPxPerSec = Math.max(20, Math.round(mx - appState.calX));
                    appState.pxPerSec = newPxPerSec;
                    appState.calMethod = 'drag';
                    updateCalDisplay(index, newPxPerSec, 'drag');
                    appState.manualTEnds = {};
                    appState.manualQOnsets = {};
                    analyzeBeats(appState);
                    renderCanvas(canvas, appState);
                    updateTable(container, appState, index);
                    syncCalibrationToOther(index, newPxPerSec, 'drag');
                    canvas.style.cursor = 'ew-resize';
                } else if (dragTarget.type === 'CAL_LEFT') {
                    const newCalX = Math.max(0, Math.min(appState.calX + appState.pxPerSec - 30, Math.round(mx)));
                    appState.calX = newCalX;
                    renderCanvas(canvas, appState);
                    canvas.style.cursor = 'ew-resize';
                } else if (dragTarget.type === 'R') {
                    appState.rPeaks[dragTarget.index] = Math.round(mx);
                    analyzeBeats(appState);
                    renderCanvas(canvas, appState);
                    updateTable(container, appState, index);
                } else if (dragTarget.type === 'T_END') {
                    const b = appState.beats[dragTarget.index];
                    if (b) {
                        // 赤マーカー＝接線の接触点をドラッグ → 接線再計算
                        const cx = Math.max(1, Math.min(appState.width - 2, Math.round(mx)));
                        const cSlope = (appState.smooth[cx + 1] - appState.smooth[cx - 1]) / 2;
                        const cy = appState.smooth[cx];
                        b.x1 = cx; b.minSlope = cSlope; b.y1 = cy;
                        b.tEnd = (cSlope !== 0) ? (b.baseline - cy) / cSlope + cx : cx + 20;
                        b.isManual = true;
                        appState.manualTEnds[b.id] = cx;
                        recalcSingleQT(appState, dragTarget.index);
                        renderCanvas(canvas, appState);
                        updateTable(container, appState, index);
                    }
                } else if (dragTarget.type === 'T_PEAK') {
                    const b = appState.beats[dragTarget.index];
                    if (b) {
                        b.tPeak = Math.round(mx);
                        b.isManual = true;
                        const slopeEnd = Math.min(b.tEnd + 30, appState.width - 1);
                        const negT = b.isNegativeT;
                        let bestSl = 0, slIdx = -1;
                        for (let k = b.tPeak; k < slopeEnd - 1; k++) {
                            const s = appState.smooth[k + 1] - appState.smooth[k];
                            if (negT) {
                                if (s > bestSl) { bestSl = s; slIdx = k; }
                            } else {
                                if (s < bestSl) { bestSl = s; slIdx = k; }
                            }
                        }
                        const slopeValid = negT ? (slIdx >= 0 && bestSl > 0) : (slIdx >= 0 && bestSl < 0);
                        if (slopeValid) {
                            b.x1 = slIdx; b.minSlope = bestSl; b.y1 = appState.smooth[slIdx];
                            const newTEnd = (b.baseline - appState.smooth[slIdx]) / bestSl + slIdx;
                            b.tEnd = newTEnd;
                            appState.manualTEnds[b.id] = undefined;
                        }
                        recalcSingleQT(appState, dragTarget.index);
                        renderCanvas(canvas, appState);
                        updateTable(container, appState, index);
                    }
                } else if (dragTarget.type === 'Q') {
                    const b = appState.beats[dragTarget.index];
                    if (b) {
                        appState.manualQOnsets[b.id] = Math.round(mx);
                        analyzeBeats(appState);
                        renderCanvas(canvas, appState);
                        updateTable(container, appState, index);
                    }
                } else if (dragTarget.type === 'BASELINE') {
                    const b = appState.beats[dragTarget.index];
                    if (b) {
                        const newBaseline = appState.height - my;
                        appState.manualBaselines[b.id] = newBaseline;
                        analyzeBeats(appState);
                        renderCanvas(canvas, appState);
                        updateTable(container, appState, index);
                        canvas.style.cursor = 'ns-resize';
                    }
                }
            });

            canvas.addEventListener('mouseup', e => {
                if (!dragTarget) return;
                const appState = canvas.appState;
                const rect = canvas.getBoundingClientRect();
                const moved = Math.abs(e.clientX - rect.left - mouseDownPos.x) > 3 || Math.abs(e.clientY - rect.top - mouseDownPos.y) > 3;

                if (!moved) {
                    if (dragTarget.type === 'R') {
                        appState.rPeaks.splice(dragTarget.index, 1);
                        appState.manualTEnds = {};
                        appState.manualQOnsets = {};
                        analyzeBeats(appState);
                        renderCanvas(canvas, appState);
                        updateTable(container, appState, index);
                    } else if (dragTarget.type === 'T_END') {
                        const b = appState.beats[dragTarget.index];
                        if (b) { delete appState.manualTEnds[b.id]; analyzeBeats(appState); renderCanvas(canvas, appState); updateTable(container, appState, index); }
                    } else if (dragTarget.type === 'Q') {
                        const b = appState.beats[dragTarget.index];
                        if (b) { delete appState.manualQOnsets[b.id]; analyzeBeats(appState); renderCanvas(canvas, appState); updateTable(container, appState, index); }
                    } else if (dragTarget.type === 'BASELINE') {
                        const b = appState.beats[dragTarget.index];
                        if (b) { delete appState.manualBaselines[b.id]; analyzeBeats(appState); renderCanvas(canvas, appState); updateTable(container, appState, index); }
                    }
                }
                isDragging = false; dragTarget = null;
                canvas.style.cursor = 'crosshair';
            });

            // dblclick handler removed (T-peak追加機能を削除)
        }
    </script>
</body>
