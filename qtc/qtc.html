    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
            max-width: 95%;
            margin: 0 auto;
            padding: 20px;
            background: #0f1724;
            color: #e0e6ed;
            user-select: none;
            min-height: 100vh;
        }

        .container {
            background: #151f2e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border: 1px solid #2a3a4e;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #2196F3;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            color: #ffffff;
            font-size: 1.5em;
        }

        .btn-reset {
            background: #e74c3c;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-size: 0.9em;
            transition: background 0.2s;
        }

        .btn-reset:hover {
            background: #c0392b;
        }

        .input-wrapper {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .input-area {
            flex: 1;
            border: 3px dashed #3a4f6e;
            border-radius: 10px;
            padding: 6px 15px;
            text-align: center;
            background: #1a2738;
            transition: all 0.2s;
            cursor: pointer;
            position: relative;
        }

        .input-area:hover {
            background-color: #1f2e42;
        }

        .input-area.dragover {
            background-color: #1a3a3a;
            border-color: #38b2ac;
            transform: scale(1.01);
        }

        .input-area.active {
            border-color: #2196F3;
            background-color: #1a3555;
            box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.2);
        }

        .input-label {
            font-weight: bold;
            font-size: 0.95em;
            color: #8ab4f8;
            margin-bottom: 5px;
            display: block;
        }

        .input-sub {
            font-size: 0.8em;
            color: #a0aec0;
            margin-bottom: 8px;
        }

        .btn-select {
            background: #2196F3;
            color: white;
            padding: 8px 20px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-size: 0.9em;
            transition: background 0.2s;
        }

        .btn-select:hover {
            background: #1976D2;
        }

        input[type="file"] {
            display: none;
        }

        .result-container-wrapper {
            display: flex;
            flex-direction: row;
            gap: 20px;
            align-items: flex-start;
        }

        .result-card {
            flex: 1;
            min-width: 0;
            border: 1px solid #2a3a4e;
            border-radius: 8px;
            padding: 15px;
            background: #1a2738;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            display: none;
        }

        .result-card.visible {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-label {
            background: #2196F3;
            color: #fff;
            display: inline-block;
            padding: 4px 12px;
            font-size: 0.85em;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a3a4e;
            padding-bottom: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 5px;
        }

        .file-name {
            font-weight: bold;
            color: #8ab4f8;
            font-size: 0.9em;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 200px;
        }

        .instructions {
            font-size: 0.75em;
            color: #e0e6ed;
            background: #3a4f6e;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid #4a5f7e;
        }

        .calibration-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            padding: 8px 12px;
            background: #0d1724;
            border-radius: 6px;
            border: 1px solid #2a3a4e;
            flex-wrap: wrap;
        }

        .calibration-bar label {
            font-size: 0.85em;
            color: #8ab4f8;
            font-weight: bold;
        }

        .calibration-bar .cal-value {
            font-size: 0.85em;
            color: #e0e6ed;
            background: #1a2738;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid #3a4f6e;
        }

        .cal-method {
            font-size: 0.75em;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: bold;
        }

        .cal-method.auto-scale {
            background: #00897b;
            color: #fff;
        }

        .cal-method.grid-fallback {
            background: #ff8f00;
            color: #fff;
        }

        .cal-method.manual {
            background: #1565c0;
            color: #fff;
        }

        .cal-method.drag {
            background: #6a1b9a;
            color: #fff;
        }

        .calibration-bar input[type="number"] {
            width: 80px;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #3a4f6e;
            background: #1a2738;
            color: #e0e6ed;
            font-size: 0.85em;
            text-align: center;
        }

        .btn-reanalyze {
            background: #7c4dff;
            color: white;
            padding: 6px 16px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: bold;
            transition: background 0.2s;
            margin-left: 8px;
        }

        .btn-reanalyze:hover {
            background: #651fff;
        }

        .channel-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 10px;
            padding: 6px 12px;
            background: #0d1724;
            border-radius: 6px;
            border: 1px solid #2a3a4e;
        }

        .channel-bar.hidden {
            display: none;
        }

        .channel-bar .ch-label {
            font-size: 0.8em;
            color: #8ab4f8;
            font-weight: bold;
            margin-right: 4px;
        }

        .ch-btn {
            padding: 4px 14px;
            border-radius: 4px;
            border: 2px solid #3a4f6e;
            cursor: pointer;
            font-size: 0.8em;
            font-weight: bold;
            transition: all 0.15s;
            background: #1a2738;
            color: #e0e6ed;
        }

        .ch-btn:hover {
            border-color: #5a7f9e;
        }

        .ch-btn.ch-active {
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.2);
        }

        .ch-btn.ch-black {
            color: #aaa;
        }

        .ch-btn.ch-black.ch-active {
            border-color: #fff;
            background: #444;
            color: #fff;
        }

        .ch-btn.ch-green {
            color: #4caf50;
        }

        .ch-btn.ch-green.ch-active {
            border-color: #4caf50;
            background: #1b3a1b;
            color: #66ff66;
        }

        .ch-btn.ch-red {
            color: #e91e3a;
        }

        .ch-btn.ch-red.ch-active {
            border-color: #e91e3a;
            background: #3a1a1a;
            color: #ff6666;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }

        .metric-box {
            background: #0d1724;
            padding: 8px 4px;
            border-radius: 6px;
            text-align: center;
            border: 1px solid #2a3a4e;
        }

        .metric-box h3 {
            margin: 0 0 3px 0;
            font-size: 0.7em;
            color: #8ab4f8;
        }

        .metric-box p {
            margin: 0;
            font-size: 1.0em;
            font-weight: bold;
            color: #e0e6ed;
        }

        .canvas-wrapper {
            overflow: auto;
            border: 1px solid #2a3a4e;
            background: #fff;
            margin-bottom: 10px;
            position: relative;
            max-height: 600px;
        }

        canvas {
            display: block;
            cursor: crosshair;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 0.75em;
            padding: 8px;
            background: #0d1724;
            border-radius: 5px;
            margin-top: 5px;
            border: 1px solid #2a3a4e;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            opacity: 0.8;
        }

        .line-legend {
            font-weight: bold;
            opacity: 0.8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 0.8em;
        }

        th,
        td {
            border: 1px solid #2a3a4e;
            padding: 4px;
            text-align: center;
        }

        th {
            background-color: #2196F3;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #0d1724;
        }

        tr:nth-child(odd) {
            background-color: #1a2738;
        }

        .btn-copy {
            background: #27ae60;
            color: white;
            padding: 7px 18px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: bold;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-copy:hover {
            background: #219150;
        }

        .cal-preset-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .cal-preset-left {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: #0d1724;
            border-radius: 8px;
            border: 1px solid #2a3a4e;
            flex-wrap: wrap;
        }

        .cal-preset-right {
            display: flex;
            align-items: center;
            margin-left: auto;
        }

        .cal-preset-bar .preset-label {
            font-size: 0.85em;
            color: #8ab4f8;
            font-weight: bold;
            margin-right: 4px;
        }

        .cal-preset-btn {
            padding: 7px 18px;
            border-radius: 6px;
            border: 2px solid #3a4f6e;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: bold;
            transition: all 0.2s;
            background: #1a2738;
            color: #e0e6ed;
            min-width: 80px;
            text-align: center;
        }

        .cal-preset-btn:hover {
            border-color: #2196F3;
            background: #1a3555;
        }

        .cal-preset-btn.active {
            border-color: #2196F3;
            background: #1a3555;
            box-shadow: 0 0 0 2px rgba(33, 150, 243, 0.3);
            color: #fff;
        }

        .btn-cal-settings {
            padding: 4px 8px;
            border-radius: 4px;

    <script>
        let activeZone = 1;
        const finalResults = { 1: null, 2: null };
        const canvasRegistry = { 1: null, 2: null };

        // 紙送り速度は25mm/sec固定
        const paperSpeed = 25;
        const MAX_PROCESS_WIDTH = 2000;

        // --- Calibration Preset System ---
        const STORAGE_KEY = 'qtc_cal_presets';
        // 'holter' はフクダ製（灰色格子・カラー波形）。
        // 'nihonkohden' は日本光電製（赤の5mm実線＋1mm点・黒波形）で、抽出は standard を使う。
        const DEFAULT_PRESETS = { '100': 94, '200': 190, 'holter': 125, 'nihonkohden': 106 };
        const PRESET_KEYS = ['100', '200', 'holter', 'nihonkohden'];
        const PRESET_NAMES = { '100': '100%', '200': '200%', 'holter': 'ホルター(フクダ)', 'nihonkohden': 'ホルター(日本光電)' };
        let calPresets = { ...DEFAULT_PRESETS };

        function loadPresets() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    calPresets['100'] = parsed['100'] || DEFAULT_PRESETS['100'];
                    calPresets['200'] = parsed['200'] || DEFAULT_PRESETS['200'];
                    calPresets['holter'] = parsed['holter'] || DEFAULT_PRESETS['holter'];
                    calPresets['nihonkohden'] = parsed['nihonkohden'] || DEFAULT_PRESETS['nihonkohden'];
                }
            } catch (e) { }
        }

        function savePresetsToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(calPresets));
            } catch (e) { }
        }

        function highlightPresetButton(presetKey) {
            document.querySelectorAll('.cal-preset-btn').forEach(b => b.classList.remove('active'));
            if (presetKey === '100') document.getElementById('presetBtn100').classList.add('active');
            else if (presetKey === '200') document.getElementById('presetBtn200').classList.add('active');
            else if (presetKey === 'holter') document.getElementById('presetBtn_holter').classList.add('active');
            else if (presetKey === 'nihonkohden') document.getElementById('presetBtn_nihonkohden').classList.add('active');
        }

        // プリセット選択時に、モード(standard vs holter)も切り替える
        function selectPreset(mode) {
            const pxPerSec = calPresets[mode];
            highlightPresetButton(mode);

            // 抽出モード: ホルター(フクダ)は色付き波形なので 'holter'、それ以外（日本光電を含む）は黒波形で 'standard'
            const extractionMode = (mode === 'holter') ? 'holter' : 'standard';

            for (let idx of [1, 2]) {
                const entry = canvasRegistry[idx];
                if (!entry) continue;
                const state = entry.canvas.appState;
                if (!state) continue;

                state.pxPerSec = pxPerSec;
                state.calMethod = 'preset-' + mode;
                state.extractionMode = extractionMode;

                updateCalDisplay(idx, pxPerSec, state.calMethod);

                // モードが変わったので波形抽出(Extraction)からやり直す
                performSignalExtraction(state);
            }
        }

        // プリセットボタンのラベルにpx値を表示
        function updatePresetLabels() {
            const el100 = document.getElementById('presetVal100');
            const el200 = document.getElementById('presetVal200');
            const elH = document.getElementById('presetValHolter');
            const elNK = document.getElementById('presetValNihonkohden');
            if (el100) el100.textContent = `(${calPresets['100']}px)`;
            if (el200) el200.textContent = `(${calPresets['200']}px)`;
            if (elH) elH.textContent = `(${calPresets['holter']}px)`;
            if (elNK) elNK.textContent = `(${calPresets['nihonkohden']}px)`;
        }

        // 現在のpx値をプリセットとして保存
        function saveCurrentAsPreset(mode) {
            // 現在表示されている画像のpxPerSecを取得
            let currentPx = 0;
            for (let idx of [1, 2]) {
                const entry = canvasRegistry[idx];
                if (entry && entry.canvas.appState) {
                    currentPx = entry.canvas.appState.pxPerSec;
                    break;
                }
            }
            if (currentPx <= 0) {
                alert('画像を読み込んでからプリセットを設定してください');
                return;
            }
            calPresets[mode] = currentPx;
            savePresetsToStorage();
            updatePresetLabels();
            const label = document.getElementById('detectedCalValue');
            if (label) label.textContent = `${PRESET_NAMES[mode]}に ${currentPx} px/s を保存しました`;
            setTimeout(() => { if (label) label.textContent = ''; }, 3000);
        }
        loadPresets();
        updatePresetLabels();

        const mean = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0;
        const median = arr => {
            if (!arr.length) return 0;
            const sorted = [...arr].sort((a, b) => a - b);
            const mid = Math.floor(sorted.length / 2);
            return sorted.length % 2 !== 0 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
        };

        function initDropZone(id, index) {
            const zone = document.getElementById(id);
            const input = document.getElementById(`fileInput${index}`);
            zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('dragover'); });
            zone.addEventListener('dragleave', (e) => { e.preventDefault(); zone.classList.remove('dragover'); });
            zone.addEventListener('drop', (e) => {
                e.preventDefault(); zone.classList.remove('dragover');
                activateZone(index);
                if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0], index);
            });
            input.addEventListener('change', (e) => {
                if (e.target.files.length > 0) handleFile(e.target.files[0], index);
            });
        }
        initDropZone('dropZone1', 1);
        initDropZone('dropZone2', 2);

        function activateZone(index) {
            activeZone = index;
            document.querySelectorAll('.input-area').forEach(el => el.classList.remove('active'));
            document.getElementById(`dropZone${index}`).classList.add('active');
        }

        window.addEventListener('paste', (e) => {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            let file = null;
            for (let item of items) {
                if (item.kind === 'file' && item.type.startsWith('image/')) {
                    file = item.getAsFile();
                    break;
                }
            }
            if (file) handleFile(file, activeZone);
        });

        function handleFile(file, index) {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const tempImg = new Image();
                tempImg.onload = () => {
                    let w = tempImg.width;
                    let h = tempImg.height;
                    let needsResize = false;

                    if (w > MAX_PROCESS_WIDTH) {
                        const scale = MAX_PROCESS_WIDTH / w;
                        w = MAX_PROCESS_WIDTH;
                        h = h * scale;
                        needsResize = true;
                    }

                    if (needsResize) {
                        const cvs = document.createElement('canvas');
                        cvs.width = w;
                        cvs.height = h;
                        const cx = cvs.getContext('2d');
                        cx.drawImage(tempImg, 0, 0, w, h);
                        const resizedImg = new Image();
                        resizedImg.onload = () => runAnalysis(resizedImg, file.name, index);
                        // JPEG再圧縮は細い格子線（1〜2px）を壊し自動計測を失敗させるため PNG を使う
                        resizedImg.src = cvs.toDataURL('image/png');
                    } else {
                        runAnalysis(tempImg, file.name, index);
                    }
                };
                tempImg.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        }

        function resetApp() {
            // クリア前に結果があれば履歴に保存
            if (finalResults[1] || finalResults[2]) {
                saveToHistory();
            }

            document.getElementById('fileInput1').value = '';
            document.getElementById('fileInput2').value = '';
            document.getElementById('resultCard1').innerHTML = '';
            document.getElementById('resultCard1').classList.remove('visible');
            document.getElementById('resultCard2').innerHTML = '';
            document.getElementById('resultCard2').classList.remove('visible');
            finalResults[1] = null;
            finalResults[2] = null;
            canvasRegistry[1] = null;
            canvasRegistry[2] = null;
            activateZone(1);
            document.querySelectorAll('.cal-preset-btn').forEach(b => b.classList.remove('active'));
        }

        function copyResults() {
            let text;
            if (finalResults[1] && finalResults[2]) {
                // 画像が2つある場合: 両方の誘導を表示
                const r1 = finalResults[1];
                const r2 = finalResults[2];
                text = `2誘導 : HR ${r1.hr}, QT ${r1.qt}, QTcB ${r1.qtcb}, QTcF ${r1.qtcf} (${r1.nBeats}beats)\nV5誘導 : HR ${r2.hr}, QT ${r2.qt}, QTcB ${r2.qtcb}, QTcF ${r2.qtcf} (${r2.nBeats}beats)`;
            } else if (finalResults[1]) {
                // 画像が1つだけの場合: 2誘導のデータのみ
                const r1 = finalResults[1];
                text = `2誘導 : HR ${r1.hr}, QT ${r1.qt}, QTcB ${r1.qtcb}, QTcF ${r1.qtcf} (${r1.nBeats}beats)`;
            } else if (finalResults[2]) {
                // 画像2のみの場合: V5誘導のデータのみ
                const r2 = finalResults[2];
                text = `V5誘導 : HR ${r2.hr}, QT ${r2.qt}, QTcB ${r2.qtcb}, QTcF ${r2.qtcf} (${r2.nBeats}beats)`;
            } else {
                alert('解析結果がありません');
                return;
            }
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector('.btn-copy');
                const originalText = btn.innerText;
                btn.innerText = "✅ コピーしました!";
                setTimeout(() => { btn.innerText = originalText; }, 2000);
            }).catch(err => alert("コピー失敗: " + err));

            // 履歴に自動保存
            saveToHistory();
        }

        // ========== 履歴管理 ==========
        const HISTORY_STORAGE_KEY = 'qtc_analysis_history';
        const HISTORY_MAX = 20;

        function saveToHistory() {
            try {
                const history = getQtcHistory();
                const r1 = finalResults[1];
                const r2 = finalResults[2];
                const item = {
                    id: Date.now(),
                    date: new Date().toISOString(),
                    result1: r1 ? { hr: r1.hr, qt: r1.qt, qtcb: r1.qtcb, qtcf: r1.qtcf, nBeats: r1.nBeats } : null,
                    result2: r2 ? { hr: r2.hr, qt: r2.qt, qtcb: r2.qtcb, qtcf: r2.qtcf, nBeats: r2.nBeats } : null
                };
                history.unshift(item);

                // ピン留め以外を20件に制限
                const pinned = history.filter(h => h.pinned);
                const unpinned = history.filter(h => !h.pinned);
                while (unpinned.length > HISTORY_MAX - pinned.length && unpinned.length > 0) {
                    unpinned.pop();
                }
                const merged = [...pinned, ...unpinned].sort((a, b) => b.id - a.id);
                localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(merged));
            } catch (e) {
                console.error('Failed to save history:', e);
            }
        }

        function getQtcHistory() {
            try {
                const data = localStorage.getItem(HISTORY_STORAGE_KEY);
                return data ? JSON.parse(data) : [];
            } catch (e) {
                return [];
            }
        }

        function openHistory() {
            displayHistory();
            document.getElementById('historyModal').classList.add('visible');
        }

        function closeHistory() {
            document.getElementById('historyModal').classList.remove('visible');
        }

        function formatHistoryItemText(item) {
            const r1 = item.result1;
            const r2 = item.result2;
            const beatsStr = (r) => r.nBeats != null ? ` (${r.nBeats}beats)` : '';
            let text = '';
            if (r1 && r2) {
                text = `2誘導 : HR ${r1.hr}, QT ${r1.qt}, QTcB ${r1.qtcb}, QTcF ${r1.qtcf}${beatsStr(r1)}\nV5誘導 : HR ${r2.hr}, QT ${r2.qt}, QTcB ${r2.qtcb}, QTcF ${r2.qtcf}${beatsStr(r2)}`;

            }
            return text;
        }

        function displayHistory() {
            const history = getQtcHistory();

            if (history.length === 0) {

            }

            const sorted = [...history].sort((a, b) => b.id - a.id);

            historyList.innerHTML = sorted.map(item => {
                const date = new Date(item.date);
                const dateStr = date.toLocaleString('ja-JP', {
                    year: 'numeric', month: '2-digit', day: '2-digit',
                    hour: '2-digit', minute: '2-digit'
                });
                const isPinned = item.pinned || false;
                const comment = item.comment || '';
                const r1 = item.result1;
                const r2 = item.result2;

                let resultsHtml = '';
                if (r1) resultsHtml += `<div><span class="lead-label">II</span>HR ${r1.hr} | QT ${r1.qt} | QTcB ${r1.qtcb} | QTcF ${r1.qtcf}</div>`;
                if (r2) resultsHtml += `<div><span class="lead-label">V5</span>HR ${r2.hr} | QT ${r2.qt} | QTcB ${r2.qtcb} | QTcF ${r2.qtcf}</div>`;

                return `

            }).join('');

        function toggleHistoryPin(id) {
            let history = getQtcHistory();
            const item = history.find(h => h.id === id);
            if (item) {
                item.pinned = !item.pinned;
                localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(history));
                displayHistory();
            }
        }

        function deleteHistoryItem(id) {
            let history = getQtcHistory();
            const item = history.find(h => h.id === id);
            if (item && item.pinned) {
                alert('ピン留めされた履歴は削除できません。\n先にピン留めを解除してください。');
                return;
            }
            if (!confirm('この履歴を削除してもよろしいですか？')) return;
            history = history.filter(h => h.id !== id);
            localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(history));
            displayHistory();
        }

        function updateHistoryComment(id, comment) {
            let history = getQtcHistory();
            const item = history.find(h => h.id === id);
            if (item) {
                item.comment = comment.substring(0, 30);
                localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(history));
            }

        function copyHistoryItem(id) {
            const history = getQtcHistory();
            const item = history.find(h => h.id === id);
            if (!item) return;
            const text = formatHistoryItemText(item);
            navigator.clipboard.writeText(text).then(() => {

                btns.forEach(b => { if (b.textContent.includes('コピー')) return; });
            });

            const history = getQtcHistory();
            if (history.length === 0) { alert('履歴がありません'); return; }
            const sorted = [...history].sort((a, b) => b.id - a.id);
            const lines = sorted.map(item => {
                const date = new Date(item.date);
                const dateStr = date.toLocaleString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
                const pin = item.pinned ? '📌 ' : '';
                const commentPart = item.comment ? ` (${item.comment})` : '';
                return `${pin}[${dateStr}]${commentPart} ${formatHistoryItemText(item)}`;
            });
            navigator.clipboard.writeText(lines.join('\n')).then(() => {
                const btn = document.querySelector('.btn-history-copy-all');

                btn.innerText = '✅ コピー完了';

        function runAnalysis(img, filename, index) {

            const canvas = document.createElement('canvas');

            // 1. Calibration
            let pxPerSec, calMethod, extractionMode;

            // 2枚目の画像は1枚目と同じキャリブレーションを使用
            if (index === 2 && canvasRegistry[1] && canvasRegistry[1].canvas.appState) {

        // 波形抽出 → 平滑化 → R波検出 → 拍の解析 → 描画 までを一括で行う
        function performSignalExtraction(state) {
            const { imgData, width, height, extractionMode } = state;
            const card = canvasRegistry[state.index].container;
            const chBar = card.querySelector(`#chBar${state.index}`);

            let signal;

            if (extractionMode === 'holter') {
                // --- Holter: 色付き波形 ---
                if (chBar) chBar.classList.remove('hidden'); // Show channel bar

                // Auto-detect best channel if not manually set or fresh run
                if (!state.manualChannelSelected) {
                    state.channel = detectBestChannel(imgData, width, height);
                }

                // UI update for active channel
                ['black', 'green', 'red'].forEach(c => {
                    const btn = document.getElementById(`ch${c.charAt(0).toUpperCase() + c.slice(1)}${state.index}`);
                    if (btn) {
                        if (c === state.channel) btn.classList.add('ch-active');
                        else btn.classList.remove('ch-active');
                    }
                });

                signal = extractSignalHolter(imgData, width, height, state.channel);

            } else {
                // --- Standard: 赤方眼紙上の黒波形 ---
                if (chBar) chBar.classList.add('hidden'); // Hide channel bar

                signal = extractSignalStandard(imgData, width, height);
            }

            // Common Processing (Smoothing -> Peak) — 3点平滑化でR波の振幅を保持
            const smooth = new Float32Array(width);
            smooth[0] = signal[0]; smooth[width - 1] = signal[width - 1];
            for (let i = 1; i < width - 1; i++) smooth[i] = (signal[i - 1] + signal[i] + signal[i + 1]) / 3;
            state.smooth = smooth;

            detectRPeaks(state); // Update rPeaks in state

            analyzeBeats(state);
            renderCanvas(canvasRegistry[state.index].canvas, state);
            updateTable(card, state, state.index);
        }

        // ---------------------------------------------------------
        // 標準モードの波形抽出（赤方眼紙上の黒トレース）
        // ---------------------------------------------------------
        // 各列で「その列の最暗画素＋30 以内」の暗画素の上端・下端を取り、
        //   ・平坦部（暗画素の縦幅≒線の太さ）では線の中心
        //   ・QRS のように縦に長い列では、近傍レベルから遠い側の先端（線の半分だけ内側）
        // を信号とする。先端を取るのは R 波の振幅を保つため。
        //
        // 「遠い側」の基準は画像の縦中央ではなく、前後 40 列の中央値（＝その付近の基線）。
        // 画像中央を基準にすると、波形が中央をまたぐ所で線の上端と下端を行き来して
        // 段差ができ、同じ心電図でも切り抜きの上下位置で QT が変わってしまう。
        function extractSignalStandard(imgData, width, height) {
            const signal = new Float32Array(width).fill(NaN);
            const top = new Int32Array(width).fill(-1), bot = new Int32Array(width).fill(-1);
            const isGridRed = (r, g, b) => r > 100 && r > g + 30 && r > b + 30;

            // 暗画素が横一列に並ぶ行（スクリーンショットの枠線・罫線）は波形ではないので除く。
            // 波形が同じ行に留まるのは平坦な基線でも全列の4割程度まで。
            const ruleRow = new Uint8Array(height);
            for (let y = 0; y < height; y++) {
                let c = 0;
                for (let x = 0; x < width; x++) {
                    const i = (y * width + x) * 4;
                    const r = imgData[i], g = imgData[i + 1], b = imgData[i + 2];
                    if (!isGridRed(r, g, b) && 0.299 * r + 0.587 * g + 0.114 * b < 128) c++;
                }
                if (c > 0.7 * width) ruleRow[y] = 1;
            }

            for (let x = 0; x < width; x++) {
                let darkestLum = 255;
                for (let y = 1; y < height - 1; y++) {
                    if (ruleRow[y]) continue;
                    const i = (y * width + x) * 4;
                    const r = imgData[i], g = imgData[i + 1], b = imgData[i + 2];
                    if (isGridRed(r, g, b)) continue;
                    const lum = 0.299 * r + 0.587 * g + 0.114 * b;
                    if (lum < darkestLum) darkestLum = lum;
                }
                if (darkestLum >= 250) continue;               // この列にトレースなし
                const lumThresh = darkestLum + 30;
                for (let y = 1; y < height - 1; y++) {
                    if (ruleRow[y]) continue;
                    const i = (y * width + x) * 4;
                    const r = imgData[i], g = imgData[i + 1], b = imgData[i + 2];
                    if (isGridRed(r, g, b)) continue;
                    if (0.299 * r + 0.587 * g + 0.114 * b <= lumThresh) {
                        if (top[x] < 0) top[x] = y;
                        bot[x] = y;
                    }
                }
            }

            // 線の太さ = 縦幅の中央値（大半の列は平坦部なので）
            const spans = [];
            for (let x = 0; x < width; x++) if (top[x] >= 0) spans.push(bot[x] - top[x] + 1);
            if (spans.length) {
                spans.sort((a, b) => a - b);
                const thick = spans[Math.floor(spans.length / 2)];
                const REF_HALF = 40;                           // 近傍レベルを取る窓（片側の列数）
                const win = [];
                for (let x = 0; x < width; x++) {
                    if (top[x] < 0) continue;
                    win.length = 0;
                    for (let k = Math.max(0, x - REF_HALF); k <= Math.min(width - 1, x + REF_HALF); k++) {
                        if (top[k] >= 0) win.push((top[k] + bot[k]) / 2);
                    }
                    win.sort((a, b) => a - b);
                    const ref = win[Math.floor(win.length / 2)];
                    const half = (Math.min(bot[x] - top[x] + 1, thick) - 1) / 2;
                    const y = (Math.abs(top[x] - ref) >= Math.abs(bot[x] - ref)) ? top[x] + half : bot[x] - half;
                    signal[x] = height - y;
                }
            }

            // Interpolation
            for (let i = 0; i < width; i++) { if (isNaN(signal[i])) { let l = i - 1, r = i + 1; while (l >= 0 && isNaN(signal[l])) l--; while (r < width && isNaN(signal[r])) r++; if (l >= 0 && r < width) signal[i] = signal[l] + (signal[r] - signal[l]) * (i - l) / (r - l); else if (l >= 0) signal[i] = signal[l]; else if (r < width) signal[i] = signal[r]; else signal[i] = height / 2; } }

            return signal;
        }

        // ホルターモードの波形抽出: 指定チャンネル（黒/緑/赤）の画素の重み付き重心
        function extractSignalHolter(imgData, width, height, channel) {
            const signal = new Float32Array(width).fill(NaN);
            // 画像端のアーティファクト除外
            const yMargin = Math.max(2, Math.floor(height * 0.02));
            const yStart = yMargin;
            const yEnd = height - yMargin;

            for (let x = 0; x < width; x++) {
                let sumY = 0, count = 0;

                if (channel === 'black') {
                    let minLum = 255;
                    for (let y = yStart; y < yEnd; y++) {
                        const i = (y * width + x) * 4;
                        const lum = 0.299 * imgData[i] + 0.587 * imgData[i + 1] + 0.114 * imgData[i + 2];
                        if (lum < minLum) minLum = lum;
                    }
                    const threshold = Math.min(minLum + 50, 200);
                    for (let y = yStart; y < yEnd; y++) {
                        const i = (y * width + x) * 4;
                        const r = imgData[i], g = imgData[i + 1], b = imgData[i + 2];
                        const lum = 0.299 * r + 0.587 * g + 0.114 * b;
                        const sat = Math.max(r, g, b) - Math.min(r, g, b);
                        if (lum <= threshold && sat < 40) {
                            const w = (threshold - lum + 1);
                            sumY += y * w; count += w;
                        }
                    }
                } else if (channel === 'green') {
                    for (let y = yStart; y < yEnd; y++) {
                        const i = (y * width + x) * 4;
                        const r = imgData[i], g = imgData[i + 1], b = imgData[i + 2];
                        if (g > 40 && g > r + 15 && g > b + 15) {
                            const greenness = g - Math.max(r, b);
                            const w = Math.max(1, greenness);
                            sumY += y * w; count += w;
                        }
                    }
                } else if (channel === 'red') {
                    for (let y = yStart; y < yEnd; y++) {
                        const i = (y * width + x) * 4;
                        const r = imgData[i], g = imgData[i + 1], b = imgData[i + 2];
                        if (r > 40 && r > g + 15) {
                            const redness = r - g;
                            const w = Math.max(1, redness);
                            sumY += y * w; count += w;
                        }
                    }
                }

                if (count > 0) signal[x] = height - (sumY / count);
            }

            // Interpolation
            for (let i = 0; i < width; i++) {
                if (isNaN(signal[i])) {
                    let l = i - 1, r = i + 1;
                    while (l >= 0 && isNaN(signal[l])) l--;
                    while (r < width && isNaN(signal[r])) r++;
                    if (l >= 0 && r < width) signal[i] = signal[l] + (signal[r] - signal[l]) * (i - l) / (r - l);
                    else if (l >= 0) signal[i] = signal[l];
                    else if (r < width) signal[i] = signal[r];
                    else signal[i] = height / 2;
                }
            }
            return signal;
        }

        function detectRPeaks(state) {
            const { smooth, pxPerSec, width } = state;
            const edgeMargin = 15;
            const slope = new Float32Array(width).fill(0);
            for (let i = 2; i < width - 2; i++) { slope[i] = Math.abs(smooth[i + 1] - smooth[i - 1]); }

            // 信号の中央値を算出（エッジ除外、上向き・下向き両方のQRSに対応）
            const interiorSmooth = [];
            for (let i = edgeMargin; i < width - edgeMargin; i++) interiorSmooth.push(smooth[i]);
            interiorSmooth.sort((a, b) => a - b);
            const signalMedian = interiorSmooth[Math.floor(interiorSmooth.length / 2)];

            // 振幅スコア: 中央値からの絶対偏差（エッジ除外で最大偏差を算出）
            const scoreSignal = new Float32Array(width);
            let maxAbsDev = 0;
            for (let i = edgeMargin; i < width - edgeMargin; i++) {
                const dev = Math.abs(smooth[i] - signalMedian);
                if (dev > maxAbsDev) maxAbsDev = dev;
            }
            let slopeMax = 0;
            for (let i = edgeMargin; i < width - edgeMargin; i++) {
                if (slope[i] > slopeMax) slopeMax = slope[i];
            }

            for (let i = 0; i < width; i++) {
                const normDev = maxAbsDev > 0 ? Math.abs(smooth[i] - signalMedian) / maxAbsDev : 0;
                const normSlope = slope[i] / (slopeMax || 1);
                scoreSignal[i] = normDev + (normSlope * 3.0);
            }

            // 閾値はエッジ除外した内部領域のスコアのみで算出
            let interiorMaxScore = 0;
            for (let i = edgeMargin; i < width - edgeMargin; i++) {
                if (scoreSignal[i] > interiorMaxScore) interiorMaxScore = scoreSignal[i];
            }
            // === 閾値設定 ===
            const globalThreshold = interiorMaxScore * 0.40;
            const minRDist = pxPerSec * 0.45;

            let rPeaks = [];

            // Pass 1: グローバル閾値でR波候補を検出
            for (let i = edgeMargin; i < width - edgeMargin; i++) {
                if (scoreSignal[i] > scoreSignal[i - 1] && scoreSignal[i] > scoreSignal[i + 1] && scoreSignal[i] > globalThreshold) {
                    if (rPeaks.length === 0 || i - rPeaks[rPeaks.length - 1] > minRDist) {
                        rPeaks.push(i);
                    } else {
                        const lastIdx = rPeaks.length - 1;
                        if (scoreSignal[i] > scoreSignal[rPeaks[lastIdx]]) {
                            rPeaks[lastIdx] = i;
                        }
                    }
                }
            }

            // Pass 2: テンプレートマッチングによるギャップ補填
            // 検出済みR-peakからQRS波形テンプレートを生成し、正規化相互相関（NCC）で未検出ビートを探索
            if (rPeaks.length >= 2) {
                const rrIntervals = [];
                for (let i = 1; i < rPeaks.length; i++) rrIntervals.push(rPeaks[i] - rPeaks[i - 1]);
                rrIntervals.sort((a, b) => a - b);
                const medianRR = rrIntervals[Math.floor(rrIntervals.length / 2)];
                const gapThresholdRR = medianRR * 1.5;

                // テンプレート生成: 検出済みR-peak周辺 ±halfW の平均波形
                const halfW = Math.max(5, Math.floor(pxPerSec * 0.04)); // ±40ms
                const templateLen = halfW * 2 + 1;
                const template = new Float32Array(templateLen).fill(0);
                let validCount = 0;
                for (const rp of rPeaks) {
                    if (rp - halfW >= 0 && rp + halfW < width) {
                        for (let j = 0; j < templateLen; j++) {
                            template[j] += smooth[rp - halfW + j];
                        }
                        validCount++;
                    }
                }
                if (validCount > 0) {
                    for (let j = 0; j < templateLen; j++) template[j] /= validCount;
                }

                // テンプレートの平均・分散を事前算出
                let tMean = 0;
                for (let j = 0; j < templateLen; j++) tMean += template[j];
                tMean /= templateLen;
                let tVar = 0;
                for (let j = 0; j < templateLen; j++) tVar += (template[j] - tMean) * (template[j] - tMean);
                const tStd = Math.sqrt(tVar);

                if (validCount > 0 && tStd > 0.01) {
                    let insertions = [];
                    for (let i = 1; i < rPeaks.length; i++) {
                        const gap = rPeaks[i] - rPeaks[i - 1];
                        if (gap > gapThresholdRR) {
                            // ギャップ内でNCCを算出し、最高相関のピークをR候補とする
                            const gapStart = rPeaks[i - 1] + Math.floor(minRDist);
                            const gapEnd = rPeaks[i] - Math.floor(minRDist);
                            let bestNCC = 0.4; // 相関閾値 0.4
                            let bestPos = -1;

                            for (let pos = Math.max(halfW, gapStart); pos < Math.min(width - halfW, gapEnd); pos++) {
                                // 局所区間の平均・分散
                                let sMean = 0;
                                for (let j = 0; j < templateLen; j++) sMean += smooth[pos - halfW + j];
                                sMean /= templateLen;
                                let sVar = 0, crossCorr = 0;
                                for (let j = 0; j < templateLen; j++) {
                                    const sd = smooth[pos - halfW + j] - sMean;
                                    const td = template[j] - tMean;
                                    sVar += sd * sd;
                                    crossCorr += sd * td;
                                }
                                const sStd = Math.sqrt(sVar);
                                if (sStd > 0.01) {
                                    const ncc = crossCorr / (sStd * tStd);
                                    if (ncc > bestNCC) {
                                        bestNCC = ncc;
                                        bestPos = pos;
                                    }
                                }
                            }
                            if (bestPos > 0) {
                                insertions.push(bestPos);
                            }
                        }
                    }
                    // 挿入してソート
                    if (insertions.length > 0) {
                        rPeaks = rPeaks.concat(insertions);
                        rPeaks.sort((a, b) => a - b);
                    }
                }
            }

            // QRS極性の判定: 検出されたピーク位置での信号が中央値より上か下かで判定
            let aboveCount = 0, belowCount = 0;
            rPeaks.forEach(r => {
                if (smooth[r] >= signalMedian) aboveCount++;
                else belowCount++;
            });
            const isInvertedQRS = belowCount > aboveCount;
            state.isInvertedQRS = isInvertedQRS;

            // Snap to local extremum (陽性QRS: 最大値, 陰性QRS: 最小値)
            rPeaks = rPeaks.map(r => {
                let localBest = r;
                const range = isInvertedQRS ? 20 : 10;
                for (let k = r - range; k <= r + range; k++) {
                    if (k >= 0 && k < width) {
                        if (isInvertedQRS) {
                            if (smooth[k] < smooth[localBest]) localBest = k;
                        } else {
                            if (smooth[k] > smooth[localBest]) localBest = k;
                        }
                    }
                }
                return localBest;
            });

            // RR間隔整合性フィルタ: メディアンRRの50%未満の間隔を作るピークを除去
            if (rPeaks.length >= 3) {
                let filtered = true;
                while (filtered) {
                    filtered = false;
                    if (rPeaks.length < 3) break;
                    const intervals = [];
                    for (let i = 1; i < rPeaks.length; i++) intervals.push(rPeaks[i] - rPeaks[i - 1]);
                    const sortedInt = [...intervals].sort((a, b) => a - b);
                    const medRR = sortedInt[Math.floor(sortedInt.length / 2)];
                    const minRR = medRR * 0.65;
                    for (let i = 0; i < intervals.length; i++) {
                        if (intervals[i] < minRR) {
                            // 短すぎる間隔: スコアが低い方のピークを除去
                            const idx1 = i, idx2 = i + 1;
                            if (scoreSignal[rPeaks[idx1]] <= scoreSignal[rPeaks[idx2]]) {
                                rPeaks.splice(idx1, 1);
                            } else {
                                rPeaks.splice(idx2, 1);
                            }
                            filtered = true;
                            break;
                        }
                    }
                }
            }

            state.rPeaks = rPeaks;
        }

        // Manually switching channel (only in Holter mode)
        function switchChannel(index, channel) {
            const entry = canvasRegistry[index];
            if (!entry) return;
            const state = entry.canvas.appState;
            if (!state) return;

            // Manual switch implies user wants this channel
            state.manualChannelSelected = true;
            state.channel = channel;
            performSignalExtraction(state);
        }

        function detectBestChannel(imgData, width, height) {
            let blackScore = 0, greenScore = 0, redScore = 0;
            const step = Math.max(1, Math.floor(width / 200));

            for (let x = 0; x < width; x += step) {
                for (let y = 0; y < height; y++) {
                    const i = (y * width + x) * 4;
                    const r = imgData[i], g = imgData[i + 1], b = imgData[i + 2];
                    const lum = 0.299 * r + 0.587 * g + 0.114 * b;
                    const sat = Math.max(r, g, b) - Math.min(r, g, b);

                    if (lum < 80 && sat < 40) blackScore++;
                    if (g > 40 && g > r + 15 && g > b + 15) greenScore++;
                    if (r > 40 && r > g + 15) redScore++;
                }
            }

            const colorThreshold = blackScore * 0.3;
            if (greenScore > redScore && greenScore > colorThreshold) {
                if (greenScore > blackScore * 0.5) return 'green';
            }
            if (redScore > greenScore && redScore > colorThreshold) {
                if (redScore > blackScore * 0.5) return 'red';
            }
            return 'black';
        }

        // ---------------------------------------------------------
        // Existing Visualization & Math Functions (Merged & Cleaned)
        // ---------------------------------------------------------

        // ---------------------------------------------------------
        // 波形の色（standard / holter の切り替え用）
        // ---------------------------------------------------------
        // 暗いピクセル＝波形本体だけを見て、無彩色（黒）か有彩色（緑・赤）かを返す。
        // 薄い方眼は輝度が高いので自然に除外される。
        // 抽出モードを px/sec（どのプリセットに近いか）で決めてはいけない: 紙送りの縮尺と
        // ホルター記録かどうかは無関係で、赤方眼紙の標準心電図が holter 抽出に回ると
        // 方眼を波形として拾ってしまう。
        function detectTraceKind(imgData, width, height) {
            const step = Math.max(1, Math.floor(width / 300)); // 約300列をサンプリング
            let dark = 0, green = 0, red = 0;
            for (let x = 0; x < width; x += step) {
                for (let y = 0; y < height; y++) {
                    const i = (y * width + x) * 4;
                    const r = imgData[i], g = imgData[i + 1], b = imgData[i + 2];
                    const lum = 0.299 * r + 0.587 * g + 0.114 * b;
                    if (lum >= 120) continue;                  // 薄い方眼・背景を除外
                    dark++;
                    const sat = Math.max(r, g, b) - Math.min(r, g, b);
                    if (sat < 40) continue;                    // 無彩色（黒波形）
                    if (g > r + 15 && g > b + 15) green++;
                    else if (r > g + 15 && r > b + 15) red++;
                }
            }
            if (dark < 50) return 'black';                     // 判定材料不足は安全側
            if (green / dark > 0.25) return 'green';
            if (red / dark > 0.25) return 'red';
            return 'black';
        }

        // ============================================================
        // キャリブレーション自動計測
        //   方眼の縦線の位置をサブピクセルで求め、x_k = x0 + k·p の最小二乗で
        //   線間隔 p を推定し、1mm あたりの px 数 → 25mm(=1秒) の px 数に換算する。
        //
        //   1. gridColumnProfile : 格子色の強さを列ごとに合計（red / gray / ink）
        //   2. subtractFloor     : 横線・色かぶりによる一様な持ち上がりを除く
        //   3. gridLinePeaks     : 局所ピーク＝線。放物線内挿でサブピクセル化
        //   4. searchGridPeriod  : 周期を走査して最小二乗（外れ線は除外）
        //   5. resolveGridMm     : その間隔が 1mm か 5mm かを解釈
        //   採否は「残差」と「格子点の充足率」で決める。合わなければ検出失敗として
        //   プリセットに委ねる（誤った値を信頼表示するより安全）。
        // ============================================================
        const GRID_RED_MIN = 8;    // これ以下の赤みは背景とみなす
        const GRID_RED_SPAN = 32;  // 赤みがこの幅を超えたら重み1（淡くぼけた線も部分的に数える）

        // 格子らしさの列プロファイル。二値マスクではなく「格子色の強さ」を足し込むので、
        // 拡大縮小やJPEGで線がぼけて淡くなった画像でも線の位置が残る。
        //   red : 赤み = min(R-G, R-B)（黒トレース・白背景は 0）
        //   gray: 無彩色の中間輝度（黒トレースと白背景の間）
        function gridColumnProfile(imgData, width, height, kind) {
            const col = new Float32Array(width);
            const yStep = Math.max(1, Math.floor(height / 500));
            const rows = Math.ceil(height / yStep);
            let hit = 0;
            for (let x = 0; x < width; x++) {
                let c = 0;
                for (let y = 0; y < height; y += yStep) {
                    const i = (y * width + x) * 4;
                    const r = imgData[i], g = imgData[i + 1], b = imgData[i + 2];
                    let w = 0;
                    if (kind === 'red') {
                        w = (Math.min(r - g, r - b) - GRID_RED_MIN) / GRID_RED_SPAN;
                        if (w > 1) w = 1;
                    } else if (kind === 'gray') {
                        const sat = Math.max(r, g, b) - Math.min(r, g, b);
                        const lum = 0.299 * r + 0.587 * g + 0.114 * b;
                        if (sat < 25 && lum > 120 && lum < 235) w = 1;
                    } else {
                        // ink: 色を問わず「黒トレースでも白背景でもない」画素の濃さ
                        const lum = 0.299 * r + 0.587 * g + 0.114 * b;
                        if (lum > 120) w = (255 - lum) / 100;
                    }
                    if (w > 0) { c += w; hit++; }
                }
                col[x] = c;
            }
            return { col, frac: hit / (width * rows) };
        }

        // 列プロファイルから床（横線・背景の色かぶりによる一様な持ち上がり）を引く。
        // 床は ±4px の移動最小値。
        function subtractFloor(col) {
            const n = col.length, out = new Float32Array(n);
            for (let x = 0; x < n; x++) {
                let lo = col[x];
                for (let k = Math.max(0, x - 4); k <= Math.min(n - 1, x + 4); k++) if (col[k] < lo) lo = col[k];
                out[x] = col[x] - lo;
            }
            return out;
        }

        // 格子線＝床を引いたプロファイルの局所ピーク。放物線内挿でサブピクセル位置を得る。
        function gridLinePeaks(q, thr) {
            const idx = [];
            for (let x = 1; x < q.length - 1; x++) {
                if (q[x] >= q[x - 1] && q[x] > q[x + 1] && q[x] >= thr) idx.push(x);
            }
            const pos = [];
            for (let i = 0; i < idx.length; i++) {
                const a = idx[i], b = idx[i + 1];
                // 拡大された太い線は頂上が平らで極大が2つに割れる。3px以内で間の谷が浅ければ1本にまとめる
                if (b !== undefined && b - a <= 3) {
                    let dip = Infinity;
                    for (let x = a + 1; x < b; x++) if (q[x] < dip) dip = q[x];
                    const lo = Math.min(q[a], q[b]);
                    if (lo - dip < 0.5 * lo) {
                        let sw = 0, sxw = 0;
                        for (let x = a - 1; x <= b + 1; x++) { sw += q[x]; sxw += x * q[x]; }
                        pos.push(sxw / sw); i++; continue;
                    }
                }
                const den = q[a - 1] - 2 * q[a] + q[a + 1];
                let dx = Math.abs(den) > 1e-9 ? 0.5 * (q[a - 1] - q[a + 1]) / den : 0;
                if (!(Math.abs(dx) <= 1)) dx = 0;
                pos.push(a + dx);
            }
            return pos;
        }

        // 周期 p を仮定して各線に格子番号 k を割り当て、最小二乗で p を精緻化する。
        // 格子に乗らない線（色付き波形のQRS、文字など）は 1 回だけ除外して当てはめ直す。
        //   戻り: { p, x0, resid(px), n(採用本数), coverage(格子点の充足率) }
        function fitGridPeriod(pos, p) {
            const lsq = (idx, ks) => {
                let sk = 0, sx = 0, skk = 0, skx = 0;
                for (const i of idx) { sk += ks[i]; sx += pos[i]; skk += ks[i] * ks[i]; skx += ks[i] * pos[i]; }
                const den = idx.length * skk - sk * sk;
                if (Math.abs(den) < 1e-9) return null;
                const slope = (idx.length * skx - sk * sx) / den;
                return { slope, inter: (sx - slope * sk) / idx.length };
            };
            const all = pos.map((_, i) => i);
            let ks = pos.map(x => Math.round((x - pos[0]) / p));
            let f = lsq(all, ks);
            if (!f || !(f.slope > 0)) return null;
            // 当てはめた格子で番号を振り直し、格子点から 1/4 周期以上離れた線と、
            // 同じ格子点に重なった線（近い方だけ残す）を外す
            ks = pos.map(x => Math.round((x - f.inter) / f.slope));
            const bestOfK = new Map();
            for (const i of all) {
                const e = Math.abs(pos[i] - (f.inter + f.slope * ks[i]));
                if (e > 0.25 * f.slope) continue;
                const cur = bestOfK.get(ks[i]);
                if (!cur || e < cur.e) bestOfK.set(ks[i], { i, e });
            }
            const idx = [...bestOfK.values()].map(v => v.i);
            if (idx.length < 0.8 * pos.length) return null;   // 外れが多すぎる＝この周期は合っていない
            f = lsq(idx, ks);
            if (!f || !(f.slope > 0)) return null;
            let ss = 0, kMin = Infinity, kMax = -Infinity;
            for (const i of idx) {
                const e = pos[i] - (f.inter + f.slope * ks[i]); ss += e * e;
                if (ks[i] < kMin) kMin = ks[i];
                if (ks[i] > kMax) kMax = ks[i];
            }
            return { p: f.slope, x0: f.inter, resid: Math.sqrt(ss / idx.length), n: idx.length,
                     coverage: idx.length / (kMax - kMin + 1) };
        }

        // 周期候補を細かく走査し、最も多くの線を説明し残差が最小の解を選ぶ。
        // 初期値（隣接線間隔の中央値）をそのまま信用すると、真値 3.2px に対し 3px が
        // 自己無撞着な割り当てを作って誤った周期に収束する（エイリアシング）ため走査する。
        function searchGridPeriod(pos) {
            const d = [];
            for (let i = 1; i < pos.length; i++) { const v = pos[i] - pos[i - 1]; if (v > 0.8) d.push(v); }
            if (d.length < 5) return null;
            d.sort((a, b) => a - b);
            const p0 = d[Math.floor(d.length / 2)];
            let best = null;
            for (let p = p0 * 0.7; p <= p0 * 1.45; p += 0.002) {
                const f = fitGridPeriod(pos, p);
                if (!f) continue;
                if (Math.abs(f.p - p) > 0.15 * p) continue;   // 自己無撞着な解のみ採用
                if (!best || f.n > best.n || (f.n === best.n && f.resid < best.resid)) best = f;
            }
            return best;
        }

        // 線間隔 p が 1mm か 5mm かを解釈して 1mm の px 数を返す（解釈不能なら null）。
        //   gray（フクダ等のホルター印刷）: 5mm ボックスで描かれるので p≥10px なら 5mm。
        //   red : 通常の赤方眼は 1mm 線。ただし「5mm 実線＋1mm 点」の機種（日本光電
        //         ホルター）では点が線として拾えず p が 5mm になるので、minorGrid で見分ける。
        //   「5本に1本が強い」模様は 1mm/5mm でも 5mm/25mm でも現れるため判別に使えない。
        function resolveGridMm(p, kind, minorGrid) {
            const inRange = v => v >= 2.2 && v <= 30;        // 1mm=2.2〜30px（55〜750 px/sec）
            if (kind === 'gray') {
                if (p >= 10 && inRange(p / 5)) return p / 5;
                return inRange(p) ? p : null;
            }
            if (minorGrid && inRange(p / 5)) return p / 5;   // 5mm線＋1mm点（日本光電）
            if (inRange(p)) return p;
            if (inRange(p / 5)) return p / 5;                // 1mm線が薄く5mm線だけ拾えた場合
            return null;
        }

        // 線間隔 p の 1/5 刻み（0.2p〜0.8p）の位置に独立した局所ピークが並んでいる割合。
        // 1mm 点が打たれた 5mm 格子なら高く（実測 0.82〜0.93）、p 自体が 1mm 線の格子なら
        // 低い（実測 ≤0.13）。
        function minorGridRatio(q, x0, p) {
            const W = q.length;
            let lineSum = 0, ln = 0;
            for (let k = Math.ceil(-x0 / p); ; k++) {
                const b = x0 + k * p;
                if (b > W - 1) break;
                lineSum += q[Math.round(b)]; ln++;
            }
            if (!ln) return 0;
            const prom = 0.1 * (lineSum / ln);               // 突出の下限＝線の高さの1割
            const tol = Math.max(0.6, 0.04 * p);
            let hit = 0, tot = 0;
            for (let k = Math.ceil(-x0 / p) - 1; ; k++) {
                const b = x0 + k * p;
                if (b > W) break;
                for (const fr of [0.2, 0.4, 0.6, 0.8]) {
                    const c = b + fr * p;
                    if (c < 3 || c > W - 4) continue;
                    tot++;
                    for (let x = Math.ceil(c - tol); x <= Math.floor(c + tol); x++) {
                        if (q[x] > q[x - 1] && q[x] >= q[x + 1] && q[x] >= prom) { hit++; break; }
                    }
                }
            }
            return tot ? hit / tot : 0;
        }

        function detectCalibration(imgData, width, height) {
            for (const kind of ['red', 'gray']) {
                const { col, frac } = gridColumnProfile(imgData, width, height, kind);
                if (frac < 0.003) continue;
                const q = subtractFloor(col);
                // 基準の高さ: 上位の外れ列（色付き波形のQRSなど）に引きずられないよう上位2%+2本を除く
                const tops = Array.from(gridLinePeaks(q, 1e-6), x => q[Math.round(x)]).sort((a, b) => b - a);
                if (tops.length < 10) continue;
                const ref = tops[Math.min(tops.length - 1, Math.floor(tops.length * 0.02) + 2)];
                for (const t of [0.25, 0.15, 0.10]) {
                    const pos = gridLinePeaks(q, ref * t);
                    if (pos.length < 10) continue;
                    const fit = searchGridPeriod(pos);
                    if (!fit || fit.n < 10) continue;
                    const rr = fit.resid / fit.p;            // 格子の当てはまり具合
                    if (rr >= 0.12 || fit.coverage < 0.6) continue;
                    // 灰格子は印刷がくっきりした5mm格子のはずなので厳しく見る。JPEGで色が抜けた
                    // 赤方眼の0.5mm点を灰格子として拾うと半分の値になる（残差11%・充足62〜75%）。
                    if (kind === 'gray' && (rr >= 0.06 || fit.coverage < 0.85)) continue;
                    let minorGrid = false;
                    if (kind === 'red' && fit.p / 5 >= 2.2) {
                        // 1mm点は色ではなく濃さ(ink)で探す。JPEGは色の解像度を落とすので
                        // 赤みでは点が消えるが、輝度には残る。
                        const ink = subtractFloor(gridColumnProfile(imgData, width, height, 'ink').col);
                        minorGrid = minorGridRatio(ink, fit.x0, fit.p) >= 0.5;
                    }
                    const mm = resolveGridMm(fit.p, kind, minorGrid);
                    if (mm === null) continue;
                    const pxPerSec = Math.round(mm * 250) / 10;   // 0.1px/s 刻み
                    if (pxPerSec < 55 || pxPerSec > 750) continue;
                    return {
                        pxPerSec, method: 'auto-grid', confident: true,
                        debug: `${kind === 'red' ? (minorGrid ? '赤方眼(5mm線+1mm点)' : '赤方眼') : '灰格子'} 間隔${fit.p.toFixed(2)}px(=${Math.round(fit.p / mm)}mm) 線${fit.n}本 ` +
                            `残差${(rr * 100).toFixed(1)}% 充足${(fit.coverage * 100).toFixed(0)}% → 1mm=${mm.toFixed(3)}px → 25mm(1s)=${pxPerSec}px`
                    };
                }
            }
            return { pxPerSec: 0, method: 'none', confident: false, debug: '格子を検出できませんでした' };
        }

        function updateCalDisplay(index, pxPerSec, method) {
            const calDisplay = document.getElementById(`calDisplay${index}`);
            const calMethodEl = document.getElementById(`calMethod${index}`);
            if (!calDisplay || !calMethodEl) return;

            calDisplay.textContent = `${pxPerSec} px/sec (25mm=1s)`;
            const calInput = document.getElementById(`calInput${index}`);
            if (calInput) calInput.value = pxPerSec;

            calMethodEl.className = 'cal-method';
            if (method === 'auto-grid') {
                calMethodEl.textContent = 'グリッド実測';
                calMethodEl.classList.add('auto-scale');
            } else if (method === 'grid-fallback') {
                calMethodEl.textContent = '検出失敗（仮の値）';
                calMethodEl.classList.add('grid-fallback');
            } else if (method === 'drag') {
                calMethodEl.textContent = 'ドラッグ補正';
                calMethodEl.classList.add('drag');
            } else if (method && method.startsWith('preset-')) {
                const presetName = method.replace('preset-', '');
                calMethodEl.textContent = 'プリセット: ' + (PRESET_NAMES[presetName] || presetName);
                calMethodEl.classList.add('manual');
            }
        }

        function syncCalibrationToOther(sourceIndex, newPxPerSec, method) {
            const otherIndex = sourceIndex === 1 ? 2 : 1;
            const otherEntry = canvasRegistry[otherIndex];
            if (!otherEntry) return;

            const otherCanvas = otherEntry.canvas;
            const otherState = otherCanvas.appState;
            if (!otherState) return;

            otherState.pxPerSec = newPxPerSec;
            otherState.calMethod = method;

            updateCalDisplay(otherIndex, newPxPerSec, method);

            otherState.manualTEnds = {};
            otherState.manualQOnsets = {};

            // 縮尺だけの変更なので波形抽出・R波検出はやり直さず、拍の解析だけやり直す
            analyzeBeats(otherState);
            renderCanvas(otherCanvas, otherState);
            updateTable(otherEntry.container, otherState, otherIndex);
        }

        // =========================================================
        // 拍の解析（基線 → Q-onset → T-end → QT）
        // =========================================================
        //   analyzeBeats        全体の流れ
        //   estimatePrLevel     基線＝QRS直前の等電位部（PRセグメント）の高さ
        //   resolveBaselines    拍ごとの基線を確定（手動 > PR部 > 他拍の中央値）
        //   coarseQOnset        Q-onset: 基線から離れ始める点
        //   refineQOnset        Q-onset: トレース中心線による精密化
        //   tWaveGates          T波を探す時間範囲
        //   measureTEnd         接線法による T-end
        //   measureManualTangent 接点を手動指定したときの T-end
        // ---------------------------------------------------------

        // 配列の中央値（元の配列は変更しない。偶数個のときは上側）
        function medianOf(arr) {
            const a = [...arr].sort((x, y) => x - y);
            return a[Math.floor(a.length / 2)];
        }

        // 平滑中央差分（±2px）: 単一ピクセルノイズに頑健な勾配
        function smoothedSlope(sm, k, width) {
            const a = sm[Math.max(0, k - 2)], b = sm[Math.min(width - 1, k + 2)];
            return (b - a) / 4;
        }

        // QRS の探索窓（R波の手前 120ms）と、その中の最大勾配から決める「平坦」の閾値
        function qrsWindow(smooth, width, rLoc, prevR, pxPerSec) {
            const qLimit = Math.max(prevR + 10, Math.floor(rLoc - 0.12 * pxPerSec));
            let maxSlope = 0;
            for (let k = qLimit; k <= rLoc; k++) {
                const s = Math.abs(smoothedSlope(smooth, k, width));
                if (s > maxSlope) maxSlope = s;
            }
            return { qLimit, maxSlope, slopeTol: Math.max(0.02 * pxPerSec / 25, 0.10 * maxSlope) };
        }

        // ---------------------------------------------------------
        // 基線 = PRセグメント（QRS直前の等電位部）の高さ
        // ---------------------------------------------------------
        // Q波はここから離れ始め、接線法の T-end もこの高さとの交点で決める。
        // R波から後方へ遡り、平坦なサンプルが N 個続く最初の区間を PR部とみなして、
        // そこから 40ms 分の平坦サンプルの中央値を返す。見つからなければ null。
        //   ・「N 個続く」を要求するのは、rS型（rLoc がS波の谷）で遡るとまず R波の頂点を
        //     通るため。頂点は平坦でも 1〜2 サンプルしか続かないので素通りできる。
        //   ・前R〜Qの広い区間の最頻値で決める方式は、ST部・T波・P波を巻き込んで
        //     PR部より 1mm 以上高く出ることがあるため使わない（estimateIsoelectric 参照）。
        function estimatePrLevel(smooth, width, rLoc, prevR, pxPerSec) {
            const { qLimit, slopeTol } = qrsWindow(smooth, width, rLoc, prevR, pxPerSec);
            if (qLimit >= rLoc - 2) return null;
            const floorK = Math.max(prevR + 5, Math.floor(rLoc - 0.25 * pxPerSec));
            const isFlat = k => Math.abs(smoothedSlope(smooth, k, width)) <= slopeTol;
            const N = Math.max(3, Math.round(0.020 * pxPerSec));
            let start = -1;
            for (let k = rLoc - 1, run = 0; k > floorK; k--) {
                if (isFlat(k)) { if (++run >= N) { start = k + run - 1; break; } }
                else run = 0;
            }
            if (start < 0) return null;
            const span = Math.max(4, Math.round(0.040 * pxPerSec));
            const vals = [];
            for (let j = start; j > Math.max(floorK, start - span); j--) {
                if (isFlat(j)) vals.push(smooth[j]);
            }
            return vals.length >= 3 ? medianOf(vals) : null;
        }

        // 最後の手段の基線: 前R+100ms 〜 QRS手前の区間で、信号が最も長く留まる高さ
        // （2px ビンのヒストグラム最頻値）。どの拍でも PR部が取れなかったときだけ使う。
        function estimateIsoelectric(smooth, prevR, qEnd, pxPerSec) {
            const start = Math.max(prevR + Math.floor(0.10 * pxPerSec), prevR + 6);
            const end = Math.max(qEnd, start + 1);
            if (end - start < 4) {
                const vals = [];
                for (let k = Math.max(prevR + 3, qEnd - 15); k < qEnd; k++) vals.push(smooth[k]);
                return vals.length ? medianOf(vals) : smooth[qEnd];
            }
            let lo = Infinity, hi = -Infinity;
            for (let k = start; k < end; k++) { const v = smooth[k]; if (v < lo) lo = v; if (v > hi) hi = v; }
            const bin = 2;
            const hist = new Int32Array(Math.floor((hi - lo) / bin) + 1);
            for (let k = start; k < end; k++) hist[Math.floor((smooth[k] - lo) / bin)]++;
            let bestBin = 0;
            for (let b = 1; b < hist.length; b++) if (hist[b] > hist[bestBin]) bestBin = b;
            const vals = [];
            for (let k = start; k < end; k++) {
                const v = smooth[k];
                if (v >= lo + (bestBin - 0.5) * bin && v <= lo + (bestBin + 1.5) * bin) vals.push(v);
            }
            return vals.length ? medianOf(vals) : lo + (bestBin + 0.5) * bin;
        }

        // 拍ごとの基線を確定する: 手動指定 > その拍の PR部 > 他の拍の中央値。
        // PR部が他の拍の中央値から大きく外れた拍（P波や r波を誤って拾った等）も中央値に寄せる。
        // 許容幅は 1mm（0.1mV）か、拍間のばらつき(MAD)の3倍の大きい方。呼吸などによる
        // 実際の基線の揺れ（実測で ±0.7mm 程度）は外れ扱いにしない。
        function resolveBaselines(state, meta) {
            const { smooth, pxPerSec } = state;
            const prs = meta.map(m => m.prLevel).filter(v => v != null && isFinite(v));
            let common = null, tol = Infinity;
            if (prs.length) {
                common = medianOf(prs);
                const mad = medianOf(prs.map(v => Math.abs(v - common)));
                tol = Math.max(4, pxPerSec / 25, 3 * mad);
            }
            for (const m of meta) {
                if (state.manualBaselines[m.beatId] !== undefined) {
                    m.baseline = state.manualBaselines[m.beatId];
                } else if (m.prLevel != null && isFinite(m.prLevel) && Math.abs(m.prLevel - common) <= tol) {
                    m.baseline = m.prLevel;
                } else if (common != null) {
                    m.baseline = common;
                } else {
                    const qEnd = Math.max(m.prevR + 7, m.rLoc - Math.max(3, Math.round(0.04 * pxPerSec)));
                    m.baseline = estimateIsoelectric(smooth, m.prevR, qEnd, pxPerSec);
                }
            }
        }

        // ---------------------------------------------------------
        // Q-onset
        // ---------------------------------------------------------
        // Part 1 (coarseQOnset): 基線離脱点
        //   R極値から後方へ遡り、最初に「基線上かつ平坦」が N px 続く区間を見つけ、
        //   その区間の R側の端を onset とする。これで次の3形態を1本のロジックで扱える。
        //     (1) Q波あり → 基線からQ波へ移る点
        //     (2) Q波なし → 基線からR波へ移る点
        //     (3) QS型    → 基線から下がり始める点
        //   「N px 続く」が要点: Q波の谷底や r波の頂点も一瞬は平坦だが続かないので素通りする。
        //
        // Part 2 (refineQOnset): トレース中心線による精密化
        //   浅いQ波は抽出信号では線の太さに埋もれやすいので、Q-onset 付近に限り
        //   生画素からトレースの重心を取り直して離脱点を確定する。
        // ---------------------------------------------------------

        const CL_LUM_THRESHOLD = 160; // 中心線抽出の暗画素判定輝度

        // 指定区間のトレース中心線を前列追従で抽出（imgDataのy座標系で返す）
        function extractCenterline(imgData, width, height, x0, x1, anchorY) {
            const n = x1 - x0 + 1;
            const out = new Float32Array(n);
            let prev = anchorY;
            for (let x = x0; x <= x1; x++) {
                let bestC = null, bestD = Infinity;
                let runTop = -1, wsum = 0, ysum = 0;
                for (let y = 1; y < height - 1; y++) {
                    const i = (y * width + x) * 4;
                    const r = imgData[i], g = imgData[i + 1], b = imgData[i + 2];
                    const isGrid = (r > 100 && r > g + 30 && r > b + 30); // 赤方眼紙を除外
                    const lum = 0.299 * r + 0.587 * g + 0.114 * b;
                    if (!isGrid && lum < CL_LUM_THRESHOLD) {
                        const wt = CL_LUM_THRESHOLD - lum;
                        if (runTop < 0) { runTop = y; wsum = wt; ysum = y * wt; }
                        else { wsum += wt; ysum += y * wt; }
                    } else if (runTop >= 0) {
                        const c = ysum / wsum;
                        const d = Math.min(Math.abs(c - prev), Math.abs(runTop - prev), Math.abs(y - 1 - prev));
                        if (d < bestD) { bestD = d; bestC = c; }
                        runTop = -1;
                    }
                }
                if (runTop >= 0) {
                    const c = ysum / wsum;
                    const d = Math.min(Math.abs(c - prev), Math.abs(runTop - prev), Math.abs(height - 2 - prev));
                    if (d < bestD) { bestD = d; bestC = c; }
                }
                if (bestC !== null) prev = bestC;   // 暗画素が無い列は前列値を維持
                out[x - x0] = prev;
            }
            return out;
        }

        // Part 1: 基線離脱点。戻り: 位置(px)
        //   baseline: その拍の基線（手動指定のこともある） / prLevel: PR部の実測（null可）
        function coarseQOnset(smooth, width, rLoc, prevR, baseline, prLevel, pxPerSec) {
            const pxPerMm = pxPerSec / 25;
            const { qLimit, maxSlope, slopeTol } = qrsWindow(smooth, width, rLoc, prevR, pxPerSec);
            if (qLimit >= rLoc - 2) return rLoc;

            const A = Math.abs(smooth[rLoc] - baseline);                       // QRS振幅
            // 基線からの許容幅: 0.5mm か QRS振幅の6% の小さい方。ただし 4px 未満にはしない
            // （1mm<8px の画像では PR部のゆるい傾きだけで 0.5mm を超えて run が途切れるため）。
            const ampTol = Math.max(4, Math.min(0.50 * pxPerMm, Math.max(0.15 * pxPerMm, 0.06 * A)));
            const N = Math.max(3, Math.round(0.010 * pxPerSec));               // 持続10ms
            // 高さの基準は PR部の実測。基線が手動で大きく動かされているときは基線に従う。
            const ref = (prLevel != null && Math.abs(prLevel - baseline) <= 1.5 * pxPerMm) ? prLevel : baseline;

            let coarse = -1;
            for (let k = rLoc - 1, run = 0; k >= qLimit; k--) {
                if (Math.abs(smooth[k] - ref) <= ampTol && Math.abs(smoothedSlope(smooth, k, width)) <= slopeTol) {
                    if (++run >= N) { coarse = k + run - 1; break; }
                } else {
                    run = 0;
                }
            }
            // 予備1: 持続条件を外し、平坦かつ基線から遠すぎない最初の点。
            //   「遠すぎない」(QRS振幅の25%以内) は、rS型で R波の頂点に止まらないために必要。
            if (coarse < 0) {
                const farTol = Math.max(ampTol, 0.25 * A);
                for (let k = rLoc - 1; k >= qLimit; k--) {
                    if (Math.abs(smoothedSlope(smooth, k, width)) <= 0.20 * maxSlope &&
                        Math.abs(smooth[k] - ref) <= farTol) { coarse = k; break; }
                }
            }
            // 予備2: 探索窓の端
            if (coarse < 0) coarse = qLimit;
            // R頂点そのものは onset になり得ない
            const guard = Math.max(3, Math.floor(0.01 * pxPerSec));
            return Math.min(coarse, rLoc - guard);
        }

        // Part 2: 中心線で離脱点を精密化
        //   戻り: { onset, gateOK }  gateOK=false は解像度/基線ノイズ不足でPart2を適用できない
        function refineQOnset(state, prevR, baseline, coarse) {
            const { imgData, width, height, pxPerSec } = state;
            const pxPerMm = pxPerSec / 25;
            const N = Math.max(3, Math.round(0.010 * pxPerSec));
            const back = Math.max(N, Math.round(0.020 * pxPerSec));   // 精密化区間 20ms
            const fwd = Math.max(1, Math.round(0.004 * pxPerSec));
            const noiseLen = Math.max(10, Math.floor(0.040 * pxPerSec)); // 基線ノイズ計測窓 40ms
            const bandStart = coarse - back;
            const nStart = Math.max(prevR + 5, bandStart - noiseLen);
            if (bandStart - nStart < 6) return { onset: coarse, gateOK: false };
            const xEnd = Math.min(width - 2, coarse + fwd);
            if (xEnd <= bandStart) return { onset: coarse, gateOK: false };

            const cl = extractCenterline(imgData, width, height, nStart, xEnd, height - baseline);
            const at = (x) => cl[x - nStart];

            // 基線窓の中央値と最大偏位
            const nv = [];
            for (let x = nStart; x <= bandStart; x++) nv.push(at(x));
            nv.sort((a, b) => a - b);
            const mu = nv[Math.floor(nv.length / 2)];
            let maxDev = 0;
            for (let x = nStart; x <= bandStart; x++) {
                const d = Math.abs(at(x) - mu);
                if (d > maxDev) maxDev = d;
            }
            // τは「基線窓の最大偏位」から決める（MAD等のロバスト推定では
            // 基線ゆらぎを外れ値として捨ててしまい、誤発火して早い側に外れる）
            const ceiling = 0.40 * pxPerMm;   // 生理的離脱幅の上限 ≒0.4mm(0.04mV)
            const tauRaw = 1.2 * maxDev;
            if (tauRaw > ceiling) return { onset: coarse, gateOK: false }; // 基線ノイズ過大
            const tau = Math.max(tauRaw, 0.10 * pxPerMm);

            // bandを前方走査し、τを超える離脱がM px持続する最初の点
            //  （後方走査ではq→rの基線交差点で誤停止し、極値基準ではr波に極値を取られる）
            const M = Math.max(2, Math.round(0.004 * pxPerSec));
            for (let x = bandStart; x <= xEnd; x++) {
                if (Math.abs(at(x) - mu) <= tau) continue;
                let ok = true;
                for (let j = x; j < Math.min(x + M, xEnd + 1); j++) {
                    if (Math.abs(at(j) - mu) <= tau) { ok = false; break; }
                }
                if (ok) return { onset: x, gateOK: true };
            }
            return { onset: coarse, gateOK: true }; // 離脱点を見つけられず
        }

        // 全拍の Q-onset を決める（手動指定が最優先）。
        // Part 2 を使うかどうかは拍ごとではなく画像単位の多数決で決める。拍ごとに切り替えると
        // 同じ画像の中で方式が混ざり、拍間で 1〜2px の系統差が出て QT のばらつきが増える。
        function resolveQOnsets(state, meta) {
            const { smooth, width, pxPerSec } = state;
            let gateOK = 0;
            for (const m of meta) {
                m.coarseQ = coarseQOnset(smooth, width, m.rLoc, m.prevR, m.baseline, m.prLevel, pxPerSec);
                const res = refineQOnset(state, m.prevR, m.baseline, m.coarseQ);
                m.refinedQ = res.onset;
                m.refineGateOK = res.gateOK;
                if (res.gateOK) gateOK++;
            }
            const useRefine = meta.length > 0 && gateOK * 2 > meta.length;
            state.qOnsetMode = useRefine ? 'centerline' : 'coarse';
            for (const m of meta) {
                m.qOnset = (state.manualQOnsets[m.beatId] !== undefined) ? state.manualQOnsets[m.beatId]
                    : (useRefine && m.refineGateOK) ? m.refinedQ : m.coarseQ;
            }
        }

        // ---------------------------------------------------------
        // T波を探す時間範囲（RR に合わせて伸縮する）
        // ---------------------------------------------------------
        // 高心拍（≈150bpm, RR≈400ms）では T波と次の P波が接近するので、各境界を
        // 「絶対時間」と「RR の割合」の小さい方に制限する。低心拍では絶対時間が、
        // 高心拍では RR 比が効く。
        //   tStart     : QRS直後（100ms か RRの18%）
        //   tLimit     : T波下行脚を探す上限（次R手前のP波を避け、RRの85%以内）
        //   tPeakLimit : T頂点を探す上限（tLimit よりさらに手前。P波を頂点と誤らないため）
        function tWaveGates(rLoc, nextR, pxPerSec) {
            const rrLen = nextR - rLoc;
            const tStart = Math.floor(rLoc + Math.min(Math.max(0.10 * pxPerSec, 16), 0.18 * rrLen));
            const pGuard = Math.min(Math.max(0.12 * pxPerSec, 18), 0.28 * rrLen);
            const tLimit = Math.min(nextR - pGuard, rLoc + Math.min(Math.max(0.80 * pxPerSec, 0.55 * rrLen), 0.85 * rrLen));
            const tPeakLimit = Math.max(tStart + 1,
                Math.min(tLimit, nextR - Math.min(Math.max(0.14 * pxPerSec, 24), 0.30 * rrLen)));
            return { tStart, tLimit, tPeakLimit };
        }

        // T波の極性: 探索範囲の最大・最小のうち、基線から遠い方が T波
        function tWaveIsNegative(smooth, from, to, baseline) {
            let hi = -Infinity, lo = Infinity;
            for (let k = from; k < to; k++) {
                if (smooth[k] > hi) hi = smooth[k];
                if (smooth[k] < lo) lo = smooth[k];
            }
            return Math.abs(lo - baseline) > Math.abs(hi - baseline);
        }

        // ---------------------------------------------------------
        // 接線法による T-end
        // ---------------------------------------------------------
